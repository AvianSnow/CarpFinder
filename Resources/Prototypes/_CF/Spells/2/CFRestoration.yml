- type: entity
  parent: CFSpellTarget
  id: CFRestoration
  name: Restoration
  description: You ease the target's condition and restore 2d8 Hit Points.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 2
  - type: CFSpell
    spell: Restoration
    rank: 2
  - type: CFTargeting
    rangeFeet: 5
    touch: true
    filter: All
  - type: CFDegreeEffects
    landed:
    - !type:CFHealEffect
      dice: 2
      die: 8
  - type: EntityTargetAction
    canTargetSelf: true
