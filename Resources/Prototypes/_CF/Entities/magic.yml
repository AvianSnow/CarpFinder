- type: entity
  id: CFBaseMagicImpact
  name: magic impact
  description: Manifestation of magical energy in the physical plane.
  abstract: true
  components:
  - type: TimedDespawn
    lifetime: 1.6
  - type: AnimationPlayer
  - type: Tag
    tags:
    - HideContextMenu
  - type: Sprite
    drawdepth: Effects
    sprite: _CP14/Effects/Magic/cast_impact.rsi
    noRot: true

# Spawned by CFVfxSystem, which also sets the colour. The sprites are white so they tint cleanly.
- type: entity
  id: CFVfxCast
  parent: CFBaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: CFVfx
  - type: Sprite
    noRot: true
    drawdepth: Effects
    sprite: _CP14/Effects/Magic/cast_impact.rsi
    layers:
    - state: circle_increase
      shader: unshaded
    - state: particles_up
      shader: unshaded

- type: entity
  id: CFVfxTargeted
  parent: CFBaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: CFVfx
  - type: Sprite
    noRot: true
    drawdepth: Effects
    sprite: _CP14/Effects/Magic/cast_impact.rsi
    layers:
    - state: stars
      shader: unshaded

- type: entity
  id: CFVfxHealing
  parent: CFBaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: CFVfx
  - type: Sprite
    noRot: true
    drawdepth: Effects
    sprite: _CP14/Effects/Magic/cast_impact.rsi
    layers:
    - state: wave_up
      shader: unshaded
    - state: particles_up
      shader: unshaded
