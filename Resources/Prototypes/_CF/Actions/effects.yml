- type: entity
  parent: CFActivityTarget
  id: CFActRootToLife
  name: Root to Life
  description: A dying creature beside you is stabilized.
  components:
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:CFActivityTargetEvent
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFStabilizeEffect {}

- type: entity
  parent: CFActivityTarget
  id: CFActDivineDisharmony
  name: Divine Disharmony
  description: Clashing holy symbols distract a creature within 60 feet, Intimidation against its Will DC. On a success it is off-guard to you for 6 seconds, 12 on a critical success.
  components:
  - type: TargetAction
    range: 12.25
  - type: CFEffectAction
  - type: CFCheck
    defense: Will
    skill: Intimidation
    basicSave: false
  - type: CFDegreeEffects
    success:
    - !type:CFOffGuardEffect
      toUser: true
    criticalSuccess:
    - !type:CFOffGuardEffect
      toUser: true
      durationSeconds: 12

# Inventor feats. CFInventorSystem runs the ones with a component of their own.
- type: entity
  parent: CFActivityTarget
  id: CFActTamper
  name: Tamper
  description: With a free hand, Crafting against the Reflex DC of an enemy in reach. Its held weapon takes -2 to attack and damage rolls, or with no weapon its armor leaves it off-guard and 10 feet slower. 6 seconds, a minute on a critical success. A critical failure burns you for your level.
  components:
  - type: CFTamperAction
  - type: CFEffectAction
    needsFreeHand: true
  - type: CFTrait
    traits:
    - Manipulate
  - type: CFCheck
    defense: Reflex
    skill: Crafting
    basicSave: false
  - type: CFDegreeEffects
    criticalSuccess:
    - !type:CFTamperEffect
      durationSeconds: 60
    success:
    - !type:CFTamperEffect
      durationSeconds: 6
    criticalFailure:
    - !type:CFTamperEffect
      backfire: true

- type: entity
  parent: CFActivityInstant
  id: CFActCollapseArmor
  name: Collapse Armor
  description: Your armor innovation comes off into your hand at once, or a collapsed one you hold unfolds onto you.
  components:
  - type: CFCollapseArmorAction
  - type: CFTrait
    traits:
    - Manipulate

- type: entity
  parent: CFActivityInstant
  id: CFActCollapseConstruct
  name: Collapse Construct
  description: Your construct innovation, beside you, folds into a case you carry. Use it again with the case to unfold it, with the Hit Points it had.
  components:
  - type: CFCollapseConstructAction
  - type: CFTrait
    traits:
    - Manipulate

- type: entity
  parent: CFActivityInstant
  id: CFActHaphazardRepair
  name: Haphazard Repair
  description: Repair your construct innovation, beside you, in a moment. Crafting against the DC of your level restores 10 Hit Points and 5 more per rank of Crafting, or 10 more per rank on a critical success. A critical failure deals 2d6 to it. An unstable action.
  components:
  - type: CFHaphazardRepairAction

- type: entity
  parent: CFActivityInstant
  id: CFActOilFire
  name: Oil Fire
  description: Douse the foe you have grabbed in oil from your gauntlets and light it. Reflex against your class DC. It slips free on a success and takes 1 persistent fire damage, half your level on a failure, your level on a critical failure. An unstable action.
  components:
  - type: CFEffectAction
    unstable: true
    needsGrabbedFoe: true
  - type: CFTrait
    traits:
    - Fire
    - Manipulate
  - type: CFCheck
    defense: Reflex
    dcSource: Class
    basicSave: false
  - type: CFDegreeEffects
    criticalSuccess:
    - !type:CFReleaseGrabEffect {}
    success:
    - !type:CFReleaseGrabEffect {}
    - !type:CFDamageEffect
      damageType: Fire
      scaleByDegree: false
      persistentFlat: 1
    failure:
    - !type:CFDamageEffect
      damageType: Fire
      scaleByDegree: false
      persistentFlatPerLevel: 0.5
    criticalFailure:
    - !type:CFDamageEffect
      damageType: Fire
      scaleByDegree: false
      persistentFlatPerLevel: 1

- type: entity
  parent: CFActivityInstant
  id: CFActSwitchConfiguration
  name: Switch Configuration
  description: Your held weapon innovation becomes its other form, with the same modification. Costs 2 actions.
  components:
  - type: CFRadialSlot
    actions: 2
  - type: CFSwitchConfigurationAction
  - type: CFTrait
    traits:
    - Manipulate

# Guardian
- type: entity
  parent: CFActivityTarget
  id: CFActFlyingTackle
  name: Flying Tackle
  description: Rush up to 25 feet at an enemy and Trip it. A success on the Athletics check is a critical success. Costs 2 actions. A flourish.
  components:
  - type: TargetAction
    range: 6.5
  - type: CFRadialSlot
    actions: 2
  - type: CFFlourish
  - type: CFEffectAction
    closesFeet: 25
  - type: CFDegreeEffects
    effects:
    - !type:CFTripEffect
      successIsCritical: true

- type: entity
  parent: CFActivityInstant
  id: CFActShieldedAttrition
  name: Shielded Attrition
  description: "Raise your shield and draw every enemy within 10 feet: each spends its reaction, so none is left for your allies."
  components:
  - type: CFEffectAction
    raisesShield: true
  - type: CFDegreeEffects
    effects:
    - !type:CFSpendEnemyReactionsEffect
      feet: 10
