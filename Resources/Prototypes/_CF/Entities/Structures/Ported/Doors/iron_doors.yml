# Ported from CP14 by the CF converter.

- type: entity
  id: CFIronDoor
  parent:
  - CFBaseDoor
  name: iron door
  description: Well, if there's a solid iron door, there must be something valuable behind it.
  suffix: Opened
  components:
  - type: Sprite
    sprite: _CP14/Structures/Doors/iron_door.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Door
    openSound:
      path: /Audio/Effects/door_open.ogg
    closeSound:
      path: /Audio/Effects/door_close.ogg
  - type: Damageable
    damageModifierSet: CFMetallicStructural
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:ChangeConstructionNodeBehavior
        node: CFIronDoorFrame
  - type: Construction
    graph: CFIronDoor
    node: CFIronDoor

- type: entity
  id: CFIronDoorMirrored
  parent: CFIronDoor
  suffix: Opened, Mirrored
  components:
  - type: Door
    openSpriteState: open_mirrored
    closedSpriteState: closed_mirrored
  - type: Construction
    graph: CFIronDoor
    node: CFIronDoorMirrored
