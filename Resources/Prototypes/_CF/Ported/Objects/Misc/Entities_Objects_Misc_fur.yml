- type: entity
  id: CFFurBase
  parent: BaseItem
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _CP14/Objects/Misc/fur.rsi

# ================
# Fur Types

- type: entity
  id: CFCheapFur
  parent: CFFurBase
  name: cheap fur
  description: Thin, uneven fur that is only good for wiping your feet on.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _CP14/Objects/Misc/fur.rsi
    state: cheap_fur

- type: entity
  id: CFFur
  parent: CFFurBase
  name: fur
  description: Ordinary fur, intended for everyday use and carpets.
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _CP14/Objects/Misc/fur.rsi
    state: fur

- type: entity
  id: CFGoodFur
  parent: CFFurBase
  name: soft fur
  description: Good, pleasant fur, perfect for fur coats and insulation.
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,1,2 # 2x3
  - type: Sprite
    sprite: _CP14/Objects/Misc/fur.rsi
    state: good_fur
