# Carpfinder longbow — 1d8 P, range 100 ft, deadly d10, volley 30 ft.
# Uses stock SS14 bow/arrow pipeline; CFRangedWeapon replaces projectile damage with PF2e Strikes.

- type: entity
  parent: BaseBow
  id: CFLongbow
  name: longbow
  description: A 5-foot elm longbow. 1d8 piercing, range 100 feet, deadly d10, volley 30 feet.
  components:
    - type: Sprite
      sprite: _CP14/Objects/Weapons/Ranged/bow.rsi
      layers:
        - state: unwielded
          map: [base]
        - state: unwielded-arrow
          map: [arrow]
          visible: false
    - type: Item
      size: Large
      sprite: _CP14/Objects/Weapons/Ranged/bow.rsi
    - type: Clothing
      sprite: _CP14/Objects/Weapons/Ranged/bow.rsi
      quickEquip: false
      slots:
      - neck
    - type: Appearance
    - type: ItemMapper
      spriteLayers:
        - arrow
      mapLayers:
        arrow:
          whitelist:
            tags:
              - Arrow
    - type: GenericVisualizer
      visuals:
        enum.WieldableVisuals.Wielded:
          arrow:
            True: { state: wielded-arrow }
            False: { state: unwielded-arrow }
          base:
            True: { state: wielded }
            False: { state: unwielded }
    - type: ItemSlots
      slots:
        projectiles:
          name: Projectiles
          startingItem: CFArrow
          insertSound: /Audio/Weapons/Guns/Misc/arrow_nock.ogg
          whitelist:
            tags:
              - Arrow
    - type: CFWeapon
      damageDie: 8
      damageType: Piercing
      category: Martial
      group: Bow
      hands: OnePlus
    - type: CFRangedWeapon
      rangeIncrementFeet: 100
    - type: CFTrait
      traits:
      - DeadlyD10
      - Volley30
    - type: CFItem
      level: 0
    - type: CFBulk
      bulk: 2
    - type: CFItemPrice
      copper: 600 # 6 gp

- type: entity
  parent: ArrowRegular
  id: CFArrow
  name: arrow
  description: A wooden arrow for a Carpfinder longbow.
  components:
    - type: Projectile
      deleteOnCollide: false
      onlyCollideWhenShot: true
      # Stock damage zeroed — CFStrikeSystem resolves piercing from the bow.
      damage:
        types:
          Piercing: 0
    # Ten arrows are light Bulk, so one arrow is negligible.
    - type: CFBulk
      bulk: 0

- type: entity
  parent: ClothingBeltQuiver
  id: CFQuiverFilled
  name: quiver
  description: A quiver packed with arrows for a longbow.
  components:
    - type: EntityTableContainerFill
      containers:
        storagebase: !type:AllSelector
          children:
            - id: CFArrow
            - id: CFArrow
            - id: CFArrow
            - id: CFArrow
            - id: CFArrow
            - id: CFArrow
            - id: CFArrow
            - id: CFArrow
            - id: CFArrow
            - id: CFArrow
            - id: CFArrow
            - id: CFArrow
            - id: CFArrow
            - id: CFArrow
            - id: CFArrow
