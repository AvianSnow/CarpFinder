# Ported from CP14 by the CF converter.

- type: entity
  id: CFPaperFolderBase
  abstract: true
  parent: BaseStorageItem
  categories: [ ForkFiltered ]
  name: folder
  description: A folder filled with some paperwork.
  components:
  - type: Item
    size: Small
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,4,3
    whitelist:
      tags:
        - Document
  - type: Tag
    tags:
    - Folder
  - type: StorageFill
    contents:
      - id: CFPaper
        prob: 1
      - id: CFPaper
        prob: 1
      - id: CFPaper
        prob: 0.8
      - id: CFPaper
        prob: 0.6
      - id: CFPaper
        prob: 0.4
      - id: CFPaper
        prob: 0.2
  - type: ContainerContainer
    containers:
      storagebase: !type:Container

- type: entity
  id: CFPaperFolderBlue
  parent: CFPaperFolderBase
  components:
  - type: Sprite
    sprite: _CP14/Objects/Bureaucracy/paper.rsi
    state: folder_blue

- type: entity
  id: CFPaperFolderRed
  parent: CFPaperFolderBase
  components:
  - type: Sprite
    sprite: _CP14/Objects/Bureaucracy/paper.rsi
    state: folder_red
