# Recipes of our own for weapons. CP14 built these from modular parts, so there is no count to copy.
# Counts follow CP14's anvil shields: bars for the metal, planks for the haft. Level comes from each result's CFItem.

- type: craftingRecipe
  id: Dagger
  tag: CFRecipeAnvil
  craftTime: 2
  requirements:
  - !type:CFStackRequirement
    stack: CFIronBar
    count: 1
  result: CFDagger

