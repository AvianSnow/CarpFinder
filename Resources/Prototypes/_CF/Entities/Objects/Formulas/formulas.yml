- type: entity
  abstract: true
  parent: BaseItem
  id: CFBaseFormula
  name: formula
  description: A schematic on rolled-up parchment. Read it in hand to learn it.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    state: paper_words
  - type: CFBulk
    bulk: 0.1
  - type: CFItemPrice
    copper: 50 # level 0 formula: 5 sp

# A handbook per trade: reading one teaches every common level 0 recipe of its kind.
# A recipe above level 0 still needs its own formula.
- type: entity
  abstract: true
  parent: BaseItem
  id: CFBaseFormulaBook
  description: A trade's handbook. Read it in hand to learn its recipes.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Objects/Misc/books.rsi
  - type: CFItem
    level: 0
  - type: CFBulk
    bulk: 0.1
  - type: CFItemPrice
    copper: 50 # ours: 5 sp, the price of one level 0 formula

- type: entity
  parent: CFBaseFormulaBook
  id: CFFormulaBookTools
  name: toolmaker's handbook
  description: Formulas for tools, from a bucket to a set of scissors. Read it in hand to learn them.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_base
      color: "#6b4a2b"
    - state: icon_wrench
    - state: detail_rivets
  - type: CFFormula
    categories:
    - Tools

