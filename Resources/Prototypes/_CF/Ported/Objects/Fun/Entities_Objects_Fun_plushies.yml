# Ported from CP14 by the CF converter.

- type: entity
  parent: BaseItem
  id: CFBasePlushie
  categories: [ ForkFiltered ]
  abstract: true
  components:
  - type: Sprite
    sprite: _CP14/Objects/Fun/plushies.rsi
  - type: Item
    size: Normal
  - type: EmitSoundOnUse
    sound:
      collection: ToySqueak
  - type: EmitSoundOnActivate
    sound:
      collection: ToySqueak
  - type: EmitSoundOnCollide
    sound:
      collection: ToySqueak
  - type: EmitSoundOnLand
    sound:
      collection: ToyFall
  - type: EmitSoundOnTrigger
    sound:
      collection: ToySqueak
  - type: UseDelay
    delay: 1.0
  - type: MeleeWeapon
    autoAttack: true
    attackRate: 0.8
    wideAnimationRotation: 180
    soundHit:
      collection: ToySqueak
    damage:
      types:
        Blunt: 0
    hidden: true
# Race plushies

- type: entity
  parent: CFBasePlushie
  id: CFHumanPlushie
  name: human plushie
  description: The most basic one doesn't mean the worst one!
  components:
  - type: Sprite
    state: human
  - type: EmitSoundOnUse
    sound:
      collection: MaleLaugh
  - type: EmitSoundOnActivate
    sound:
      collection: MaleLaugh
  - type: EmitSoundOnCollide
    sound:
      collection: MaleLaugh
  - type: EmitSoundOnLand
    sound:
      collection: MaleScreams
  - type: EmitSoundOnTrigger
    sound:
      collection: MaleLaugh
  - type: MeleeWeapon
    wideAnimationRotation: 180
    soundHit:
      collection: MaleLaugh
  - type: PhysicalComposition
    materialComposition:
      CFCloth: 25

- type: entity
  parent: CFBasePlushie
  id: CFDwarfPlushie
  name: dwarf plushie
  description: A very short, but sturdy lad... A good one to drink with, or from. Rock and stone!
  components:
  - type: Sprite
    state: dwarf
  - type: EmitSoundOnUse
    sound:
      path: /Audio/_CP14/Voice/Dwarf/dwarf_plushie.ogg
      params:
        variation: 0.1
        volume: 0.4
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/_CP14/Voice/Dwarf/dwarf_plushie.ogg
      params:
        variation: 0.1
        volume: 0.4
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/_CP14/Voice/Dwarf/dwarf_plushie.ogg
      params:
        variation: 0.1
        volume: 0.4
  - type: EmitSoundOnLand
    sound:
      collection: MaleScreams
      params:
        pitch: 0.6
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/_CP14/Voice/Dwarf/dwarf_plushie.ogg
      params:
        variation: 0.1
        volume: 0.4
  - type: MeleeWeapon
    wideAnimationRotation: 180
    soundHit:
      path: /Audio/_CP14/Voice/Dwarf/dwarf_plushie.ogg
      params:
        variation: 0.1
        volume: 0.4
  - type: SolutionContainerManager
    solutions:
      vial:
        maxVol: 10
  - type: MixableSolution
    solution: plushie
  - type: FitsInDispenser
    solution: plushie
  - type: RefillableSolution
    solution: plushie
  - type: DrainableSolution
    solution: plushie
  - type: ExaminableSolution
    solution: plushie
  - type: DrawableSolution
    solution: plushie
  - type: InjectableSolution
    solution: plushie
  - type: SolutionItemStatus
    solution: plushie
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: Edible
    edible: Drink
    solution: plushie
  - type: Spillable
    solution: plushie
  - type: Appearance
  - type: Injector
    solutionName: plushie
    ignoreMobs: true
    activeModeProtoId: CFPourDrawMode
    allowedModes:
    - CFPourDrawMode
    - CFPourInjectMode
  - type: PhysicalComposition
    materialComposition:
      CFCloth: 20
      CFStone: 30

- type: entity
  parent: CFBasePlushie
  id: CFElfPlushie
  name: elf plushie
  description: It is unclear, if that thing is a man or a woman... But it can hold a bit of mana!
  components:
  - type: Sprite
    state: elf
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Voice/Human/womanlaugh.ogg
      params:
        pitch: 0.8
        variation: 0.1
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/Voice/Human/womanlaugh.ogg
      params:
        pitch: 0.8
        variation: 0.1
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/Voice/Human/womanlaugh.ogg
      params:
        pitch: 0.8
        variation: 0.1
  - type: EmitSoundOnLand
    sound:
      collection: FemaleScreams
      params:
        pitch: 0.7
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Voice/Human/womanlaugh.ogg
      params:
        pitch: 0.8
        variation: 0.1
  - type: MeleeWeapon
    wideAnimationRotation: 180
    soundHit:
      path: /Audio/Voice/Human/womanlaugh.ogg
      params:
        pitch: 0.8
        variation: 0.1
  - type: Tag
    tags:
    - CFEnergyCrystal
  - type: PhysicalComposition
    materialComposition:
      CFCloth: 25

- type: entity
  parent: [ CFBasePlushie, BaseStorageItem ]
  id: CFGoblinPlushie
  name: goblin plushie
  description: A sneaky one, for sure... It seems like you can put a coin in it, but it's not clear if you can get it back!
  components:
  - type: Sprite
    state: goblin
  - type: EmitSoundOnUse
    sound:
      path: /Audio/_CP14/Voice/Goblin/goblin_laugh.ogg
      params:
        variation: 0.1
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/_CP14/Voice/Goblin/goblin_laugh.ogg
      params:
        variation: 0.1
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/_CP14/Voice/Goblin/goblin_laugh.ogg
      params:
        variation: 0.1
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_CP14/Voice/Goblin/goblin_scream.ogg
      params:
        variation: 0.1
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/_CP14/Voice/Goblin/goblin_laugh.ogg
      params:
        variation: 0.1
  - type: MeleeWeapon
    wideAnimationRotation: 180
    soundHit:
      path: /Audio/_CP14/Voice/Goblin/goblin_laugh.ogg
      params:
        variation: 0.1
  - type: Storage
    maxItemSize: Tiny
    grid:
    - 0,0,1,1
    quickInsert: true
    areaInsert: false
    whitelist:
      tags:
        - CFCoin
  - type: UseDelay
    delay: 0.3
  - type: Dumpable
    soundDump:
      collection: CFCoins
    multiplier: 0.8
  - type: PhysicalComposition
    materialComposition:
      CFCloth: 25

