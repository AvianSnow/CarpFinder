- type: entity
  parent: CFSpellTarget
  id: CFParalyze
  name: Paralyze
  description: On a failed Will save the target is paralyzed.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 3
  - type: CFSpell
    spell: Paralyze
    rank: 3
  - type: CFTargeting
    rangeFeet: 30
  - type: CFCheck
    defense: Will
    basicSave: false
  - type: CFDegreeEffects
    failure:
    - !type:CFApplyConditionEffect
      condition: Paralyzed
      durationSeconds: 6
    criticalFailure:
    - !type:CFApplyConditionEffect
      condition: Paralyzed
      durationSeconds: 24
