# CarpFinder: Sorcerer bloodlines, Player Core 2. Sorcerous gifts that have no spell in the game yet are left out.
- type: cfClassChoice
  id: BloodlineAberrant
  class: Sorcerer
  slot: cf-class-choice-bloodline
  name: cf-class-choice-bloodlineaberrant
  description: cf-class-choice-bloodlineaberrant-desc
  tradition: Occult
  trainedSkills:
    - Intimidation
    - Occultism
  grants:
    - !type:CFGrantSpell
      spell: Daze
    - !type:CFGrantSpell
      spell: PhantomPain
    - !type:CFGrantBloodMagic
      spells: [ PhantomPain ]
      onSelf:
      - !type:CFBonusEffect
        stat: Will
        value: 2
        durationSeconds: 6
      onTarget:
      - !type:CFBonusEffect
        stat: Will
        value: -1
        durationSeconds: 6

