- type: entity
  id: CFBaseSeed
  parent: BaseItem
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _CP14/Objects/Specific/Farming/seeds.rsi
  - type: CFBulk
    bulk: 0
  - type: CFItemPrice
    copper: 5 # ours: PF2e prints no seeds

- type: entity
  id: CFSeedWheat
  name: wheat seeds
  description: Small wheat seeds. What will you do with them? Grind them into flour, or plant them again?
  parent: CFBaseSeed
  components:
  - type: Sprite
    layers:
    - state: bag
    - state: wheat
  - type: CFSeed
    plantProto: CFPlantWheat
  - type: StaticPrice
    price: 0.4

