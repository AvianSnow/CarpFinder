- type: gameMap
  id: Empty
  mapName: Empty
  mapPath: /Maps/Test/empty.yml
  minPlayers: 0
  stations:
    Empty:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: "Empty"
        - type: StationJobs
          availableJobs:
            Passenger: [ -1, -1 ]

- type: gameMap
  id: Dev
  mapName: Dev
  mapPath: /Maps/Test/dev_map.yml
  minPlayers: 0
  stations:
    Dev:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: "Dev"
        # CarpFinder: up to six players per adventure role, with no round-start minimum.
        - type: StationJobs
          availableJobs:
            CFAlpha: [ 0, 6 ]
            CFBeta: [ 0, 6 ]
            CFCharlie: [ 0, 6 ]
            CFDelta: [ 0, 6 ]
            CFMerchant: [ -1, -1 ]
            CFArcaneResearcher: [ -1, -1 ]
            CFArcaneArtificer: [ -1, -1 ]

- type: gameMap
  id: TestTeg
  mapName: Test TEG
  mapPath: /Maps/Test/test_teg.yml
  minPlayers: 0
  stations:
    TEG:
      stationProto: TestStation
      components:
        - type: StationNameSetup
          mapNameTemplate: "TEG"
        - type: StationJobs
          availableJobs:
            ChiefEngineer: [ -1, -1 ]
