# Young Salamander. Ancestry Hit Points 6. At 1st level that is 14 Hit Points.
- type: cfPet
  id: CFPetSalamander
  name: Salamander
  kind: Companion
  entity: CFCompanionSalamander
  size: "Small"
  strength: 2
  dexterity: 2
  constitution: 2
  intelligence: -4
  wisdom: 1
  charisma: 1
  hitPoints: 6
  description: "A young salamander companion."
  speeds:
    - name: Speed
      feet: 20
    - name: swim
      feet: 10
  senses:
    - "darkvision"
  attacks:
    - name: "Tail"
      die: 6
      damage: bludgeoning
    - name: "Jaws"
      die: 4
      damage: piercing
  skills:
    - name: Survival
      ability: Wisdom
  support: "Until your next turn, a creature adjacent to it that hits you or the salamander takes 1d6 poison, or 2d6 once it is nimble or savage."
  advanced: "Poisonous Sweep"

- type: entity
  parent: [ MobLizard, CFCompanionBase ]
  id: CFCompanionSalamander
  name: salamander companion
  description: "A young salamander companion."
  suffix: Companion
  components:
  - type: HTN
    rootTask:
      task: CFGOAPCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 15
    maxHp: 14
    currentHp: 14
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 2
      Dexterity: 2
      Constitution: 2
      Intelligence: -4
      Wisdom: 1
      Charisma: 1
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 6
    naturalType: bludgeoning
    naturalFinesse: false
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      14: Dead
