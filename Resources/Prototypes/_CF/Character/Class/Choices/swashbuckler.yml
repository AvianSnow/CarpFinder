# CarpFinder: Swashbuckler styles, Player Core 2. Every style also gets panache from Demoralize, Feint and Tumble Through.
# Each has +1 circumstance to its skill while it has panache: the bonus to checks with the bravado trait.
- type: cfClassChoice
  id: StyleBattledancer
  class: Swashbuckler
  slot: cf-class-choice-style
  name: cf-class-choice-stylebattledancer
  description: cf-class-choice-stylebattledancer-desc
  trainedSkills:
    - Performance
  grants:
    - !type:CFGrantAction
      action: CFActFascinatingPerformance
    - !type:CFGrantWhile
      while: Panache
      stat: SkillChecks
      type: Circumstance
      value: 1
      skill: Performance

