- type: entity
  parent: CFSpellArea
  id: CFGaleBlast
  name: Gale Blast
  description: Wind in a 5-foot emanation. Fortitude save, 1d6 bludgeoning, and a push on a failure.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: GaleBlast
    rank: 0
  - type: CFAreaEffect
    shape: Emanation
    sizeFeet: 5
  - type: CFCheck
    defense: Fortitude
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 6
      damageType: Bludgeoning
      heightenDice: 1
    landed:
    - !type:CFForcedMovementEffect
      feet: 5
  - type: CFHeighten
    baseRank: 1
    interval: 2
