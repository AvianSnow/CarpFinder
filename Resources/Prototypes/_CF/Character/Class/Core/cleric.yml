# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Cleric
  name: cf-class-cleric
  description: cf-class-description-cleric
  hitPoints: 8
  keyAbility: Wisdom
  hitPointsAbility: Constitution
  usesDeity: true
  classDC: cf-class-cleric
  proficiencies:
    perception:
      trained:
        - Perception
    savingThrows:
      trained:
        - Fortitude
        - Reflex
      expert:
        - Will
    skills:
      trained:
        - Religion
    attacks:
      trained:
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
  additionalSkillTrainings: 2
  spellcasting:
    tradition: Divine
    ability: Wisdom
    cantrips: 5
    slots:
      - 2
    laterSlots:
      - [ 3 ]
      - [ 3, 2 ]
      - [ 3, 3 ]
      - [ 3, 3, 2 ]
    prepared: true
  features:
    - level: 1
      name: "Cleric Spellcasting"
      description: "Level 1 cantrips and spell slots are on the spell sheet."
    - level: 1
      name: "Deity"
      description: "Choose yours with the Deity button. It trains a skill and gives its favored weapon."
    - level: 1
      name: "Divine Font"
      description: "You gain extra rank 1 spell slots for Heal or Harm, whichever your deity offers."
    - level: 1
      name: "Doctrine"
      description: "Choose yours with the Doctrine button."
    - level: 1
      name: "First Doctrine"
      description: "Comes from your doctrine."
    - level: 3
      name: "Second Doctrine"
      description: "Comes from your doctrine."
    - level: 5
      name: "Perception Expertise"
      description: "Expert in Perception."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Perception
          rank: Expert
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
