- type: entity
  id: CFBaseWallpaper
  abstract: true
  parent: BaseItem
  description: Thin paper wallpaper. You can glue them on the walls from different sides, or peel them off with any sharp object.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _CP14/Structures/Wallpaper/icons.rsi
  - type: Stack
    count: 30

- type: entity
  id: CFWallpaperBlack
  parent: CFBaseWallpaper
  name: wallpaper "inkwell black"
  components:
  - type: Sprite
    state: black
  - type: CFWallpaper
    rsiPath: _CP14/Structures/Wallpaper/wallpaper_black.rsi
  - type: Stack
    stackType: CFWallpaperBlack
  - type: PhysicalComposition
    materialComposition:
      CFCloth: 5

