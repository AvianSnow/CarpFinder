# Young Bear. Ancestry Hit Points 8. At 1st level that is 16 Hit Points.
- type: cfPet
  id: CFPetBear
  name: Bear
  kind: Companion
  entity: CFCompanionBear
  size: "Small"
  strength: 3
  dexterity: 2
  constitution: 2
  intelligence: -4
  wisdom: 1
  charisma: 0
  hitPoints: 8
  description: "A young bear companion."
  speeds:
    - name: Speed
      feet: 35
  senses:
    - "low-light vision"
    - "scent (imprecise, 30 feet)"
  attacks:
    - name: "Jaws"
      die: 8
      damage: piercing
    - name: "Claw"
      die: 6
      damage: slashing
      agile: true
  skills:
    - name: Intimidation
      ability: Charisma
  support: "Until your next turn, each Strike that hits a creature in its reach deals an extra 1d8 slashing, or 2d8 once it is nimble or savage."
  advanced: "Bear Hug"

- type: entity
  parent: [ SimpleMobBase, CFCompanionBase ]
  id: CFCompanionBear
  name: bear companion
  description: "A young bear companion."
  suffix: Companion
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: bear
      sprite: Mobs/Animals/bear.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: bear
      Critical:
        Base: bear_dead
      Dead:
        Base: bear_dead
  - type: HTN
    rootTask:
      task: CFCompanionCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 15
    maxHp: 16
    currentHp: 16
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 3
      Dexterity: 2
      Constitution: 2
      Intelligence: -4
      Wisdom: 1
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 8
    naturalType: piercing
    naturalFinesse: false
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      16: Dead
