  components:
  - type: TargetAction
    repeat: true
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: magicmissile
  - type: CFRadialSlot
    group: Spell
    spellRank: 1
  - type: CFSpell
    spell: ForceBarrage
    rank: 1
  - type: CFTargeting
    rangeFeet: 120
  - type: CFProjectileDelivery
    boltPrototype: CFSpellBoltForce
    maxBolts: 3
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 4
      flat: 1
      damageType: Force
