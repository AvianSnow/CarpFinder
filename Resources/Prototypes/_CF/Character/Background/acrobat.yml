- type: cfBackground
  id: cf-background-acrobat
  name: Acrobat
  description: >-
    You spent your early days in a religious monastery or cloister. You may have traveled out into the world to spread
    the message of your religion or because you cast away the teachings of your faith, but deep down, you’ll always carry
    within you the lessons you learned two attribute boosts. One must be to Intelligence or Wisdom, and one is a free
    attribute boost. You’re trained in the Religion skill and the Scribing Lore skill. You gain the Student of the
    Canon skill feat.
  skillBoosts:
    - Acrobatics
  abilityBoosts:
    - Strength
    - Dexterity
  proficiencies:
    skills:
      trained:
        - Acrobatics
        - Lore
