- type: entity
  parent: CFSpellArea
  id: CFGrease
  name: Grease
  description: A slick 10-foot patch. A failed Reflex save knocks the creature prone.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 1
  - type: CFSpell
    spell: Grease
    rank: 1
  - type: CFTargeting
    rangeFeet: 30
  - type: CFAreaEffect
    shape: Square
    sizeFeet: 10
  - type: CFCheck
    defense: Reflex
    basicSave: false
  - type: CFDegreeEffects
    landed:
    - !type:CFApplyConditionEffect
      condition: Prone
