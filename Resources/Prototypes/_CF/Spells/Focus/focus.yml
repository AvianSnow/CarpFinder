# Focus spells. Each costs a Focus Point and heightens to half the caster's level, rounded up, so rank is 0 on the action.
# Grant one with CFGrantFocusSpell.

- type: entity
  parent: CFSpellTarget
  id: CFTempestSurge
  name: Tempest Surge
  description: A storm deals 1d12 electricity to a creature, basic Reflex. On a failure it is also clumsy 2 for a round. Costs a Focus Point.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: TempestSurge
    rank: 0
    focus: true
  - type: CFTargeting
    rangeFeet: 30
  - type: CFHeighten
    baseRank: 1
    interval: 1
  - type: CFCheck
    defense: Reflex
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 12
      damageType: Electricity
      heightenDice: 1
    failure:
    - !type:CFApplyConditionEffect
      condition: Clumsy
      value: 2
      durationSeconds: 6
    criticalFailure:
    - !type:CFApplyConditionEffect
      condition: Clumsy
      value: 2
      durationSeconds: 6

- type: entity
  parent: CFSpellTarget
  id: CFForceBolt
  name: Force Bolt
  description: A bolt of force that always hits for 1d4+1. Costs a Focus Point.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: ForceBolt
    rank: 0
    focus: true
  - type: CFTargeting
    rangeFeet: 30
  - type: CFHeighten
    baseRank: 1
    interval: 2
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 4
      flat: 1
      damageType: Force
      heightenDice: 1
      heightenFlat: 1

- type: entity
  parent: CFActivityInstant
  id: CFActRefocus
  name: Refocus
  description: Spend 10 minutes on the world clock to regain 1 Focus Point. Moving or being hurt interrupts it.
  components:
  - type: CFRefocus
  - type: CFRadialSlot
    group: Free
    tab: Focus

# The list of spells hides these from the builder: an empty traditions list is on nobody's spell list.
- type: cfSpell
  id: TempestSurge
  name: Tempest Surge
  rank: 1
  traits: [Concentrate, Electricity, Manipulate]
  actionCost: Two
  range: 30 feet
  targets: 1 creature
  defense: basic Reflex
  summary: A storm deals 1d12 electricity damage. On a failure the target is also clumsy 2 for 1 round.
  heightened: Damage increases by 1d12 per rank.

- type: cfSpell
  id: ForceBolt
  name: Force Bolt
  rank: 1
  traits: [Concentrate, Force, Manipulate]
  actionCost: One
  range: 30 feet
  targets: 1 creature
  summary: A bolt of force automatically hits for 1d4+1 force damage.
  heightened: Damage increases by 1d4+1 every 2 ranks.

- type: entity
  parent: CFSpellTarget
  id: CFLayOnHands
  name: Lay on Hands
  description: A touch heals a creature for 6 Hit Points, or more when heightened. Costs a Focus Point.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 1
  - type: CFSpell
    spell: LayOnHands
    rank: 0
    focus: true
  - type: CFTargeting
    rangeFeet: 5
    filter: All
  - type: CFHeighten
    baseRank: 1
    interval: 1
  - type: CFDegreeEffects
    landed:
    - !type:CFHealEffect
      flat: 6
      heightenFlat: 6
  - type: EntityTargetAction
    canTargetSelf: true

- type: entity
  parent: CFSpellTarget
  id: CFTouchOfTheVoid
  name: Touch of the Void
  description: A touch deals 1d6 void damage, basic Fortitude. On a failure the target also takes -2 to AC for 6 seconds. Costs a Focus Point.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 1
  - type: CFSpell
    spell: TouchOfTheVoid
    rank: 0
    focus: true
  - type: CFTargeting
    rangeFeet: 5
  - type: CFHeighten
    baseRank: 1
    interval: 1
  - type: CFCheck
    defense: Fortitude
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 6
      damageType: Void
      heightenDice: 1
    failure:
    - !type:CFBonusEffect
      stat: ArmorClass
      type: Status
      value: -2
      durationSeconds: 6
    criticalFailure:
    - !type:CFBonusEffect
      stat: ArmorClass
      type: Status
      value: -2
      durationSeconds: 6

- type: cfSpell
  id: LayOnHands
  name: Lay on Hands
  rank: 1
  traits: [Healing, Manipulate, Vitality]
  actionCost: One
  range: touch
  targets: 1 creature
  summary: The target regains 6 Hit Points. Damaging undead and the AC bonus are TBA.
  heightened: Healing increases by 6 per rank.

- type: cfSpell
  id: TouchOfTheVoid
  name: Touch of the Void
  rank: 1
  traits: [Manipulate, Void]
  actionCost: One
  range: touch
  targets: 1 creature
  defense: basic Fortitude
  summary: The target takes 1d6 void damage. On a failure it also takes -2 to AC. Healing undead is TBA.
  heightened: Damage increases by 1d6 per rank.

- type: entity
  parent: CFSpellInstant
  id: CFShieldsOfTheSpirit
  name: Shields of the Spirit
  description: Raise your shield. For 6 seconds, allies in your aura have +1 status bonus to AC, and an enemy that attacks one takes 1d4 spirit damage. Costs a Focus Point.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 1
  - type: CFSpell
    spell: ShieldsOfTheSpirit
    rank: 0
    focus: true
  - type: CFTargeting
    filter: All
  - type: CFNeedsShield
  - type: CFDegreeEffects
    landed:
    - !type:CFRaiseSpiritShieldsEffect

- type: cfSpell
  id: ShieldsOfTheSpirit
  name: Shields of the Spirit
  rank: 1
  traits: [Concentrate, Sanctified, Spirit]
  actionCost: One
  range: 15-foot aura
  targets: allies in your aura
  summary: Raise your shield. Allies in your aura have +1 status bonus to AC, and an enemy that attacks one takes 1d4 spirit damage.
  heightened: Damage increases by 1d4 per 2 ranks.
