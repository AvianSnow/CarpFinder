# Ported from CP14 by the CF converter.

- type: entity
  id: CFWindowWooden
  parent:
  - CFWindowBase
  - CFBaseFlammable
  name: wooden window
  description: A wooden wall with a glass window in it.
  components:
  - type: Sprite
    sprite: _CP14/Structures/Windows/wooden_window.rsi
  - type: Icon
    sprite: _CP14/Structures/Windows/wooden_window.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          CFGlassShard:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:ChangeConstructionNodeBehavior
        node: CFWindowWoodenBroken
  - type: Construction
    graph: CFWindowWooden
    node: CFWindowWooden

