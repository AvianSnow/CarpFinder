# Young Goblin Dog. Ancestry Hit Points 6. At 1st level that is 14 Hit Points.
- type: cfPet
  id: CFPetGoblinDog
  name: Goblin Dog
  kind: Companion
  entity: CFCompanionGoblinDog
  size: "Medium"
  strength: 3
  dexterity: 2
  constitution: 2
  intelligence: -4
  wisdom: 1
  charisma: 0
  hitPoints: 6
  description: "A young goblin dog companion. It is built to be ridden. When it matures, it can stay Medium."
  mount: true
  speeds:
    - name: Speed
      feet: 40
  attacks:
    - name: "Jaws"
      die: 6
      damage: piercing
  skills:
    - name: Stealth
      ability: Dexterity
  support: "Until your next turn, a creature in its reach that you damage is sickened 1 until it Interacts to brush the dander off."
  advanced: "Slobbering Bite"

- type: entity
  parent: [ MobCorgi, CFCompanionBase ]
  id: CFCompanionGoblinDog
  name: goblin dog companion
  description: "A young goblin dog companion. It is built to be ridden. When it matures, it can stay Medium."
  suffix: Companion
  components:
  - type: HTN
    rootTask:
      task: CFCompanionCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 15
    maxHp: 14
    currentHp: 14
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 3
      Dexterity: 2
      Constitution: 2
      Intelligence: -4
      Wisdom: 1
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 6
    naturalType: piercing
    naturalFinesse: false
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      14: Dead
