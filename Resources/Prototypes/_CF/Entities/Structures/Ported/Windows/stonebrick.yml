# Ported from CP14 by the CF converter.

- type: entity
  id: CFWindowStoneBrick
  parent: CFWindowBase
  name: stone brick window
  description: A stone brick wall with a glass window in it.
  components:
  - type: Sprite
    sprite: _CP14/Structures/Windows/stone_bricks_window.rsi
  - type: Icon
    sprite: _CP14/Structures/Windows/stone_bricks_window.rsi
    state: full
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          CFGlassShard:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:ChangeConstructionNodeBehavior
        node: CFWindowStoneBrickBroken
  - type: Construction
    graph: CFWindowStoneBrick
    node: CFWindowStoneBrick

- type: entity
  id: CFWindowFrameStoneBrick
  name: stone brick window frame
  parent: CFBaseWindowFrame
  components:
  - type: Sprite
    sprite: _CP14/Structures/Windows/stone_bricks_window_frame.rsi
  - type: Icon
    sprite: _CP14/Structures/Windows/stone_bricks_window_frame.rsi
  - type: Damageable
    damageModifierSet: CFRockStructural
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CFStoneBlock1:
            min: 1
            max: 2
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: CFWindowStoneBrick
    node: CFWindowFrameStoneBrick

- type: entity
  id: CFWindowStoneBrickBroken
  name: shattered stone brick window
  parent:
  - CFBaseWindowFrameBroken
  - CFWindowFrameStoneBrick
  components:
  - type: Sprite
    sprite: _CP14/Structures/Windows/stone_bricks_window_broken.rsi
  - type: Icon
    sprite: _CP14/Structures/Windows/stone_bricks_window_broken.rsi
  - type: Construction
    graph: CFWindowStoneBrick
    node: CFWindowStoneBrickBroken
