
- type: entity
  id: CFBaseCrystalSlot #TODO переструктуризовать объекты
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: ContainerContainer
    containers:
      crystal_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      crystal_slot:
        insertSound:
          path: /Audio/_CP14/Items/crystal_insert.ogg
          params:
            variation: 0.05
        ejectSound:
          path: /Audio/_CP14/Items/crystal_eject.ogg
          params:
            variation: 0.05
        ejectOnInteract: true
        name: cp14-magic-energy-crystal-slot-name
        whitelist:
          components:
          - CFMagicEnergyCrystal
