# Young Bat. Ancestry Hit Points 6. At 1st level that is 14 Hit Points.
- type: cfPet
  id: CFPetBat
  name: Bat
  kind: Companion
  entity: CFCompanionBat
  size: "Small"
  strength: 2
  dexterity: 3
  constitution: 2
  intelligence: -4
  wisdom: 1
  charisma: 0
  hitPoints: 6
  description: "A young bat companion."
  speeds:
    - name: Speed
      feet: 15
    - name: fly
      feet: 30
  senses:
    - "echolocation (precise, 20 feet)"
    - "low-light vision"
  attacks:
    - name: "Jaws"
      die: 6
      damage: piercing
      finesse: true
    - name: "Wing"
      die: 4
      damage: slashing
      agile: true
      finesse: true
  skills:
    - name: Stealth
      ability: Dexterity
  support: "Until your next turn, a creature in its reach that you damage takes a -1 circumstance penalty to attack rolls."
  advanced: "Wing Thrash"

- type: entity
  parent: [ MobBat, CFCompanionBase ]
  id: CFCompanionBat
  name: bat companion
  description: "A young bat companion."
  suffix: Companion
  components:
  - type: HTN
    rootTask:
      task: CFGOAPCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 16
    maxHp: 14
    currentHp: 14
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 2
      Dexterity: 3
      Constitution: 2
      Intelligence: -4
      Wisdom: 1
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 6
    naturalType: piercing
    naturalFinesse: true
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      14: Dead
