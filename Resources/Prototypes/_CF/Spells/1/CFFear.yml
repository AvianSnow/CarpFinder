- type: entity
  parent: CFSpellTarget
  id: CFFear
  name: Fear
  description: The target must succeed at a Will save or become frightened.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 1
  - type: CFSpell
    spell: Fear
    rank: 1
  - type: CFTargeting
    rangeFeet: 30
  - type: CFCheck
    defense: Will
    basicSave: false
  - type: CFDegreeEffects
    failure:
    - !type:CFApplyConditionEffect
      condition: Frightened
      value: 1
    criticalFailure:
    - !type:CFApplyConditionEffect
      condition: Frightened
      value: 2
