# CarpFinder: Alchemist research fields, Player Core 2. Each changes what Quick Vial can make (Actions/alchemy.yml).
- type: cfClassChoice
  id: FieldBomber
  class: Alchemist
  slot: cf-class-choice-research-field
  name: cf-class-choice-fieldbomber
  description: cf-class-choice-fieldbomber-desc
  grants:
    - !type:CFGrantOption
      option: BomberField

- type: cfClassChoice
  id: FieldChirurgeon
  class: Alchemist
  slot: cf-class-choice-research-field
  name: cf-class-choice-fieldchirurgeon
  description: cf-class-choice-fieldchirurgeon-desc
  grants:
    - !type:CFGrantOption
      option: ChirurgeonField

- type: cfClassChoice
  id: FieldMutagenist
  class: Alchemist
  slot: cf-class-choice-research-field
  name: cf-class-choice-fieldmutagenist
  description: cf-class-choice-fieldmutagenist-desc

- type: cfClassChoice
  id: FieldToxicologist
  class: Alchemist
  slot: cf-class-choice-research-field
  name: cf-class-choice-fieldtoxicologist
  description: cf-class-choice-fieldtoxicologist-desc
  grants:
    - !type:CFGrantOption
      option: ToxicologistField
  features:
    - level: 5
      name: Field Discovery
      grants:
        - !type:CFGrantResistance
          damageType: Poison
          halfLevel: true
