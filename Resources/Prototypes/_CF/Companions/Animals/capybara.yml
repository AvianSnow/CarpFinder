# Young Capybara. Ancestry Hit Points 6. At 1st level that is 14 Hit Points.
- type: cfPet
  id: CFPetCapybara
  name: Capybara
  kind: Companion
  entity: CFCompanionCapybara
  size: "Small"
  strength: 2
  dexterity: 2
  constitution: 2
  intelligence: -4
  wisdom: 2
  charisma: 0
  hitPoints: 6
  description: "A young capybara companion."
  speeds:
    - name: Speed
      feet: 30
    - name: swim
      feet: 15
  senses:
    - "low-light vision"
    - "scent (imprecise, 30 feet)"
  attacks:
    - name: "Head"
      die: 6
      damage: bludgeoning
      agile: true
  skills:
    - name: Survival
      ability: Wisdom
  support: "Your next Strike against a foe in its reach gains a +1 circumstance bonus. The bonus ends when you use it or at the start of your next turn."
  advanced: "Distracting Spray"

- type: entity
  parent: [ SimpleMobBase, CFCompanionBase ]
  id: CFCompanionCapybara
  name: capybara companion
  description: "A young capybara companion."
  suffix: Companion
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: companion
      sprite: _CF/Mobs/companion-default.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: companion
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: HTN
    rootTask:
      task: CFGOAPCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 15
    maxHp: 14
    currentHp: 14
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 2
      Dexterity: 2
      Constitution: 2
      Intelligence: -4
      Wisdom: 2
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 6
    naturalType: bludgeoning
    naturalFinesse: false
    naturalAgile: true
  - type: MobThresholds
    thresholds:
      0: Alive
      14: Dead
