- type: entity
  parent: CFSpellTarget
  id: CFFrostbite
  name: Frostbite
  description: The target takes 1d4 cold plus your spellcasting modifier. Fortitude save.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: Frostbite
    rank: 0
  - type: CFTargeting
    rangeFeet: 60
  - type: CFCheck
    defense: Fortitude
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 4
      damageType: Cold
      addAbilityModifier: true
      heightenDice: 1
  - type: CFHeighten
    baseRank: 1
    interval: 2
