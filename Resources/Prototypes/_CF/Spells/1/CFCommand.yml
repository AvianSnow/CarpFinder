- type: entity
  parent: CFSpellTarget
  id: CFCommand
  name: Command
  description: On a failed Will save the target must spend its next action obeying.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 1
  - type: CFSpell
    spell: Command
    rank: 1
  - type: CFTargeting
    rangeFeet: 30
  - type: CFCheck
    defense: Will
    basicSave: false
  - type: CFDegreeEffects
    landed:
    - !type:CFApplyConditionEffect
      condition: Frightened
      value: 1
    - !type:CFApplyConditionEffect
      condition: Prone
