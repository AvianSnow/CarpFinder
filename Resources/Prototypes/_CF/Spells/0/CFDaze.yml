- type: entity
  parent: CFSpellTarget
  id: CFDaze
  name: Daze
  description: Mental damage equal to your spellcasting modifier. Will save.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: Daze
    rank: 0
  - type: CFPsiCantrip
    ampDice: 1
    ampDie: 10
    ampHeightenDice: 2
    ampFailure:
    - !type:CFBonusEffect
      stat: Will
      type: Status
      value: -1
      durationSeconds: 6
    - !type:CFWeaknessEffect
      damageType: Mental
      amount: 1
      durationSeconds: 6
    ampCriticalFailure:
    - !type:CFBonusEffect
      stat: Will
      type: Status
      value: -1
      durationSeconds: 6
    - !type:CFWeaknessEffect
      damageType: Mental
      amount: 3
      durationSeconds: 6
  - type: CFTargeting
    rangeFeet: 60
  - type: CFCheck
    defense: Will
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      damageType: Mental
      addAbilityModifier: true
