  slot: cf-class-choice-modification
  name: cf-class-choice-modarmorphlogistonicregulator
  description: cf-class-choice-modarmorphlogistonicregulator-desc
  requiresChoice: [ InnovationArmor, InnovationArmorSubterfuge ]
  grants:
    - !type:CFGrantInnovationResistance
      resistance:
        types:
          - Cold
          - Fire
        flat: 0

- type: cfClassChoice
  id: ModArmorSpeedBoosters
  class: Inventor
  slot: cf-class-choice-modification
  name: cf-class-choice-modarmorspeedboosters
  description: cf-class-choice-modarmorspeedboosters-desc
  requiresChoice: [ InnovationArmor, InnovationArmorSubterfuge ]
  grants:
    - !type:CFGrantWhile
      while: WearingInnovation
      stat: Speed
      type: Status
      value: 5
    - !type:CFGrantWhile
      while: Overdriven
      stat: Speed
      type: Status
      value: 10

- type: cfClassChoice
  id: ModArmorMuscularExoskeleton
  class: Inventor
  slot: cf-class-choice-modification
  name: cf-class-choice-modarmormuscularexoskeleton
  description: cf-class-choice-modarmormuscularexoskeleton-desc
  requiresChoice: [ InnovationArmor ]
  grants:
    - !type:CFGrantWhile
      while: Overdriven
      stat: SkillChecks
      type: Circumstance
      value: 1
      skill: Athletics

- type: cfClassChoice
  id: ModArmorSubtleDampeners
  class: Inventor
  slot: cf-class-choice-modification
  name: cf-class-choice-modarmorsubtledampeners
  description: cf-class-choice-modarmorsubtledampeners-desc
  requiresChoice: [ InnovationArmorSubterfuge ]
  grants:
    - !type:CFGrantWhile
      while: Overdriven
      stat: SkillChecks
      type: Circumstance
      value: 1
      skill: Stealth

