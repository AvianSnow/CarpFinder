# Ported from CP14 by the CF converter.

- type: entity
  id: CFBaseWallmountPainting
  parent: CFBaseWallmount
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 20
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]

- type: entity
  id: CFWallmountPaintingSkull
  name: skull painting
  parent: CFBaseWallmountPainting
  description: A bizarre skull painting. Depressing.
  components:
  - type: Sprite
    sprite: _CP14/Structures/Wallmount/wallmount_painting.rsi
    state: skull_painting

- type: entity
  id: CFWallmountPaintingCandle
  name: candle painting
  parent: CFBaseWallmountPainting
  description: A nicely drawn candle in a frame.
  components:
  - type: Sprite
    sprite: _CP14/Structures/Wallmount/wallmount_painting.rsi
    state: candle_painting

- type: entity
  id: CFWallmountPaintingWoman
  name: painting of a woman
  parent: CFBaseWallmountPainting
  description: The painting depicts a woman with a mysterious smile.
  components:
  - type: Sprite
    sprite: _CP14/Structures/Wallmount/wallmount_painting.rsi
    state: painting_woman

- type: entity
  id: CFWallmountPaintingSaint
  name: painting of a saint
  parent: CFBaseWallmountPainting
  description: A drawing of a nun with a halo over her head. This is how you can feel the holiness of the picture.
  components:
  - type: Sprite
    sprite: _CP14/Structures/Wallmount/wallmount_painting.rsi
    state: painting_saint
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 60
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
