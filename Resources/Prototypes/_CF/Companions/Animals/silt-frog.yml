# Young Silt Frog. Ancestry Hit Points 6. At 1st level that is 14 Hit Points.
- type: cfPet
  id: CFPetSiltFrog
  name: Silt Frog
  kind: Companion
  entity: CFCompanionSiltFrog
  size: "Small"
  strength: 3
  dexterity: 2
  constitution: 2
  intelligence: -4
  wisdom: 1
  charisma: 0
  hitPoints: 6
  description: "A young silt frog companion."
  speeds:
    - name: Speed
      feet: 25
    - name: burrow
      feet: 15
    - name: swim
      feet: 25
  senses:
    - "low-light vision"
  attacks:
    - name: "Jaws"
      die: 6
      damage: piercing
    - name: "Tongue"
      die: 4
      damage: bludgeoning
      traits:
        - "reach 10 feet"
  skills:
    - name: Stealth
      ability: Dexterity
  support: "Until your next turn, a creature in its reach that you damage is deafened."
  advanced: "Ingest Magic"

- type: entity
  parent: [ MobFrog, CFCompanionBase ]
  id: CFCompanionSiltFrog
  name: silt frog companion
  description: "A young silt frog companion."
  suffix: Companion
  components:
  - type: HTN
    rootTask:
      task: CFCompanionCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 15
    maxHp: 14
    currentHp: 14
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 3
      Dexterity: 2
      Constitution: 2
      Intelligence: -4
      Wisdom: 1
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 6
    naturalType: piercing
    naturalFinesse: false
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      14: Dead
