# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Magus
  name: cf-class-magus
  description: cf-class-description-magus
  hitPoints: 8
  keyAbility: Dexterity
  hitPointsAbility: Constitution
  classDC: cf-class-magus
  proficiencies:
    perception:
      trained:
        - Perception
    savingThrows:
      trained:
        - Reflex
      expert:
        - Fortitude
        - Will
    skills:
      trained:
        - Arcana
    attacks:
      trained:
        - MartialWeapons
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - MediumArmor
        - LightArmor
  additionalSkillTrainings: 2
  spellcasting:
    tradition: Arcane
    ability: Dexterity
    cantrips: 5
    slots:
      - 1
    prepared: true
  features:
    - level: 1
      name: "Arcane Cascade"
      description: "This feature will be implemented later."
    - level: 1
      name: "Conflux Spells"
      description: "This feature will be implemented later."
    - level: 1
      name: "Hybrid Study"
      description: "This feature will be implemented later."
    - level: 1
      name: "Magus Spellcasting"
      description: "Level 1 cantrips and spell slots are on the spell sheet."
    - level: 1
      name: "Spellstrike"
      description: "Spellstrike is on your action wheel. A melee Strike also deals force damage and can spend a rank 1 slot."
      grants:
        - !type:CFGrantOption
          option: Spellstrike
        - !type:CFGrantAction
          action: CFActSpellstrike
    - level: 5
      name: "Reflex Expertise"
      description: "This feature will be implemented later."
    - level: 5
      name: "Weapon Expertise"
      description: "This feature will be implemented later."
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
