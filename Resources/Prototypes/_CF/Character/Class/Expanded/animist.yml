# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Animist
  name: cf-class-animist
  description: cf-class-description-animist
  hitPoints: 8
  keyAbility: Wisdom
  hitPointsAbility: Constitution
  classDC: cf-class-animist
  proficiencies:
    perception:
      trained:
        - Perception
    savingThrows:
      trained:
        - Fortitude
        - Reflex
      expert:
        - Will
    skills:
      trained:
        - Religion
    attacks:
      trained:
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - MediumArmor
        - LightArmor
  additionalSkillTrainings: 2
  spellcasting:
    tradition: Divine
    ability: Wisdom
    cantrips: 2
    slots:
      - 1
    focusPoints: 1
    prepared: true
  features:
    - level: 1
      name: "Animist & Apparition Spellcasting"
      description: "Level 1 cantrips and spell slots are on the spell sheet."
    - level: 1
      name: "Animistic Practice"
      description: "Choose a practice in the builder. Its invocations need apparitions: TBA"
    - level: 1
      name: "Apparition Attunement"
      description: "Attune to spirits for extra spells. Apparitions are not built yet: TBA"
    - level: 3
      name: "Fortitude Expertise"
      description: "Expert in Fortitude saves."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Fortitude
          rank: Expert
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
