- type: entity
  parent: CFSpellArea
  id: CFFaerieDust
  name: Faerie Dust
  description: "Pick 1, 2 or 3 actions: a 5, 10 or 15-foot burst within 30 feet. Will save. Failure: -2 status to Perception and Will saves for 6 seconds. Critical failure: also -1 for a minute. Costs a Focus Point."
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 1
  - type: CFSpell
    spell: FaerieDust
    rank: 0
    focus: true
  - type: CFTargeting
    rangeFeet: 30
  - type: CFModeChoice
    modes:
    - { value: 1, name: cf-mode-faerie-dust-1, actions: 1, sizeFeet: 5 }
    - { value: 2, name: cf-mode-faerie-dust-2, actions: 2, sizeFeet: 10 }
    - { value: 3, name: cf-mode-faerie-dust-3, actions: 3, sizeFeet: 15 }
  - type: CFAreaEffect
    shape: Burst
    sizeFeet: 5
    filter: All
  - type: CFCheck
    defense: Will
    basicSave: false
  - type: CFDegreeEffects
    failure:
    - !type:CFBonusEffect
      stat: Perception
      value: -2
      durationSeconds: 6
    - !type:CFBonusEffect
      stat: Will
      value: -2
      durationSeconds: 6
    criticalFailure:
    - !type:CFBonusEffect
      stat: Perception
      value: -2
      durationSeconds: 6
    - !type:CFBonusEffect
      stat: Will
      value: -2
      durationSeconds: 6
    - !type:CFBonusEffect
      stat: Perception
      value: -1
      durationSeconds: 60
    - !type:CFBonusEffect
      stat: Will
      value: -1
      durationSeconds: 60

- type: cfSpell
  id: FaerieDust
  name: Faerie Dust
  rank: 1
  traits: [Concentrate, Manipulate, Mental]
  actionCost: Variable
  summary: "Creatures in a burst that fail a Will save take a -2 status penalty to Perception and Will saves. Losing their reactions is TBA."
  defense: Will

- type: entity
  parent: CFSpellTarget
  id: CFJealousHex
  name: Jealous Hex
  description: "A creature within 30 feet rolls Will. On a failure it is enfeebled, clumsy, drained or stupefied 1 for a minute, by its highest attribute. 2 on a critical failure. Costs a Focus Point."
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 1
  - type: CFSpell
    spell: JealousHex
    rank: 0
    focus: true
  - type: CFTargeting
    rangeFeet: 30
  - type: CFCheck
    defense: Will
    basicSave: false
  - type: CFDegreeEffects
    failure:
    - !type:CFJealousHexEffect
      value: 1
    criticalFailure:
    - !type:CFJealousHexEffect
      value: 2

- type: cfSpell
  id: JealousHex
  name: Jealous Hex
  rank: 1
  traits: [Concentrate, Curse]
  actionCost: One
  summary: "The target takes a condition by its highest attribute: enfeebled, clumsy, drained or stupefied. A new save each turn is TBA."
  defense: Will

