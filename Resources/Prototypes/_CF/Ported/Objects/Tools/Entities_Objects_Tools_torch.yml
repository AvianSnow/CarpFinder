# Ported from CP14 by the CF converter.

- type: entity
  id: CFTorch
  parent:
  - BaseItem
  - CFBaseTorch
  name: torch
  description: At its core, a stick burning on one side. Used to light up the area.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _CP14/Objects/Tools/torch.rsi
    layers:
      - state: torch-unlit
        map: ["fuel"]
  - type: Item
    size: Normal
    shape:
    - 0,0,0,2
    storedRotation: -65
  - type: FireVisuals
    sprite: _CP14/Objects/Tools/torch.rsi
    normalState: lit-overlay
  - type: GenericVisualizer
    visuals:
      enum.FireplaceFuelVisuals.Status:
        fuel:
          Empty: { state: torch-spent }
          Medium: { state: torch-unlit }
          Full: { state: torch-unlit }
  - type: CFDelayedIgnitionSource
  - type: CFIgnitionModifier
    hideCaution: true
  - type: Construction
    graph: CFTorch
    node: cp14torch
  - type: MeleeWeapon
    attackRate: 1.5
    wideAnimationRotation: 240
    wideAnimation: WeaponArcSlash
    damage:
      types:
        Blunt: 4
  - type: CFFlammableBonusDamage
  - type: UseDelay
  - type: ExtinguishOnInteract
    extinguishAttemptSound:
      path: /Audio/Items/candle_blowing.ogg
      params:
        variation: 0.05
        volume: 10
  - type: Tag
    tags:
    - CFTorch
  - type: PhysicalComposition
    materialComposition:
      CFWoodenPlanks: 10
      CFCloth: 10

- type: entity
  parent: CFTorch
  id: CFTorchIgnited
  suffix: Ignited
  components:
  - type: CFAutoIgnite
