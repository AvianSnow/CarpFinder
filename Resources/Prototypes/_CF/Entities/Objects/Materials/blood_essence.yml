- type: entity
  parent:
  - BaseItem
  - CFSpectralBase
  id: CFBloodEssence
  name: blood essence
  description: The essence of life, extracted by force. Only true vampires know how to use it.
  categories: [ ForkFiltered ]
  suffix: 1
  components:
  - type: Item
    size: Ginormous
    inhandVisuals:
      left:
      - state: inhand-left
        shader: unshaded
      right:
      - state: inhand-right
        shader: unshaded
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: /Textures/_CP14/Objects/Materials/blood_essence.rsi
    layers:
    - state: drop
      shader: unshaded
  - type: PointLight
    enabled: true
    color: "#d60032"
    energy: 1
    radius: 3
    netsync: false
  - type: CanMoveInAir
  - type: Physics
    bodyType: Dynamic
    bodyStatus: InAir
  - type: LightBehaviour
    behaviours:
      - !type:PulseBehaviour
        interpolate: Cubic
        maxDuration: 2
        startValue: 1.0
        endValue: 3.0
        property: Energy
        isLooped: true
        enabled: true
  - type: Stack
    stackType: CFBloodEssence
    count: 1
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      CFBloodEssence: 1

- type: entity
  id: CFImpactEffectBloodEssence
  parent: CFBaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    noRot: true
    drawdepth: Effects
    sprite: _CP14/Effects/Magic/cast_impact32.rsi
    layers:
    - state: burst
      color: "#d60032"
      shader: unshaded
  - type: PointLight
    color: "#d60032"
    radius: 4.0
    energy: 3.0
  - type: LightFade
    duration: 2.5
  - type: TimedDespawn
    lifetime: 2.5

- type: entity
  id: CFImpactEffectBloodEssenceInverse
  parent: CFImpactEffectBloodEssence
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    sprite: _CP14/Effects/Magic/cast_impact32.rsi
    layers:
    - state: burst_in
      color: "#d60032"
      shader: unshaded

- type: entity
  id: CFImpactEffectBloodEssence2
  parent: CFImpactEffectBloodEssence
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    sprite: _CP14/Effects/Magic/cast_impact32.rsi
    layers:
    - state: burst2
      color: "#d60032"
      shader: unshaded
