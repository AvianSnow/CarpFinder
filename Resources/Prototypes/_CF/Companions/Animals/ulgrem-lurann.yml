# Young Ulgrem-Lurann. Ancestry Hit Points 6. At 1st level that is 14 Hit Points.
- type: cfPet
  id: CFPetUlgremLurann
  name: Ulgrem-Lurann
  kind: Companion
  entity: CFCompanionUlgremLurann
  size: "Medium"
  strength: 3
  dexterity: 2
  constitution: 2
  intelligence: -4
  wisdom: 0
  charisma: 1
  hitPoints: 6
  description: "A young ulgrem-lurann companion. It is amphibious."
  speeds:
    - name: Speed
      feet: 20
    - name: swim
      feet: 25
  senses:
    - "darkvision"
  attacks:
    - name: "Jaws"
      die: 8
      damage: piercing
    - name: "Tail"
      die: 6
      damage: bludgeoning
  skills:
