# Ported from CP14 by the CF converter.

- type: entity
  name: generic rubber stamp
  parent: BaseItem
  id: CFStampBase
  description: A rubber stamp for stamping important documents.
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: Stamp
    stampedName: stamp-component-stamped-name-default
    stampState: "denied_on_paper"
    stampedColor: "#a23e3e"
    sound:
      path: /Audio/Items/Stamp/thick_stamp_sub.ogg
      params:
        volume: -2
        maxDistance: 5
  - type: Sprite
    sprite: _CP14/Objects/Bureaucracy/stamp.rsi
    state: denied
  - type: Item
    size: Tiny

- type: entity
  id: CFStampDenied
  parent: CFStampBase
  name: denied stamp
  components:
  - type: Stamp
    stampedName: cp14-stamp-denied
    stampedColor: "#b53535"
    stampState: "denied_on_paper"
  - type: Sprite
    state: denied

- type: entity
  id: CFStampApproved
  parent: CFStampBase
  name: approved stamp
  components:
  - type: Stamp
    stampedName: cp14-stamp-approved
    stampedColor: "#35b56c"
    stampState: "approved_on_paper"
  - type: Sprite
    state: approved

- type: entity
  id: CFStampCommandant
  parent: CFStampBase
  name: commandant stamp
  categories: [ DoNotMap ]
  components:
  - type: Stamp
    stampedName: cp14-stamp-bank
    stampedColor: "#e8c348"
    stampState: "bank_on_paper"
  - type: Sprite
    state: bank

- type: entity
  id: CFStampGuardCommander
  parent: CFStampBase
  name: guard commander stamp
  categories: [ DoNotMap ]
  components:
  - type: Stamp
    stampedName: cp14-stamp-guard-commander
    stampedColor: "#436a92"
    stampState: "guard_on_paper"
  - type: Sprite
    state: guard

- type: entity
  id: CFStampGuildmaster
  parent: CFStampBase
  name: guildmaster stamp
  categories: [ DoNotMap ]
  components:
  - type: Stamp
    stampedName: cp14-stamp-guildmaster
    stampedColor: "#115c41"
    stampState: "guildmaster_on_paper"
  - type: Sprite
    state: guildmaster
