# GOAP for advanced NPCs: mini bosses and special encounters. Simple mobs stay on stock HTN.
# Give a creature this as a second parent:  parent: [ CFKoboldWarrior, CFGoapBrain ]

- type: entity
  abstract: true
  id: CFGoapBrain
  categories: [ HideSpawnMenu ]
  components:
  - type: HTN
    rootTask:
      task: CFGoapCompound
  - type: CFGoap
  - type: CFSteering
  - type: CFScentEmitter
    layer: Ally

- type: htnCompound
  id: CFGoapCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:CFGoapOperator

# Goals. The highest priority that can be planned for wins.

- type: cfGoapGoal
  id: KillTarget
  wants: [ TargetHurt ]
  priority: 5
  onlyWhen: [ TargetVisible ]

- type: cfGoapGoal
  id: HuntTarget
  wants: [ TargetVisible ]
  priority: 3
  notWhen: [ TargetVisible ]

- type: cfGoapGoal
  id: StayAlive
  wants: [ Safe ]
  priority: 6
  whenHurt: 6
  belowFleeHealth: true

- type: cfGoapGoal
  id: Heal
  avoids: [ Hurt ]
  priority: 7
  onlyWhen: [ Hurt ]

- type: cfGoapGoal
  id: ArmSelf
  wants: [ HasWeapon ]
  priority: 6
  notWhen: [ HasWeapon ]

- type: cfGoapGoal
  id: Regroup
  wants: [ Regrouped ]
  priority: 2
  onlyWhen: [ AlliesNearby ]
  notWhen: [ TargetVisible ]

- type: cfGoapGoal
  id: Idle
  wants: [ Idled ]
  priority: 1

# Actions.

- type: cfGoapAction
  id: Strike
  step: Strike
  needs: [ TargetVisible, TargetInReach, HasWeapon ]
  gives: [ TargetHurt ]

- type: cfGoapAction
  id: Close
  step: Close
  needs: [ TargetVisible ]
  needsNot: [ NoWay ]
  gives: [ TargetInReach ]

- type: cfGoapAction
  id: Flee
  step: Flee
  gives: [ Safe ]

- type: cfGoapAction
  id: PickUpWeapon
  step: PickUp
  item: Weapon
  needs: [ WeaponNearby ]
  gives: [ HasWeapon ]
  cost: 2

- type: cfGoapAction
  id: PickUpHealing
  step: PickUp
  item: Heals
  needs: [ HealingNearby ]
  gives: [ HasHealingItem ]
  cost: 2

- type: cfGoapAction
  id: DrinkHealing
  step: UseItem
  item: Heals
  needs: [ HasHealingItem ]
  removes: [ Hurt ]

- type: cfGoapAction
  id: FollowScent
  step: FollowScent
  needs: [ ScentNearby ]
  gives: [ TargetVisible ]
  cost: 2

- type: cfGoapAction
  id: GoToLkp
  step: GoToLkp
  needs: [ KnowsLkp ]
  needsNot: [ NoWay ]
  gives: [ AtLkp ]
  cost: 2

- type: cfGoapAction
  id: CheckNode
  step: CheckNode
  needs: [ AtLkp, NodeNearby ]
  needsNot: [ NoWay ]
  gives: [ TargetVisible ]
  cost: 3

- type: cfGoapAction
  id: Wander
  step: Wander
  gives: [ Idled ]

- type: cfGoapAction
  id: Regroup
  step: Regroup
  gives: [ Regrouped ]

# Personalities. They only change numbers, and can be swapped on any brain.

- type: cfGoapProfile
  id: Default
  fleeHealth: 0.15

- type: cfGoapProfile
  id: Brave
  maxSpeed: 1.2
  arriveRadius: 0.2
  lkpDwell: 0.5
  smashPatience: 40
  fleeHealth: 0
  goalPriority:
    StayAlive: 0.5
    HuntTarget: 1.5
    KillTarget: 1.5
  actionCost:
    FollowScent: 0.5
    CheckNode: 2

- type: cfGoapProfile
  id: Stealthy
  maxSpeed: 0.8
  wallFollow: 0.6
  smashPatience: 10
  fleeHealth: 0.25
  nodeTags:
    Shadow: 3

- type: cfGoapProfile
  id: Cowardly
  wanderJitter: 1.5
  lkpKeepOut: 5
  smashPatience: 5
  fleeHealth: 0.3
  goalPriority:
    StayAlive: 1.5
  reflexes:
  - trigger: NoiseNearby
    goal: StayAlive
    seconds: 3

# Hidden hints for mappers. See .agent/investigation-nodes.md.

- type: entity
  parent: MarkerBase
  id: CFInvestigationNode
  name: investigation node
  suffix: AI
  components:
  - type: CFInvestigationNode
  - type: Sprite
    layers:
    - state: pink
    - sprite: Objects/Misc/books.rsi
      state: icon_magnifier
