- type: entity
  parent: CFSpellTarget
  id: CFHeroism
  name: Heroism
  description: The target gains +1 to attack rolls and saves.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 3
  - type: CFSpell
    spell: Heroism
    rank: 3
  - type: CFTargeting
    rangeFeet: 5
    filter: All
  - type: CFDegreeEffects
    landed:
    - !type:CFBonusEffect
      stat: AttackRoll
      type: Status
      value: 1
      durationSeconds: 600
    - !type:CFBonusEffect
      stat: Saves
      type: Status
      value: 1
      durationSeconds: 600
  - type: EntityTargetAction
    canTargetSelf: true
