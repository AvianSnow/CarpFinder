    state: frame
  - type: Construction
    graph: CFTableWooden
    node: CFTableWoodenBirchFrame

- type: entity
  parent: CFWoodenTableBase
  id: CFTableWooden
  name: wooden table
  description: A simple table made of boards.
  components:
  - type: Sprite
    sprite: _CP14/Structures/Furniture/Tables/wood.rsi
  - type: Icon
    sprite: _CP14/Structures/Furniture/Tables/wood.rsi
    state: full
  - type: Construction
    graph: CFTableWooden
    node: CFTableWooden
  - type: IconSmooth
    key: state
    states:
    - !type:CornerSpriteSmoothing
      mask: [ state ]
      base: state

