# Runes as items. A crafting recipe with attachRune puts one on a weapon or armor on the bench.

- type: entity
  parent: BaseItem
  id: CFRuneItemWeaponPotency1
  name: weapon potency rune (+1)
  description: "Attack rolls with the weapon gain +1, and it can hold one property rune. Attach it at a workbench."
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _CP14/Effects/Magic/magic_trap.rsi
    state: rune_energia
  - type: CFBulk
    bulk: 0
  - type: CFItem
    level: 2
  - type: CFItemPrice
    copper: 3500
  - type: CFRuneItem
    kind: WeaponPotency

