# Alchemy ingredients: CP14's wild plants, as they were (Objects/Flora/wild.yml), picked from the plants in
# Entities/Structures/Flora/wild.yml. Each has a price, so that the ingredients of a potion come to about half its
# Archives of Nethys price (Crafting/recipes_alchemy.yml). Sage is in Farming/fibers.yml, because it is also farmed.
# Prices are in copper: 100 copper is 1 gp.

- type: entity
  abstract: true
  parent: FoodInjectableBase
  id: CFAlchemyHerbBase
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Tiny
  - type: BadFood
  - type: CFItem
    level: 0
  - type: CFBulk
    bulk: 0

- type: entity
  parent: CFAlchemyHerbBase
  id: CFBloodFlower
  name: blood rose
  description: Scarlet flowers growing where blood has been spilled. Alchemists boil them into anything that burns or bleeds.
  components:
  - type: Sprite
    sprite: _CP14/Objects/Flora/Wild/red_rose.rsi
    layers:
    - state: base1
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        base1: ""
        base2: ""
  - type: Solution
    id: food
    solution:
      maxVol: 14
      reagents:
      - ReagentId: CFBloodFlowerSap
        Quantity: 10
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: CFBloodFlowerSap
        Quantity: 10
  - type: Tag
    tags:
    - CFAlchemicalHerbals
    - CFBloodFlower
  - type: CFItemPrice
    copper: 60

- type: entity
  parent: CFAlchemyHerbBase
  id: CFAgaricMushroom
  name: fly agaric
  description: A poisonous mushroom found near water. Not for eating, but an alchemist knows what a little venom is good for.
