- type: constructionGraph
  id: CFRoofWooden
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: CFRoofWooden
          steps:
            - material: CFWoodenPlanks
              amount: 1
              doAfter: 2
