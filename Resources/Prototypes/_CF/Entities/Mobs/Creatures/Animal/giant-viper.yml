# Giant Viper. Creature 2, Medium, Animal. Monster Core p. 316. Recall Knowledge DC 16.
# Fangs with giant viper venom (Afflictions/monsters.yml).
# Not in: Coil, which gives its fangs 10 feet of reach and a Reactive Strike, and its climb and swim Speeds.
- type: entity
  parent: [CFBaseCreature]
  id: CFMobGiantViper
  name: giant viper
  description: A snake as long as a wagon, coiled and waiting.
  components:
    - type: GhostRole
      name: cf-ghost-giant-viper-name
      description: cf-ghost-giant-viper-desc
    - type: Sprite
      drawdepth: Mobs
      scale: 1.5, 1.5
      layers:
        - map: ["enum.DamageStateVisualLayers.Base"]
          sprite: Mobs/Animals/snake.rsi
          state: snake
    - type: DamageStateVisuals
      states:
        Alive:
          Base: snake
        Critical:
          Base: dead
        Dead:
          Base: dead
    - type: MovementSpeedModifier
      baseWalkSpeed: 2
      baseSprintSpeed: 3.6
    - type: CFSenses
      lowLightVision: true
      impreciseFeet: 30
    - type: CFSmeller
    - type: NightVision
      enabled: true
      prioritized: true
      noiseAmount: 0
      lightingColor: "#9BB6FF18"
    - type: CFGOAP
      tactics: Beast
    - type: CFCombatant
      level: 2
      armorClass: 17
      speedFeet: 20
      maxHp: 26
      currentHp: 26
      printedFortitude: 8
      printedReflex: 11
      printedWill: 6
      printedPerception: 7
      printedAttack: 11
      printedDamage: 3
      trainedSkills:
        - Acrobatics
        - Athletics
        - Stealth
        - Survival
      printedSkills:
        Acrobatics: 9
        Athletics: 8
        Stealth: 8
        Survival: 6
    - type: CFAbilityScore
      abilityModifiers:
        Strength: 3
        Dexterity: 4
        Constitution: 3
        Intelligence: -4
        Wisdom: 1
        Charisma: -2
    # Each Strike with its own printed numbers. With no player in the body the AI picks (CFMonsterAttackSystem).
    - type: CFMonsterAttacks
      attacks:
      - name: fangs
        attack: 11
        dice: 1
        die: 8
        bonus: 3
        damageType: Piercing
        traits: [ Finesse ]
        onHit:
        - !type:CFExposeAfflictionEffect
          affliction: GiantViperVenom
    - type: CFCombatOptions
      naturalDice: 1
      naturalDie: 8
      naturalType: Piercing
      naturalAgile: false
      naturalFinesse: true
    - type: CFTrait
      traits:
        - Animal
    - type: MobThresholds
      thresholds:
        0: Alive
        25: Critical
        26: Dead
    # Monster parts: what a harvest gives, sharing the monster's parts value (CFHarvestSystem).
    - type: CFHarvestable
      parts:
        - id: CFFoodMeatMonster
          amount: 1
          maxAmount: 2
        - id: CFLeather1
          amount: 1
          maxAmount: 2
