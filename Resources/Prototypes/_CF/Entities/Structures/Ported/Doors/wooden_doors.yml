# Ported from CP14 by the CF converter.

- type: entity
  id: CFWoodenDoor
  parent:
  - CFBaseDoor
  - CFBaseFlammableSpreading
  name: wooden door
  description: Not the most solid construction, but it's better than nothing.
  suffix: Opened
  components:
  - type: Sprite
    sprite: _CP14/Structures/Doors/wooden_door.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Door
    openSound:
      path: /Audio/Effects/door_open.ogg
    closeSound:
      path: /Audio/Effects/door_close.ogg
  - type: Damageable
    damageModifierSet: CFWoodStructural
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          CFWoodenPlanks1:
            min: 1
            max: 2
      - !type:ChangeConstructionNodeBehavior
        node: CFWoodenDoorFrame
  - type: Construction
    graph: CFWoodenDoor
    node: CFWoodenDoor

- type: entity
  id: CFWoodenDoorMirrored
  parent: CFWoodenDoor
  suffix: Opened, Mirrored
  components:
  - type: Door
    openSpriteState: open_mirrored
    closedSpriteState: closed_mirrored
  - type: Construction
    graph: CFWoodenDoor
    node: CFWoodenDoorMirrored
