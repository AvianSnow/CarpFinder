# Young Camel. Ancestry Hit Points 8. At 1st level that is 16 Hit Points.
- type: cfPet
  id: CFPetCamel
  name: Camel
  kind: Companion
  entity: CFCompanionCamel
  size: "Medium or Large"
  strength: 3
  dexterity: 2
  constitution: 2
  intelligence: -4
  wisdom: 1
  charisma: 0
  hitPoints: 8
  description: "A young camel companion. It is built to be ridden. It ignores one temperature extreme, chosen when you gain it."
  mount: true
  speeds:
    - name: Speed
      feet: 35
  senses:
    - "low-light vision"
    - "scent (imprecise, 30 feet)"
  attacks:
    - name: "Jaws"
      die: 6
      damage: piercing
  skills:
    - name: Survival
      ability: Wisdom
  support: "It spits at a creature within 10 feet. A hit dazzles that creature for 1 round."
  advanced: "Sand Stride"

- type: entity
  parent: [ SimpleMobBase, CFCompanionBase ]
  id: CFCompanionCamel
  name: camel companion
  description: "A young camel companion. It is built to be ridden. It ignores one temperature extreme, chosen when you gain it."
  suffix: Companion
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: companion
      sprite: _CF/Mobs/companion-default.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: companion
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: HTN
    rootTask:
      task: CFCompanionCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 15
    maxHp: 16
    currentHp: 16
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 3
      Dexterity: 2
      Constitution: 2
      Intelligence: -4
      Wisdom: 1
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 6
    naturalType: piercing
    naturalFinesse: false
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      16: Dead
