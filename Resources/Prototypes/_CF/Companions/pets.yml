# Familiar bodies for the character-builder pet tab.
# Animal companions are one file each under Animals/.
# A familiar uses the master's AC and saves and keeps a flat 5 Hit Points.

- type: cfPet
  id: CFFamiliarBat
  name: Bat
  kind: Familiar
  size: Tiny
  strength: -4
  dexterity: 3
  constitution: 0
  intelligence: 0
  wisdom: 1
  charisma: 1
  hitPoints: 5
  scaleHitPoints: false
  usesMaster: true
  description: A tiny flying familiar. Its defenses match yours. It has 5 Hit Points and does not Strike.
  speeds:
    - name: Speed
      feet: 15
    - name: fly
      feet: 25
  senses:
    - low-light vision
    - echolocation (imprecise, 20 feet)
  support: Choose the familiar's daily abilities later. This sheet is the body.
  advanced: A familiar returns the day after it is dismissed or reduced to 0 Hit Points.

