- type: entity
  parent: CFSpellInstant
  id: CFAgileFeet
  name: Agile Feet
  description: "For 6 seconds: +5 status to Speed, difficult terrain is ignored, and leaving an enemy's reach in the first 2 seconds is a free Step. Costs a Focus Point."
  components:
