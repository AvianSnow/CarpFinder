# Ported from CP14 by the CF converter.

- type: entity
  parent: FoodInjectableBase
  id: CFFoodMeatBase
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: FlavorProfile
    flavors:
      - meaty
  - type: Extractable
    grindableSolutionName: food
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 2.5
        - ReagentId: UncookedAnimalProteins
          Quantity: 1
        - ReagentId: Fat
          Quantity: 2
  - type: Temperature
  - type: InternalTemperature
  - type: Tag
    tags:
    - CFMeat

- type: entity
  id: CFFoodMeatSliceBase
  parent: CFFoodMeatBase
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: Nutriment
          Quantity: 0.75
        - ReagentId: UncookedAnimalProteins
          Quantity: 0.33
        - ReagentId: Fat
          Quantity: 0.75
  - type: InternalTemperature
  - type: Tag
    tags:
    - CFMeatSlice

# Lamb Meat

- type: entity
  id: CFFoodMeatLamb
  parent: CFFoodMeatBase
  name: raw lamb
  description: Succulent lamb steak
  components:
  - type: Sprite
    sprite: _CP14/Objects/Consumable/Food/meat.rsi
    state: sheepmeat
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 24
        reagents:
        - ReagentId: Nutriment
          Quantity: 8
        - ReagentId: UncookedAnimalProteins
          Quantity: 6
        - ReagentId: Fat
          Quantity: 8
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
  - type: CFTemperatureTransformation
    entries:
    - temperatureRange: 400, 500
      transformTo: CFFoodMeatLambCooked
  - type: Tag
    tags:
    - CFMeat

- type: entity
  id: CFFoodMeatLambCooked
  parent: CFFoodMeatLamb
  name: cooked lamb steak
  components:
  - type: Sprite
    state: sheepmeat_cooked
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 24
        reagents:
        - ReagentId: Nutriment
          Quantity: 8
        - ReagentId: Protein
          Quantity: 6
        - ReagentId: Fat
          Quantity: 8
  - type: CFTemperatureTransformation
    autoTransformOnCooked: false
    entries:
    - temperatureRange: 400, 500
      transformTo: CFAsh1
  - type: Tag
    tags:
    - CFMeat

- type: entity
  id: CFFoodMeatLambSlice
  parent: CFFoodMeatSliceBase
