- type: constructionGraph
  id: CFWindowStoneBrick
  start: start
  graph:
    - node: start
      edges:
        - to: CFWindowFrameStoneBrick
          completed:
            - !type:SnapToGrid
              southRotation: true
          steps:
            - material: CFStone
              amount: 2
              doAfter: 5

    - node: CFWindowFrameStoneBrick
      entity: CFWindowFrameStoneBrick
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: CFStoneBlock1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Prying
              doAfter: 2
        - to: CFWindowStoneBrick
          steps:
            - material: CFGlassSheet
              amount: 2
              doAfter: 2

    - node: CFWindowStoneBrick
      entity: CFWindowStoneBrick
      edges:
        - to: CFWindowFrameStoneBrick
          steps:
            - tool: Screwing
              doAfter: 1
            - tool: Anchoring
              doAfter: 2
          completed:
            - !type:SpawnPrototype
              prototype: CFGlassSheet1
              amount: 2

    - node: CFWindowStoneBrickBroken
      entity: CFWindowStoneBrickBroken
      edges:
        - to: CFWindowFrameStoneBrick
          steps:
            - tool: Anchoring
              doAfter: 2
          completed:
            - !type:SpawnPrototype
              prototype: CFGlassShard
              amount: 1
