- type: cfClassChoice
  id: ModArmorSpeedBoosters
  class: Inventor
  slot: cf-class-choice-modification
  name: cf-class-choice-modarmorspeedboosters
  description: cf-class-choice-modarmorspeedboosters-desc
  grants:
    - !type:CFGrantWhile
      while: WearingInnovation
      stat: Speed
      type: Status
      value: 5
    - !type:CFGrantWhile
      while: Overdriven
      stat: Speed
      type: Status
      value: 10

