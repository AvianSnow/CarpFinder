# Exemplar actions: moving the spark, and each ikon's transcendence. CFIkonSystem runs them.

- type: entity
  parent: CFActivityInstant
  id: CFActShiftBarrowsEdge
  name: "Shift to Barrow's Edge"
  description: "Moves your spark here, or back to your soul if it is here already. A melee slashing or piercing weapon. 1 spirit per die, 3 if the target is below half its Hit Points."
  components:
  - type: CFShiftImmanenceAction
    ikon: BarrowsEdge

- type: entity
  parent: CFActivityInstant
  id: CFActTransBarrowsEdge
  name: "Drink of my Foes"
  description: "Spark Transcendence, then the spark moves to your next ikon. Regain half the damage of the Strike you just landed."
  components:
  - type: CFRadialSlot
    actions: 1
  - type: CFIkonTranscendence
    ikon: BarrowsEdge
    needsLastHit: true
  - type: CFEffectAction
  - type: CFDegreeEffects
    landed:
    - !type:CFIkonEffect
      deed: DrinkOfMyFoes

- type: entity
  parent: CFActivityInstant
  id: CFActShiftGleamingBlade
  name: "Shift to Gleaming Blade"
  description: "Moves your spark here, or back to your soul if it is here already. A sword or knife, or a slashing unarmed attack. 2 spirit per die."
  components:
  - type: CFShiftImmanenceAction
    ikon: GleamingBlade

- type: entity
  parent: CFActStrikeBase
  id: CFActTransGleamingBlade
  name: "Flowing Spirit Strike"
  description: "Spark Transcendence, then the spark moves to your next ikon. Strike the same target twice, the second at -2 unless agile. Their damage is not combined or turned to spirit yet: TBA."
  components:
  - type: CFRadialSlot
    actions: 2
  - type: CFIkonTranscendence
    ikon: GleamingBlade
  - type: CFStrikeAction
    twice: true

- type: entity
  parent: CFActivityInstant
  id: CFActShiftHandsOfTheWildling
  name: "Shift to Hands of the Wildling"
  description: "Moves your spark here, or back to your soul if it is here already. Unarmed attacks. 1 spirit splash per die."
  components:
  - type: CFShiftImmanenceAction
    ikon: HandsOfTheWildling

- type: entity
  parent: CFActivityTarget
  id: CFActTransHandsOfTheWildling
  name: "Feral Swing"
  description: "Spark Transcendence, then the spark moves to your next ikon. A 15-foot cone of spirit damage equal to your Strike, basic Reflex against your class DC."
  components:
  - type: CFRadialSlot
    actions: 2
  - type: TargetAction
    range: 3.5
  - type: CFIkonTranscendence
    ikon: HandsOfTheWildling
    area: true
  - type: CFAreaEffect
    shape: Cone
    sizeFeet: 15
  - type: CFCheck
    defense: Reflex
    dcSource: Class
  - type: CFDegreeEffects
    effects:
    - !type:CFIkonStrikeDamageEffect

