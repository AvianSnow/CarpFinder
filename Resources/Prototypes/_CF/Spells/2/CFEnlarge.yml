- type: entity
  parent: CFSpellTarget
  id: CFEnlarge
  name: Enlarge
  description: The target's melee Strikes deal 2 extra damage.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 2
  - type: CFSpell
    spell: Enlarge
    rank: 2
  - type: CFTargeting
    rangeFeet: 30
    filter: All
  - type: CFDegreeEffects
    landed:
    - !type:CFBonusEffect
      stat: MeleeDamage
      type: Status
      value: 2
      popup: cf-cond-enlarged
  - type: EntityTargetAction
    canTargetSelf: true
