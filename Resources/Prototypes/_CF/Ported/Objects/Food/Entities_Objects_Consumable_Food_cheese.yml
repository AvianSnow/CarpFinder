# Ported from CP14 by the CF converter.

- type: entity
  id: CFFoodCheeseWheel
  parent: FoodInjectableBase
  name: cheese wheel
  description: A large wheel of soft, fragrant piece of cheese.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
  - type: FlavorProfile
    flavors:
      - cheesy
  - type: Sprite
    sprite: _CP14/Objects/Consumable/Food/cheese.rsi
    layers:
      - state: cheese_wheel
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Nutriment
          Quantity: 21
        - ReagentId: Protein
          Quantity: 15 # 5 parts * 3 slices * 1 protein
  - type: Tag
    tags:
    - CFCheese

- type: entity
  id: CFFoodCheesePart
  parent: FoodInjectableBase
  name: cheese
  description: A triangle of soft, fragrant cheese.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
      - cheesy
  - type: Sprite
    sprite: _CP14/Objects/Consumable/Food/cheese.rsi
    layers:
      - state: cheese_part
        map: [ "random" ]
  - type: RandomSprite
    available:
      - random:
          cheese_part: ""
          cheese_part2: ""
          cheese_part3: ""
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 4.2
        - ReagentId: Protein
          Quantity: 3 # 3 slices * 1 protein
  - type: Tag
    tags:
    - CFCheese

- type: entity
  id: CFFoodCheeseSlice
  parent: FoodInjectableBase
  name: cheese slice
  description: A thin slice of delicious smelling cheese.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
      - cheesy
  - type: Sprite
    sprite: _CP14/Objects/Consumable/Food/cheese.rsi
    layers:
      - state: cheese_slice
        map: [ "random" ]
  - type: RandomSprite
    available:
      - random:
          cheese_slice: ""
          cheese_slice2: ""
          cheese_slice3: ""
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 2 # 1/3 cheese part
        reagents:
        - ReagentId: Nutriment
          Quantity: 1.4
        - ReagentId: Protein
          Quantity: 1
  - type: Tag
    tags:
    - CFCheese

