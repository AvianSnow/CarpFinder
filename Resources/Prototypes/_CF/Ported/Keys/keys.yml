- type: entity
  parent: BaseItem
  id: CFBaseKeyRing
  suffix: Empty
  name: key ring
  description: Allows you to comfortably store a large number of keys in one place.
  categories: [ ForkFiltered ]
  components:
  - type: CFKeyRing
  - type: Sprite
    sprite: _CP14/Objects/keys.rsi
    layers:
    - state: keyring
    - state: ring-0
      map: ["enum.StorageFillLayers.Fill"]
  - type: Appearance
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_CP14/Items/key_drop.ogg
      params:
        variation: 0.05
  - type: StorageFillVisualizer
    maxFillLevels: 4
    fillBaseName: ring
  - type: Storage
    grid:
    - 0,0,5,1
    maxItemSize: Small
    whitelist:
      tags:
        - CFKey
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Clothing
    quickEquip: false
    slots:
    - belt
  - type: PhysicalComposition
    materialComposition:
      CFIron: 5

- type: entity
  parent: CFBaseKeyRing
  id: CFKeyRingInnkeeper
  suffix: Innkeeper
  components:
  - type: StorageFill
    contents:
    - id: CFKeyTavernHall
    - id: CFKeyTavernStaff
    - id: CFKeyTavernDorms1
    - id: CFKeyTavernDorms2
