# Young Pufferfish. Ancestry Hit Points 4. At 1st level that is 11 Hit Points.
- type: cfPet
  id: CFPetPufferfish
  name: Pufferfish
  kind: Companion
  entity: CFCompanionPufferfish
  size: "Small"
  strength: 2
  dexterity: 3
  constitution: 1
  intelligence: -4
  wisdom: 1
  charisma: 1
  hitPoints: 4
  description: "A young pufferfish companion. Its spines add 1d4 poison damage, or 2d4 once specialized."
  speeds:
    - name: swim
      feet: 35
  senses:
    - "low-light vision"
  attacks:
    - name: "Spines"
      die: 6
      damage: piercing
      finesse: true
  skills:
    - name: Intimidation
      ability: Charisma
  support: "Until your next turn, a damaging Strike against a creature in its reach also deals 1d6 persistent poison, or 2d6 once it is nimble or savage."
  advanced: "Barbed Dash"

- type: entity
  parent: [ SimpleMobBase, CFCompanionBase ]
  id: CFCompanionPufferfish
  name: pufferfish companion
  description: "A young pufferfish companion. Its spines add 1d4 poison damage, or 2d4 once specialized."
  suffix: Companion
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: companion
      sprite: _CF/Mobs/companion-default.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: companion
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: HTN
    rootTask:
      task: CFGOAPCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 16
    maxHp: 11
    currentHp: 11
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 2
      Dexterity: 3
      Constitution: 1
      Intelligence: -4
      Wisdom: 1
      Charisma: 1
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 6
    naturalType: piercing
    naturalFinesse: true
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      11: Dead
