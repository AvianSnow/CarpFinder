# Young Terror Bird. Ancestry Hit Points 8. At 1st level that is 16 Hit Points.
- type: cfPet
  id: CFPetTerrorBird
  name: Terror Bird
  kind: Companion
  entity: CFCompanionTerrorBird
  size: "Large"
  strength: 3
  dexterity: 2
  constitution: 2
  intelligence: -4
  wisdom: 1
  charisma: 0
  hitPoints: 8
  description: "A young terror bird companion. It is built to be ridden."
  mount: true
  speeds:
    - name: Speed
      feet: 40
  senses:
    - "low-light vision"
  attacks:
    - name: "Beak"
      die: 8
      damage: piercing
    - name: "Talon"
      die: 6
      damage: piercing
      agile: true
  skills:
    - name: Survival
      ability: Wisdom
  support: "Until your next turn, a damaging Strike against a creature in its reach leaves that creature off-guard."
  advanced: "Tearing Clutch"

- type: entity
  parent: [ SimpleMobBase, CFCompanionBase ]
  id: CFCompanionTerrorBird
  name: terror bird companion
  description: "A young terror bird companion. It is built to be ridden."
  suffix: Companion
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: companion
      sprite: _CF/Mobs/companion-default.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: companion
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: HTN
    rootTask:
      task: CFCompanionCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 15
    maxHp: 16
    currentHp: 16
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 3
      Dexterity: 2
      Constitution: 2
      Intelligence: -4
      Wisdom: 1
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 8
    naturalType: piercing
    naturalFinesse: false
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      16: Dead
