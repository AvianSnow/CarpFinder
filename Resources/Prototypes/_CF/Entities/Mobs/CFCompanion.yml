# Shared body for an eidolon, animal companion, familiar, construct, thrall or summon.
# Parent this and override the name, sprite, and the CFCombatant / CFCombatOptions numbers.
# A young animal companion's level matches its master. It is trained in unarmed attacks,
# unarmored defense, barding, saves, Perception, Acrobatics, and Athletics.
# Hit Points are the type's ancestry Hit Points plus 6 + Constitution at each level.
# Each species lives in Resources/Prototypes/_CF/Companions/Animals.
#
# A companion thinks with a GOAP brain (CFCompanionSystem, CFGOAPCompanionSensorSystem). It takes its master's company,
# attacks enemies it sees by itself, and its home is wherever its master is, so it keeps close and comes back.
# Pointing helps it: at a creature, it goes for that one first; at the master, it comes straight back; at an item, it
# fetches it; at the floor, it forgets the creature it was sent at. A ghost can take the body.
# One hand can pick items up. A drop beside the summoner puts the item in their hands.

- type: entity
  id: CFCompanionBase
  abstract: true
  parent: CFGOAPBrain
  components:
  - type: CFCompanion
  # Every companion fights by itself, and the GOAP Strike step needs combat mode. A clean bot body has none.
  - type: CombatMode
  # Home follows the master. It wanders no further than this from them with nothing to do.
  - type: CFGOAP
    homeRange: 3
  # The lair leash keeps it with its master: too far, or chasing too long, and it comes back, though it still fights
  # whatever is in reach. It goes for anything it sees, so it never just guards.
  - type: CFGOAPLair
    engageTiles: 12
    leashTiles: 10
    chaseTime: 20
  - type: Hands
    startingHands:
      hand:
        location: Middle
  - type: ComplexInteraction
  - type: Strippable
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: HTN
    rootTask:
      task: CFGOAPCompound
  - type: CFFaction
    faction: Neutral
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 16
    maxHp: 20
    currentHp: 20
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 3
      Dexterity: 2
      Constitution: 2
      Intelligence: -4
      Wisdom: 1
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 8
    naturalType: piercing
    naturalAgile: true
  - type: MeleeWeapon
    hidden: true
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Piercing: 0
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: GhostRole
    makeSentient: true
    allowMovement: true
    name: cf-companion-ghost-name
    description: cf-companion-ghost-desc
    rules: ghost-role-information-familiar-rules
    mindRoles:
    - MindRoleGhostRoleFamiliar
    raffle:
      settings: short
  - type: GhostTakeoverAvailable

- type: entity
  parent: [ MobFox, CFCompanionBase ]
  id: CFSummon
  name: summoned ally
  description: An eidolon, animal companion, familiar, or summon. It fights for its summoner, and goes for the creature they point at first.
  suffix: Companion
  components:
  - type: HTN
    rootTask:
      task: CFGOAPCompound
  - type: NpcFactionMember
    factions:
    - Passive
