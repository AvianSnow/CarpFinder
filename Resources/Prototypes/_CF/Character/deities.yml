# CarpFinder: our own pantheon. Placeholder names and lore, to be replaced when the setting is written.
# Each gives a skill, a favored weapon and a divine font. An empty divineFont means the follower can use both.
# Domains are not built, so their names are only in the descriptions.

- type: cfDeity
  id: Solhara
  name: cf-deity-solhara
  description: cf-deity-solhara-desc
  divineFont: [ Heal ]
  trainedSkills:
    - Medicine
  grants:
    - !type:CFGrantWeaponFamiliarity
      weapons: [ CFSpear ]

