        base1: ""
        base2: ""
        base3: ""
        base4: ""
        base5: ""
  - type: PointLight
    color: "#36c98f"
    radius: 1.2
  - type: Solution
    id: food
    solution:
      maxVol: 5
      reagents:
      - ReagentId: CFLumiMushroom
        Quantity: 4
  - type: Extractable
    juiceSolution:
