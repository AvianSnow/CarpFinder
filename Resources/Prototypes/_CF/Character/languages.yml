# Languages. Rarity is from Archives of Nethys. Common ones can be picked with Intelligence in the character builder.
# The syllables are ours: they are what a listener hears without the language.

- type: language
  id: Common
  name: cf-language-common
  syllables: [ ta, len, mor, dan, ris, el, vor, ka, sem, bro ]

