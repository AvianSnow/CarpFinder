# Ported from CP14 by the CF converter.

- type: entity
  name: wood bench
  id: CFBenchWood
  parent:
  - SeatBase
  - CFBaseFlammable
  description: A bench carved from wood, a comfortable part of the interior designed for sitting and relaxing.
  categories: [ ForkFiltered ]
  components:
  - type: Transform
    anchored: true
  - type: Damageable
    damageModifierSet: CFWood
  - type: Injurable
    damageContainer: Inorganic
  - type: Rotatable
  - type: Sprite
    sprite: _CP14/Structures/Furniture/bench.rsi
    layers:
    - state: wooden
  - type: Physics
    bodyType: Static
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          CFWoodenPlanks1:
            min: 1
            max: 2
  - type: Construction
    graph: CFBenchWood
    node: CFBenchWood

- type: entity
  id: CFBenchWoodBirch
  parent: CFBenchWood
  components:
  - type: Sprite
    sprite: _CP14/Structures/Furniture/bench.rsi
    layers:
    - state: birch
  - type: Construction
    graph: CFBenchWood
    node: CFBenchWoodBirch
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          CFBirchWoodenPlanks1:
            min: 1
            max: 2
