# Wooden

- type: entity
  id: CFWallFrameWooden
  name: wooden wall frame
  parent: CFBaseWallFrame

  components:
    - type: Sprite
      sprite: _CP14/Structures/Walls/wooden_wall.rsi
      state: frame
    - type: Icon
      sprite: _CP14/Structures/Walls/wooden_wall.rsi
      state: frame
    - type: Construction
      graph: CFWallWooden
      node: CFWallFrameWooden
    - type: Damageable
      damageContainer: StructuralInorganic
      damageModifierSet: WoodMod
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 50
          behaviors:
            - !type:SpawnEntitiesBehavior
              spawn:
                CFWoodenPlanks1:
                  min: 1
                  max: 2
            - !type:PlaySoundBehavior
              sound:
                collection: WoodDestroy
            - !type:DoActsBehavior
              acts: ["Destruction"]

- type: entity
  id: CFWallWooden
  name: wooden wall
  parent: CFBaseWall
  components:
    - type: Sprite
      sprite: _CP14/Structures/Walls/wooden_wall.rsi
    - type: IconSmooth
      key: CFWall
      states:
        - !type:CornerSpriteSmoothing
          mask: [CFWall]
          base: wood
    - type: Icon
      sprite: _CP14/Structures/Walls/wooden_wall.rsi
      state: full
    - type: Damageable
      damageContainer: StructuralInorganic
      damageModifierSet: WoodMod
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 50
          behaviors:
            - !type:PlaySoundBehavior
              sound:
                collection: WoodDestroy
            - !type:SpawnEntitiesBehavior
              spawn:
                CFWoodenPlanks1:
                  min: 1
                  max: 2
            - !type:ChangeConstructionNodeBehavior
              node: CFWallFrameWooden
            - !type:DoActsBehavior
              acts: ["Destruction"]
    - type: Construction
      graph: CFWallWooden
      node: CFWallWooden

