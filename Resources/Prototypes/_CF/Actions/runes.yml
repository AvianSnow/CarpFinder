# Runesmith actions. CFRuneSystem runs them.

- type: entity
  parent: CFActivityTarget
  id: CFActInvokeRune
  name: Invoke Rune
  description: Invokes up to two of your runes on a creature within 30 feet, or on what it holds. They fade afterwards.
  components:
  - type: TargetAction
    range: 6.5
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFInvokeRuneAction

- type: entity
  parent: CFActivityTarget
  id: CFActTraceAtryl
  name: "Trace Atryl"
  description: "1 action next to the target, 2 from up to 30 feet away. It lasts 12 seconds. Reducing fire resistance: TBA. Invoke: 1d8 fire, basic Fortitude."
  components:
  - type: TargetAction
    range: 6.5
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFTraceRuneAction
    rune: Atryl
  - type: CFCheck
    defense: Fortitude
    dcSource: Class
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 8
      damageType: Fire
      diceEveryLevels: 2

