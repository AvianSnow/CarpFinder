- type: entity
  parent: CFSpellTarget
  id: CFHeroism
  name: Heroism
  description: The target gains +1 to attack rolls and saves.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 3
  - type: CFSpell
    spell: Heroism
    rank: 3
    delivery: Target
    rangeFeet: 5
    defense: None
    attackBonus: 1
    saveBonus: 1
    durationSeconds: 600
    friendly: true
    includeSelf: true
  - type: EntityTargetAction
    canTargetSelf: true
