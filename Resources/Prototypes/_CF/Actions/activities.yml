# Radial activities. Skill actions are granted to every character. Class and feat actions are granted when they apply.

- type: entity
  abstract: true
  parent: BaseAction
  id: CFActivityTarget
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 0.6
    itemIconStyle: BigAction
    raiseOnAction: true
  - type: TargetAction
    range: 1.5
    checkCanAccess: false
    targetingIndicator: true
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:CFActivityTargetEvent
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Action
    actions: 1

- type: entity
  abstract: true
  parent: BaseAction
  id: CFActivityInstant
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 0.6
    itemIconStyle: BigAction
    raiseOnAction: true
  - type: InstantAction
    event: !type:CFActivityInstantEvent
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Action
    actions: 1

- type: entity
  parent: CFActivityInstant
  id: CFActRage
  name: Rage
  description: +2 damage and -1 AC until you end the rage. You cannot cast spells while raging.
  components:
  - type: CFActivity
    kind: Rage

- type: entity
  parent: CFActivityTarget
  id: CFActFlurry
  name: Flurry of Blows
  description: Two unarmed Strikes. Costs 1 action.
  components:
  - type: CFActivity
    kind: Flurry

- type: entity
  parent: CFActivityTarget
  id: CFActSpellstrike
  name: Spellstrike
  description: A melee Strike that also deals force damage. Spends a rank 1 slot when you have one.
  components:
  - type: CFRadialSlot
    actions: 2
  - type: CFActivity
    kind: Spellstrike

- type: entity
  parent: CFActivityInstant
  id: CFActAnthem
  name: Courageous Anthem
  description: You and allies within 60 feet gain +1 to attacks, damage, and saves against fear. Playing a held instrument does the same.
  components:
  - type: CFActivity
    kind: Anthem

- type: entity
  parent: CFActivityTarget
  id: CFActSuddenCharge
  name: Sudden Charge
  description: Stride into reach and Strike. Costs 2 actions.
  components:
  - type: TargetAction
    range: 3
  - type: CFRadialSlot
    actions: 2
  - type: CFActivity
    kind: SuddenCharge

- type: entity
  parent: CFActivityInstant
  id: CFActPointBlank
  name: Point-Blank Stance
  description: Ignore volley and gain +2 damage with ranged Strikes inside the first range increment.
  components:
  - type: CFActivity
    kind: PointBlank

- type: entity
  parent: CFActivityInstant
  id: CFActLeap
  name: Leap
  description: Jump the way you are facing. 10 feet, or 15 feet with a Speed of 30 or more.
  components:
  - type: Sprite
    sprite: Interface/Actions/jump.rsi
    layers:
    - state: icon
  - type: CFActivity
    kind: Leap
