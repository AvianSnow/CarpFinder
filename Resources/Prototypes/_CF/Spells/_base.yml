# Shared parents for CarpFinder remaster spells.
# Each parent sets the delivery (CFTargeting). A spell file adds CFSpell (id and rank) and the effect
# components from Content.Shared/_CF/Effects: CFTargeting range, CFAreaEffect, CFCheck, CFDegreeEffects,
# CFProjectileDelivery, CFModeChoice, CFHeighten. Component fields merge with the parent's.

- type: entity
  abstract: true
  parent: BaseAction
  id: CFSpellInstant
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 0.6
    itemIconStyle: BigAction
    # The spell component is on the action. Without this, the cast is raised on the caster and never handled.
    raiseOnAction: true
  - type: InstantAction
    event: !type:CFSpellCastInstantEvent
  - type: CFTargeting
    delivery: Self
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default

- type: entity
  abstract: true
  parent: BaseAction
  id: CFSpellTarget
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 0.6
    itemIconStyle: BigAction
    raiseOnAction: true
  - type: TargetAction
    range: -1
    checkCanAccess: false
    targetingIndicator: true
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:CFSpellCastTargetEvent
  - type: CFTargeting
    delivery: Creature
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default

- type: entity
  abstract: true
  parent: BaseAction
  id: CFSpellObject
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 0.6
    itemIconStyle: BigAction
    raiseOnAction: true
  - type: TargetAction
    range: 2
    checkCanAccess: false
    targetingIndicator: true
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:CFSpellCastTargetEvent
  - type: CFTargeting
    delivery: Creature
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default

- type: entity
  abstract: true
  parent: CFSpellTarget
  id: CFSpellProjectile
  categories: [ HideSpawnMenu ]
  components:
  - type: CFTargeting
    delivery: Projectile
  - type: CFProjectileDelivery

- type: entity
  abstract: true
  parent: BaseAction
  id: CFSpellArea
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 0.6
    itemIconStyle: BigAction
    raiseOnAction: true
  - type: TargetAction
    range: -1
    checkCanAccess: false
    targetingIndicator: true
  - type: WorldTargetAction
    event: !type:CFSpellCastAreaEvent
  - type: CFTargeting
    delivery: Point
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
