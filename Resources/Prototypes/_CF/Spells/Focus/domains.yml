  id: CFHurtlingStone
  name: Hurtling Stone
  description: "A spell attack with a stone: 2d6 bludgeoning, 1d6 more per rank, and a push of 5 feet, or 10 on a critical hit. Costs a Focus Point."
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 1
  - type: CFSpell
    spell: HurtlingStone
    rank: 0
    focus: true
  - type: CFTargeting
    rangeFeet: 60
  - type: CFCheck
    defense: ArmorClass
  - type: CFHeighten
    baseRank: 1
    interval: 1
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 2
      die: 6
      damageType: Bludgeoning
      heightenDice: 1
    success:
    - !type:CFForcedMovementEffect
      feet: 5
    criticalSuccess:
    - !type:CFForcedMovementEffect
      feet: 10

- type: entity
  parent: CFSpellTarget
  id: CFSoothingWords
