    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 4
      flat: 1
      damageType: Force
      heightenDice: 1
      heightenFlat: 1

- type: cfSpell
  id: ForceFang
  name: Force Fang
  rank: 1
  traits: [Force, Manipulate]
  actionCost: One
  range: reach
  targets: 1 creature
  summary: Your attack becomes pure force and deals 1d4+1 force damage. It recharges Spellstrike.
  heightened: Damage increases by 1d4+1 per 2 ranks.

# Psi cantrips with no spell list. A Psychic's conscious mind grants them.

- type: entity
  parent: CFSpellTarget
  id: CFImaginaryWeapon
  name: Imaginary Weapon
  description: A weapon of force. A melee spell attack for 2d6 force damage. Amped, it strikes two creatures.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: ImaginaryWeapon
    rank: 0
  - type: CFPsiCantrip
    ampExtraTargets: 1
    ampHeightenDice: 2
  - type: CFTargeting
    rangeFeet: 5
    touch: true
  - type: CFHeighten
    baseRank: 1
    interval: 1
  - type: CFCheck
    defense: ArmorClass
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 2
      die: 6
      damageType: Force
      heightenDice: 1
    criticalSuccess:
    - !type:CFForcedMovementEffect
      feet: 10

- type: entity
  parent: CFSpellArea
  id: CFTelekineticRend
  name: Telekinetic Rend
  description: Creatures in a 5-foot burst take 1d6 bludgeoning, basic Fortitude. Amped, they also take 1d6 slashing. The second burst is TBA.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: TelekineticRend
    rank: 0
  - type: CFPsiCantrip
    ampEffects:
    - !type:CFDamageEffect
      dice: 1
      die: 6
      damageType: Slashing
      heightenDice: 1
  - type: CFTargeting
    rangeFeet: 60
  - type: CFAreaFill
    tile: CFFillMotes
    tint: true
  - type: CFAreaEffect
    # The rules give two 5-foot bursts that do not overlap. One aim can only place one of them.
    shape: Burst
    sizeFeet: 5
  - type: CFHeighten
    baseRank: 1
    interval: 2
  - type: CFCheck
    defense: Fortitude
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 6
      damageType: Bludgeoning
      heightenDice: 1

- type: entity
