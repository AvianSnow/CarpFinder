# Bard composition cantrips (Player Core) other than Courageous Anthem, which is CFActAnthem. CFComposition runs them
# through the Bard's aura: one at a time, for a minute, and a held instrument keeps the last one going.

- type: entity
  parent: CFActivityInstant
  id: CFActRallyingAnthem
  name: Rallying Anthem
  description: For a minute, you and allies within 60 feet gain +1 status to AC and saves. Ends another composition.
  components:
  - type: CFComposition
    id: RallyingAnthem
    effects:
    - { affects: Allies, includeSelf: true, sizeFeet: 60, stat: ArmorClass, type: Status, value: 1 }
    - { affects: Allies, includeSelf: true, sizeFeet: 60, stat: Saves, type: Status, value: 1 }

- type: entity
  parent: CFActivityInstant
  id: CFActTripleTime
  name: Triple Time
  description: For a minute, you and allies within 60 feet gain +10 feet status to Speed. Ends another composition.
  components:
  - type: CFComposition
    id: TripleTime
    effects:
    - { affects: Allies, includeSelf: true, sizeFeet: 60, stat: Speed, type: Status, value: 10 }

- type: entity
  parent: CFActivityInstant
  id: CFActSongOfStrength
  name: Song of Strength
  description: For a minute, you and allies within 60 feet gain +1 status to Athletics, and to the DC against being shoved, tripped, disarmed or grabbed. Ends another composition.
  components:
  - type: CFComposition
    id: SongOfStrength
    effects:
    - { affects: Allies, includeSelf: true, sizeFeet: 60, stat: SkillChecks, skill: Athletics, type: Status, value: 1 }
    - { affects: Allies, includeSelf: true, sizeFeet: 60, stat: ManeuverDc, type: Status, value: 1 }
