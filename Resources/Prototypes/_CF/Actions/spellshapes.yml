# Spellshapes. Each changes the next spell. What one does is data on CFSpellshape, and CFSpellshapeSystem runs it.

- type: entity
  abstract: true
  parent: CFActivityInstant
  id: CFActSpellshapeBase
  categories: [ HideSpawnMenu ]

- type: entity
  parent: CFActSpellshapeBase
  id: CFActReachSpell
  name: Reach Spell
  description: Your next spell with a range reaches 30 feet further. Lost if you spend an action on anything else first.
  components:
  - type: CFSpellshape
    extraRangeFeet: 30

- type: entity
  parent: CFActSpellshapeBase
  id: CFActWidenSpell
  name: Widen Spell
  description: Your next burst, cone or line spell with no duration gets bigger. Lost if you spend an action on anything else first.
  components:
  - type: CFSpellshape
    widens: true

- type: entity
  parent: CFActSpellshapeBase
  id: CFActConcealSpell
  name: Conceal Spell
  description: Your next spell is barely noticeable, so it does not set off reactions. Lost if you spend an action on anything else first.
  components:
  - type: CFSpellshape
    subtle: true

- type: entity
  parent: CFActSpellshapeBase
  id: CFActMelodiousSpell
  name: Melodious Spell
  description: You weave your next spell into a performance, so it does not set off reactions. Lost if you spend an action on anything else first.
  components:
  - type: CFSpellshape
    subtle: true

- type: entity
  parent: CFActSpellshapeBase
  id: CFActCrypticSpell
  name: Cryptic Spell
  description: You hide your next spell in the sounds of nature, so it does not set off reactions. Lost if you spend an action on anything else first.
  components:
  - type: CFSpellshape
    subtle: true

- type: entity
  parent: CFActSpellshapeBase
  id: CFActAmp
  name: Amp
  description: Your next psi cantrip is amped, and spends a Focus Point as you cast it.
  components:
  - type: CFRadialSlot
    group: Free
    actions: 0
  - type: CFSpellshape
    amp: true
