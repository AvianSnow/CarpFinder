# Young Shotalashu. Ancestry Hit Points 8. At 1st level that is 16 Hit Points.
- type: cfPet
  id: CFPetShotalashu
  name: Shotalashu
  kind: Companion
  entity: CFCompanionShotalashu
  size: "Medium or Large"
  strength: 2
  dexterity: 3
  constitution: 2
  intelligence: -3
  wisdom: 1
  charisma: 2
  hitPoints: 8
  description: "A young shotalashu companion. It is built to be ridden."
  mount: true
  speeds:
    - name: Speed
      feet: 40
  senses:
    - "darkvision"
  attacks:
    - name: "Claw"
      die: 6
      damage: slashing
      agile: true
  skills:
    - name: Survival
      ability: Wisdom
  support: "Until your next turn, a creature in its reach that you hit takes 1d6 mental damage, or 2d6 once it is nimble or savage."
  advanced: "Telepathic Pounce"

- type: entity
  parent: [ SimpleMobBase, CFCompanionBase ]
  id: CFCompanionShotalashu
  name: shotalashu companion
  description: "A young shotalashu companion. It is built to be ridden."
  suffix: Companion
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: companion
      sprite: _CF/Mobs/companion-default.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: companion
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: HTN
    rootTask:
      task: CFCompanionCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 16
    maxHp: 16
    currentHp: 16
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 2
      Dexterity: 3
      Constitution: 2
      Intelligence: -3
      Wisdom: 1
      Charisma: 2
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 6
    naturalType: slashing
    naturalFinesse: false
    naturalAgile: true
  - type: MobThresholds
    thresholds:
      0: Alive
      16: Dead
