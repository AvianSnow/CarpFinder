# CarpFinder: Inventor innovations, and the modification for one. A character picks one of each. A modification needs the
# innovation it fits (requiresChoice), so the builder only offers the right ones.
#
# A weapon innovation is built from a base weapon the player picks (a Named choice of weapon prototype ids) with the
# modification's traits on it: CFGrantInnovationWeapon. Advanced Design has no base, because no advanced weapon exists yet.

- type: cfClassChoice
  id: InnovationArmor
  class: Inventor
  slot: cf-class-choice-innovation
  name: cf-class-choice-innovationarmor
  description: cf-class-choice-innovationarmor-desc
  grants:
    - !type:CFGrantItem
      item: CFInnovationPowerSuit

- type: cfClassChoice
  id: InnovationArmorSubterfuge
  class: Inventor
  slot: cf-class-choice-innovation
  name: cf-class-choice-innovationarmorsubterfuge
  description: cf-class-choice-innovationarmorsubterfuge-desc
  grants:
    - !type:CFGrantItem
      item: CFInnovationSubterfugeSuit

- type: cfClassChoice
  id: InnovationConstruct
  class: Inventor
  slot: cf-class-choice-innovation
  name: cf-class-choice-innovationconstruct
  description: cf-class-choice-innovationconstruct-desc

- type: cfClassChoice
  id: InnovationWeapon
  class: Inventor
  slot: cf-class-choice-innovation
  name: cf-class-choice-innovationweapon
  description: cf-class-choice-innovationweapon-desc

# Armor modifications

- type: cfClassChoice
  id: ModArmorHarmonicOscillator
  class: Inventor
  slot: cf-class-choice-modification
  name: cf-class-choice-modarmorharmonicoscillator
  description: cf-class-choice-modarmorharmonicoscillator-desc
  requiresChoice: [ InnovationArmor, InnovationArmorSubterfuge ]
  grants:
    - !type:CFGrantInnovationResistance
      resistance:
        types:
          - Force
          - Sonic
        flat: 3

- type: cfClassChoice
