- type: cfDomain
  id: Trickery
  name: cf-domain-trickery
  description: cf-domain-trickery-desc
  grants:
      - !type:CFGrantFocusPoints
      - !type:CFGrantReaction
        reaction:
          name: cf-reaction-sudden-shift
          trigger: MeleeMissed
          focusPoints: 1
          onSelf:
          - !type:CFFreeStepEffect
            durationSeconds: 2
          - !type:CFApplyConditionEffect
            condition: Concealed
            value: 1
            durationSeconds: 6

