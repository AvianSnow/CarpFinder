# Ported from CP14 by the CF converter.

- type: entity
  parent: [FoodInjectableBase, ItemHeftyBase]
  id: CFFoodEggBase
  description: An egg!
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: Edible
    trash:
    - CFEggshells
  - type: Sprite
    sprite: _CP14/Objects/Consumable/Food/egg.rsi
    state: brown
  - type: Item
    size: Tiny
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 6
        reagents:
        - ReagentId: Egg
          Quantity: 6
        - ReagentId: Protein
          Quantity: 2
  - type: DrawableSolution
    solution: food
  # egg fragile
  - type: DamageOnHighSpeedImpact
    minimumSpeed: 0.1
    damage:
      types:
        Blunt: 1
  - type: Damageable
  - type: Injurable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: desecration
      - !type:SpillBehavior
        solution: food
      - !type:SpawnEntitiesBehavior
        spawn:
          CFEggshells:
            min: 1
            max: 1
          # Wow double-yolk you're so lucky!
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Temperature
  - type: InternalTemperature
    # ~1mm shell and ~1cm of albumen
    # conductivity of egg shell based on a paper from Romanoff and Romanoff (1949)
  - type: Tag
    tags:
    - CFEgg
    - CFFitInFryingPan

# Splat

- type: entity
  name: eggshells
  parent: BaseItem
  id: CFEggshells
  description: You're walkin' on 'em bud.
  categories: [ ForkFiltered ]
  components:
  - type: Edible
  - type: Sprite
    sprite: _CP14/Objects/Consumable/Food/egg.rsi
    state: brown_shell
  - type: Item
    size: Tiny
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 2
        reagents:
        - ReagentId: Egg
          Quantity: 1

- type: entity
  parent: CFFoodEggBase
  id: CFFoodEgg
  name: egg
  components:
  - type: CFItemPrice
    copper: 3
  - type: Sprite
    layers:
      - state: icon
        map: [ "random" ]
  - type: RandomSprite
    available:
      - random:
          brown: ""
          icon: ""
  - type: CFTemperatureTransformation
    entries:
    - temperatureRange: 400, 500
      transformTo: CFFoodEgg

- type: entity
  id: CFFoodEggCooked
  parent: CFFoodEgg
  name: cooked egg
  components:
  - type: CFItemPrice
    copper: 10
  - type: Edible
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 6
        reagents:
        - ReagentId: EggCooked
          Quantity: 6
        - ReagentId: Protein
          Quantity: 2
