- type: entity
  parent: CFSpellArea
  id: CFBless
  name: Bless
  description: You and nearby allies gain +1 to attack rolls and saves.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 1
  - type: CFSpell
    spell: Bless
    rank: 1
  - type: CFAreaEffect
    shape: Emanation
    sizeFeet: 5
    includeSelf: true
    filter: Allies
  - type: CFDegreeEffects
    landed:
    - !type:CFBonusEffect
      stat: AttackRoll
      type: Status
      value: 1
    - !type:CFBonusEffect
      stat: Saves
      type: Status
      value: 1
