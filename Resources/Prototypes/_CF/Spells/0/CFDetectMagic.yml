- type: entity
  parent: CFSpellInstant
  id: CFDetectMagic
  name: Detect Magic
  description: You sense whether magic is nearby.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: DetectMagic
    rank: 0
  # The Infinite Eye's amp: +1 status to saves against magic for 3 rounds. The rules give it against the magic found.
  - type: CFPsiCantrip
    ampEffects:
    - !type:CFBonusEffect
      stat: Saves
      type: Status
      value: 1
      trait: Magical
      durationSeconds: 18
      onUser: true
  - type: CFTargeting
    filter: All
  - type: CFDegreeEffects
    landed:
    - !type:CFDetectMagicEffect
