- type: entity
  parent: CFSpellTarget
  id: CFHeal
  name: Heal
  description: "Pick 1, 2 or 3 actions. 1: touch, 1d8 Hit Points. 2: 30 feet, 1d8+8. 3: every creature in a 30-foot emanation, 1d8. Undead take the 1d8 as vitality damage instead, basic Fortitude."
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 1
    actions: 2
  - type: CFSpell
    spell: Heal
    rank: 1
  - type: CFTargeting
    rangeFeet: 30
    filter: All
  # The menu picks how many actions. 4 is Directed Channel's cone, aimed at the creature clicked.
  - type: CFModeChoice
    modes:
    - { value: 1, name: cf-mode-heal-1, tooltip: cf-mode-heal-1-desc, actions: 1, touch: true }
    - { value: 2, name: cf-mode-heal-2, tooltip: cf-mode-heal-2-desc, actions: 2 }
    - { value: 3, name: cf-mode-heal-3, tooltip: cf-mode-heal-3-desc, actions: 3, immediate: true, areaShape: Emanation, areaFeet: 30 }
    - { value: 4, name: cf-mode-heal-cone, tooltip: cf-mode-heal-cone-desc, actions: 3, areaShape: Cone, areaFeet: 60, requires: DirectedChannel }
  - type: CFCheck
    defense: Fortitude
    harmedBy: Vitality
  - type: CFDegreeEffects
    effects:
    - !type:CFVitalEnergyEffect
      energy: Vitality
      healingFlat: 8
      heightenHealingFlat: 8
      healingFlatMode: 2
  - type: CFHeighten
    baseRank: 1
  - type: EntityTargetAction
    canTargetSelf: true
