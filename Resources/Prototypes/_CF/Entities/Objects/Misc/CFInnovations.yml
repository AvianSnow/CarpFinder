# An Inventor's innovations. A weapon innovation is built in code from the base weapon the player picked
# (CFGrantInnovationWeapon). A construct is in Companions/constructs.yml.

- type: entity
  parent: CFBreastplate
  id: CFInnovationPowerSuit
  name: power suit
  description: A cutting-edge suit of medium armor covered in gizmos. It is your innovation.
  components:
  - type: CFInnovation
  - type: CFArmor
    category: Medium
    group: Composite
    acBonus: 5
    dexCap: 1
    checkPenalty: -2
    speedPenalty: -5
    strength: 3

- type: entity
  parent: CFHideArmor
  id: CFInnovationSubterfugeSuit
  name: subterfuge suit
  description: A light, quiet suit of medium armor with hidden gizmos. It is your innovation.
  components:
  - type: CFInnovation
  - type: CFArmor
    category: Medium
    group: Composite
    acBonus: 2
    dexCap: 4
    checkPenalty: -1
    speedPenalty: 0
    strength: 0
  - type: CFBulk
    bulk: 1

# A construct folded up by Collapse Construct. CFInventorServerSystem makes and unfolds it.
- type: entity
  parent: BaseItem
  id: CFCollapsedConstruct
  name: collapsed construct
  description: A construct companion folded into a case of cogs and plates. Its Inventor can unfold it in a moment.
  components:
  - type: CFCollapsedConstruct
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_yellow.rsi
    state: icon
  - type: Item
    size: Large
    sprite: Objects/Tools/Toolboxes/toolbox_yellow.rsi
  - type: CFBulk
    bulk: 2
