# Potions brewed in a cauldron (CFCauldron). The ingredients and 10 units of water go in, it boils on a fire for
# craftTime seconds, then the brewer rolls Crafting against the item's DC, with the Alchemical Crafting or Magical
# Crafting feat as the item asks. Each recipe needs its formula (Entities/Objects/Formulas/formulas_alchemy.yml).
#
# The ingredients come to about half the item's Archives of Nethys price, as the Craft activity asks: a level 1 item
# at 3 gp is 150 copper of herbs. Prices are on the ingredients (Entities/Objects/Alchemy/ingredients.yml):
# dayflin 30, sage 40, blue amanita 50, air lily 50, fly agaric 50, blood rose 60, silver needle 60, lumishroom 80,
# chromium slime 400. CFAlchemyTest keeps the sums near half price.

# Elixir of Life (Minor), 3 gp: sage 40 + blue amanita 50 + silver needle 60 = 150.
- type: craftingRecipe
  id: ElixirOfLifeMinor
  tag: CFRecipeCauldron
  category: Alchemy
  craftTime: 20
  requirements:
  - !type:CFItemRequirement
    protoId: CFWildSage
  - !type:CFItemRequirement
    protoId: CFBlueAmanita
  - !type:CFItemRequirement
    protoId: CFSilverNeedle
  result: CFElixirOfLifeMinor

