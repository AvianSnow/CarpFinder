- type: entity
  parent: CFSpellTarget
  id: CFSlow
  name: Slow
  description: A Fortitude save. On a success the target is slowed 1 for 6 seconds, on a failure for a minute, and on a critical failure slowed 2 for a minute.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 3
  - type: CFSpell
    spell: Slow
    rank: 3
  - type: CFTargeting
    rangeFeet: 30
  - type: CFCheck
    defense: Fortitude
    basicSave: false
  - type: CFDegreeEffects
    success:
    - !type:CFApplyConditionEffect
      condition: Slowed
      value: 1
      durationSeconds: 6
    failure:
    - !type:CFApplyConditionEffect
      condition: Slowed
      value: 1
      durationSeconds: 60
    criticalFailure:
    - !type:CFApplyConditionEffect
      condition: Slowed
      value: 2
      durationSeconds: 60
