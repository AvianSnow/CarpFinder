# Domains: what Domain Initiate, Deity's Domain and the like give. Each grants its domain spell (Spells/Focus/domains.yml),
# or for a spell cast as a reaction, a Focus Point and the reaction. Ids are the Player Core and Divine Mysteries names.

- type: cfDomain
  id: Sun
  name: cf-domain-sun
  description: cf-domain-sun-desc
  grants:
      - !type:CFGrantFocusSpell
        spell: DazzlingFlash

- type: cfDomain
  id: Healing
  name: cf-domain-healing
  description: cf-domain-healing-desc
  grants:
      - !type:CFGrantFocusSpell
        spell: HealersBlessing

- type: cfDomain
  id: Repose
  name: cf-domain-repose
  description: cf-domain-repose-desc
  grants:
      - !type:CFGrantFocusPoints
      - !type:CFGrantReaction
        reaction:
          name: cf-reaction-share-burden
          trigger: AllySaveWouldFail
          trait: Emotion
          rangeFeet: 30
          focusPoints: 1

- type: cfDomain
  id: Truth
  name: cf-domain-truth
  description: cf-domain-truth-desc
  grants:
      - !type:CFGrantFocusSpell
        spell: WordOfTruth

- type: cfDomain
  id: Duty
  name: cf-domain-duty
  description: cf-domain-duty-desc
  grants:
