- type: entity
  parent: CFSpellTarget
  id: CFDispelMagic
  name: Dispel Magic
  description: You attempt to counteract one spell on the target. An enemy's spell is chosen first, then the strongest.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 2
  - type: CFSpell
    spell: DispelMagic
    rank: 2
  - type: CFTargeting
    rangeFeet: 120
    filter: All
  - type: CFDegreeEffects
    landed:
    - !type:CFDispelEffect
  - type: EntityTargetAction
    canTargetSelf: true
