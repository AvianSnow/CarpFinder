        #      amount: 2
        #      doAfter: 2

    - node: CFWallWoodenSpruce
      entity: CFWallWoodenSpruce
      edges:
        - to: CFWallFrameWoodenSpruce
          steps:
            - tool: CFHammering
              doAfter: 4
          completed:
            - !type:SpawnPrototype
              prototype: CFSpruceWoodenPlanks1
