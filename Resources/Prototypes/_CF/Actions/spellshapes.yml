# Spellshapes. Each changes the next spell. What one does is data on CFSpellshape, and CFSpellshapeSystem runs it.

- type: entity
  abstract: true
  parent: CFActivityInstant
  id: CFActSpellshapeBase
  categories: [ HideSpawnMenu ]

- type: entity
  parent: CFActSpellshapeBase
  id: CFActReachSpell
  name: Reach Spell
  description: Your next spell with a range reaches 30 feet further. Lost if you spend an action on anything else first.
  components:
  - type: CFSpellshape
    extraRangeFeet: 30

- type: entity
  parent: CFActSpellshapeBase
  id: CFActFormControl
  name: Form Control
  description: Your next Untamed Form is 2 ranks lower, at least rank 1, and lasts an hour. Lost if you spend an action on anything else first.
  components:
  - type: CFSpellshape
    formControl: true

- type: entity
  parent: CFActSpellshapeBase
  id: CFActWidenSpell
  name: Widen Spell
  description: Your next burst, cone or line spell with no duration gets bigger. Lost if you spend an action on anything else first.
  components:
  - type: CFSpellshape
    widens: true

- type: entity
  parent: CFActSpellshapeBase
  id: CFActConcealSpell
  name: Conceal Spell
  description: Your next spell is barely noticeable, so it does not set off reactions. Lost if you spend an action on anything else first.
  components:
  - type: CFSpellshape
    subtle: true

- type: entity
  parent: CFActSpellshapeBase
  id: CFActMelodiousSpell
  name: Melodious Spell
  description: You weave your next spell into a performance, so it does not set off reactions. Lost if you spend an action on anything else first.
  components:
  - type: CFSpellshape
    subtle: true

- type: entity
  parent: CFActSpellshapeBase
  id: CFActCrypticSpell
  name: Cryptic Spell
  description: You hide your next spell in the sounds of nature, so it does not set off reactions. Lost if you spend an action on anything else first.
  components:
  - type: CFSpellshape
    subtle: true

- type: entity
  parent: CFActSpellshapeBase
  id: CFActAmp
  name: Amp
  description: Your next psi cantrip is amped, and spends a Focus Point as you cast it.
  components:
  - type: CFRadialSlot
    group: Free
    actions: 0
  - type: CFSpellshape
    amp: true

- type: entity
  parent: CFActSpellshapeBase
  id: CFActEnergyAblation
  name: Energy Ablation
  description: If your next spell deals acid, cold, electricity, fire, force, sonic, vitality or void damage, you gain resistance to that energy equal to the spell's rank for 6 seconds. Lost if you spend an action on anything else first.
  components:
  - type: CFSpellshape
    energyAblation: true

- type: entity
  parent: CFActSpellshapeBase
  id: CFActSpiritualExpansionSpell
  name: Spiritual Expansion Spell
  description: Your next burst, cone or line spell with no duration gets bigger. Lost if you spend an action on anything else first.
  components:
  - type: CFSpellshape
    widens: true

- type: entity
  parent: CFActSpellshapeBase
  id: CFActGraspingSpiritsSpell
  name: Grasping Spirits Spell
  description: Your next spell with a range reaches 30 feet further. Once per 10 minutes. Lost if you spend an action on anything else first.
  components:
  - type: Action
    useDelay: 600
  - type: CFSpellshape
    extraRangeFeet: 30

# Player Core, page 131.
- type: entity
  parent: CFActSpellshapeBase
  id: CFActSnowdriftSpell
  name: Snowdrift Spell
  description: If your next spell has the air, water or cold trait and not fire, the ground under and around the first creature it affects fills with snow, difficult terrain for 6 seconds. Lost if you spend an action on anything else first.
  components:
  - type: CFSpellshape
    snowdrift: true

# Player Core, Cleric.
- type: entity
  parent: CFActSpellshapeBase
  id: CFActDivineInfusion
  name: Divine Infusion
  description: If your next spell is Heal or Harm restoring Hit Points to one creature, its melee Strikes deal 1d6 more vitality or void damage for 6 seconds, 2d6 from rank 5. Lost if you spend an action on anything else first.
  components:
  - type: CFSpellshape
    divineInfusion: true

# A Psychic's feat amps: armed in place of the usual Amp, and spent the same way.
- type: entity
  parent: CFActSpellshapeBase
  id: CFActAmpMentalBalm
  name: "Amp: Mental Balm"
  description: Your next psi cantrip on yourself or an ally is amped with soothing waves instead of its own amp. Each ally it reaches gets +2 status to Will saves against emotion effects for a minute, and stops being frightened or stupefied. Spends a Focus Point.
  components:
  - type: CFRadialSlot
    group: Free
    actions: 0
  - type: CFSpellshape
    amp: true
    ampVariant: MentalBalm

- type: entity
  parent: CFActSpellshapeBase
  id: CFActAmpHomingBeacon
  name: "Amp: Homing Beacon"
  description: "Your next psi cantrip is amped with a beacon instead of its own amp. An enemy it hits or that fails its save is seen: invisible becomes only concealed, concealed becomes plain, and it cannot hide again for a minute. Spends a Focus Point."
  components:
  - type: CFRadialSlot
    group: Free
    actions: 0
  - type: CFSpellshape
    amp: true
    ampVariant: HomingBeacon
