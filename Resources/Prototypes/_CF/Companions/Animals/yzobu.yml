# Young Yzobu. Ancestry Hit Points 6. At 1st level that is 14 Hit Points.
- type: cfPet
  id: CFPetYzobu
  name: Yzobu
  kind: Companion
  entity: CFCompanionYzobu
  size: "Medium"
  strength: 3
  dexterity: 2
  constitution: 2
  intelligence: -4
  wisdom: 1
  charisma: 0
  hitPoints: 6
  description: "A young yzobu companion. It is built to be ridden."
  mount: true
  speeds:
    - name: Speed
      feet: 30
  attacks:
    - name: "Horn"
      die: 8
      damage: piercing
    - name: "Hoof"
      die: 6
      damage: bludgeoning
      agile: true
  skills:
    - name: Intimidation
      ability: Charisma
  support: "Until your next turn, a creature in its reach that you damage is sickened 1. The sickness ends after 1 round."
  advanced: "Bucking Trample"

- type: entity
  parent: [ SimpleMobBase, CFCompanionBase ]
  id: CFCompanionYzobu
  name: yzobu companion
  description: "A young yzobu companion. It is built to be ridden."
  suffix: Companion
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: companion
      sprite: _CF/Mobs/companion-default.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: companion
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: HTN
    rootTask:
      task: CFGOAPCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 15
    maxHp: 14
    currentHp: 14
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 3
      Dexterity: 2
      Constitution: 2
      Intelligence: -4
      Wisdom: 1
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 8
    naturalType: piercing
    naturalFinesse: false
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      14: Dead
