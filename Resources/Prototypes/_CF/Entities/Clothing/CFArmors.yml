# Player Core armor on CP14 sprites.

- type: entity
  parent: ClothingOuterBase
  id: CFChainShirt
  name: chain shirt
  description: A suit of chain shirt.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _CP14/Clothing/OuterClothing/chainmail.rsi
    state: icon
  - type: Clothing
    sprite: _CP14/Clothing/OuterClothing/chainmail.rsi
  - type: CFArmor
    category: Light
    group: Chain
    acBonus: 2
    dexCap: 3
    checkPenalty: -1
    speedPenalty: 0
    strength: 1
  - type: CFTrait
    traits:
    - Flexible
    - Noisy
  - type: CFItem
    level: 0
  - type: CFBulk
    bulk: 1
  - type: CFItemPrice
    copper: 500

