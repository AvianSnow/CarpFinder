# Young Moth. Ancestry Hit Points 6. At 1st level that is 13 Hit Points.
- type: cfPet
  id: CFPetMoth
  name: Moth
  kind: Companion
  entity: CFCompanionMoth
  size: "Small"
  strength: 2
  dexterity: 3
  constitution: 1
  intelligence: -4
  wisdom: 2
  charisma: 0
  hitPoints: 6
  description: "A young moth companion. Echolocation cannot detect it."
  speeds:
    - name: Speed
      feet: 15
    - name: fly
      feet: 30
  senses:
    - "darkvision"
    - "scent (imprecise, 30 feet)"
  attacks:
    - name: "Proboscis"
      die: 6
      damage: piercing
      finesse: true
  skills:
    - name: Stealth
      ability: Dexterity
  support: "Until your next turn, a concealed or hidden creature in its reach that you damage is easier to target: DC 3 if concealed, DC 9 if hidden."
  advanced: "Ultrasonic Scream"

- type: entity
  parent: [ MobMothroach, CFCompanionBase ]
  id: CFCompanionMoth
  name: moth companion
  description: "A young moth companion. Echolocation cannot detect it."
  suffix: Companion
  components:
  - type: HTN
    rootTask:
      task: CFCompanionCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 16
    maxHp: 13
    currentHp: 13
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 2
      Dexterity: 3
      Constitution: 1
      Intelligence: -4
      Wisdom: 2
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 6
    naturalType: piercing
    naturalFinesse: true
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      13: Dead
