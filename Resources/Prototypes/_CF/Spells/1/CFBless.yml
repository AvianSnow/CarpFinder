- type: entity
  parent: CFSpellArea
  id: CFBless
  name: Bless
  description: You and allies within 15 feet gain +1 to attack rolls.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 1
  - type: CFSpell
    spell: Bless
    rank: 1
  - type: CFAreaFill
    tile: CFFillMotes
    tint: true
  - type: CFAreaEffect
    shape: Emanation
    sizeFeet: 15
    includeSelf: true
    filter: Allies
  - type: CFDegreeEffects
    landed:
    - !type:CFBonusEffect
      stat: AttackRoll
      type: Status
      value: 1
