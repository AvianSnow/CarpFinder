# Adventure companies are a party with their own members and with each other. Players fight each other only
# when both turn PvP on (`pvp` command, CFPvpComponent), whatever their factions say.
# Neutral creatures do not hunt each other or the companies. Attacks against neutral creatures are still allowed.

- type: cfFaction
  id: Alpha
  name: cf-faction-alpha
  jobs:
  - CFAlpha
  party:
  - Beta
  - Charlie
  - Delta

- type: cfFaction
  id: Beta
  name: cf-faction-beta
  jobs:
  - CFBeta
  party:
  - Alpha
  - Charlie
  - Delta

- type: cfFaction
  id: Charlie
  name: cf-faction-charlie
  jobs:
  - CFCharlie
  party:
  - Alpha
  - Beta
  - Delta

- type: cfFaction
  id: Delta
  name: cf-faction-delta
  jobs:
  - CFDelta
  party:
  - Alpha
  - Beta
  - Charlie

# Wild creatures. They hunt every adventure company and leave each other alone.
- type: cfFaction
  id: Monster
  name: cf-faction-monster
  opposition:
  - Alpha
  - Beta
  - Charlie
  - Delta

- type: cfFaction
  id: Neutral
  name: cf-faction-neutral
  same: Neutral
  jobs:
  - CFMerchant
  - CFArcaneResearcher
  - CFArcaneArtificer
