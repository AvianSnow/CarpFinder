# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Necromancer
  name: cf-class-necromancer
  description: cf-class-description-necromancer
  hitPoints: 8
  keyAbility: Intelligence
  hitPointsAbility: Constitution
  classDC: cf-class-necromancer
  proficiencies:
    perception:
      trained:
        - Perception
    savingThrows:
      trained:
        - Reflex
        - Will
      expert:
        - Fortitude
    skills:
      trained:
        - Occultism
    attacks:
      trained:
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - LightArmor
  additionalSkillTrainings: 2
  spellcasting:
    tradition: Occult
    ability: Intelligence
    cantrips: 5
    slots:
      - 1
    prepared: true
  features:
    - level: 1
      name: "Fatal Method"
      description: "Choose a fatal method in the builder. Thralls are not built yet: TBA"
    - level: 1
      name: "Grave Spells"
      description: "Focus spells that use thralls. Thralls are not built yet: TBA"
    - level: 1
      name: "Grim Fascination"
      description: "Choose a grim fascination in the builder. Thralls are not built yet: TBA"
    - level: 1
      name: "Mastery of Life and Death"
      description: "Swap void and vitality on your spells: TBA"
    - level: 1
      name: "Necromancer Spellcasting"
      description: "Level 1 cantrips and spell slots are on the spell sheet."
    - level: 1
      name: "Undead Lore"
      description: "Recall Knowledge about undead: TBA"
    - level: 3
      name: "Inevitable Return"
      description: "Raise a thrall from a fresh corpse. Thralls are not built yet: TBA"
    - level: 3
      name: "Mental Wards"
      description: "Expert in Will saves. Better results against undead minds: TBA"
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Will
          rank: Expert
    - level: 5
      name: "Reflex Expertise"
      description: "Expert in Reflex saves."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Reflex
          rank: Expert
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
