# CarpFinder: the stock lizard ears, horns, frills and snouts, offered on the ancestor kobold sprite.
# They are copies with ids of their own, so the stock marking file stays as upstream has it.
# The art is stock's reptilian_parts.rsi, which the stock kobold wears too.

- type: marking
  id: CFKoboldFrillsAquatic
  bodyPart: HeadSide
  groupWhitelist: [CFKoboldAnimal]
  sprites:
  - sprite: Mobs/Customization/reptilian_parts.rsi
    state: frills_aquatic

