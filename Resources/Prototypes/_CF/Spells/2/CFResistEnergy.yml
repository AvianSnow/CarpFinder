- type: entity
  parent: CFSpellTarget
  id: CFResistEnergy
  name: Resist Energy
  description: The target resists 5 fire damage.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 2
  - type: CFSpell
    spell: ResistEnergy
    rank: 2
  - type: CFTargeting
    rangeFeet: 5
    touch: true
    filter: All
  - type: CFDegreeEffects
    landed:
    - !type:CFResistanceEffect
      damageType: Fire
      amount: 5
      heightenAmount: 5
  - type: CFHeighten
    baseRank: 2
    interval: 2
  - type: EntityTargetAction
    canTargetSelf: true
