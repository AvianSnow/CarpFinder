# One graph for every staircase and roof ramp, after CrystallEdge's. Each shape (straight, corner, inner corner)
# starts as a wooden frame of two planks, and is finished with a plank, two stones or two roof tiles hammered onto it. Prying a frame takes
# it apart, and a hammer takes a finished staircase back to its frame.

- type: constructionGraph
  id: CFZLevelStairs
  start: start
  graph:
    - node: start
      edges:
        - to: CFZLevelStairsFrame
          completed:
            - !type:SnapToGrid
          steps:
            - material: CFWoodenPlanks
              amount: 2
              doAfter: 2
        - to: CFZLevelStairsFrameCorner
          completed:
            - !type:SnapToGrid
          steps:
            - material: CFWoodenPlanks
              amount: 2
              doAfter: 2
        - to: CFZLevelStairsFrameCornerInner
          completed:
            - !type:SnapToGrid
          steps:
            - material: CFWoodenPlanks
              amount: 2
              doAfter: 2

    # Frames

    - node: CFZLevelStairsFrame
      entity: CFZLevelStairsFrame
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: CFWoodenPlanks1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Prying
              doAfter: 2
        - to: CFZLevelStairsWooden
          steps:
            - material: CFWoodenPlanks
              amount: 1
              doAfter: 1.5
            - tool: CFHammering
              doAfter: 1
        - to: CFZLevelStairsStone
          steps:
            - material: CFStone
              amount: 2
              doAfter: 1.5
            - tool: CFHammering
              doAfter: 1
        - to: CFZLevelStairsRoofRed
          steps:
            - material: CFFloorTileRoofRed
              amount: 2
              doAfter: 1.5
            - tool: CFHammering
              doAfter: 1
        - to: CFZLevelStairsRoofGreen
          steps:
            - material: CFFloorTileRoofGreen
              amount: 2
              doAfter: 1.5
            - tool: CFHammering
              doAfter: 1
        - to: CFZLevelStairsRoofBlue
          steps:
            - material: CFFloorTileRoofBlue
              amount: 2
              doAfter: 1.5
            - tool: CFHammering
              doAfter: 1

    - node: CFZLevelStairsFrameCorner
