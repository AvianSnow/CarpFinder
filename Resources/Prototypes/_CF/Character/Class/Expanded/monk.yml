# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Monk
  name: cf-class-monk
  description: cf-class-description-monk
  hitPoints: 10
  keyAbility: Dexterity
  hitPointsAbility: Constitution
  classDC: cf-class-monk
  proficiencies:
    perception:
      trained:
        - Perception
    savingThrows:
      expert:
        - Fortitude
        - Reflex
        - Will
    attacks:
      trained:
        - SimpleWeapons
        - Unarmed
    defenses:
      expert:
        - Unarmored
  additionalSkillTrainings: 4
  features:
    - level: 1
      name: "Flurry of Blows"
      description: "Flurry of Blows is on your action wheel. Two unarmed Strikes for 1 action."
      grants:
        - !type:CFGrantOption
          option: Flurry
        - !type:CFGrantAction
          action: CFActFlurry
    - level: 1
      name: "Powerful Fist"
      description: "Your fist Strike deals 1d6 bludgeoning."
      grants:
        - !type:CFGrantOption
          option: PowerfulFist
    - level: 3
      name: "Incredible Movement"
      description: "+10 feet status bonus to Speed while you wear no armor."
      grants:
        - !type:CFGrantWhile
          while: Unarmored
          stat: Speed
          type: Status
          value: 10
    - level: 3
      name: "Mystic Strikes"
      description: "Your unarmed attacks count as magical. Nothing resists non-magical attacks yet: TBA"
    - level: 5
      name: "Expert Strikes"
      description: "Expert with unarmed attacks and simple weapons. Critical specialization: TBA"
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Unarmed
            - SimpleWeapons
          rank: Expert
    - level: 5
      name: "Perception Expertise"
      description: "Expert in Perception."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Perception
          rank: Expert
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
