- type: entity
  parent: CFSpellArea
  id: CFFloatingFlame
  name: Floating Flame
  description: A flame in one 5-foot square within 30 feet. Reflex save, 3d6 fire. It burns again every 6 seconds for a minute, and only Dispel Magic ends it sooner. Cast it again while it burns to move it to a new spot, at no slot.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: fireball
  - type: CFRadialSlot
    group: Spell
    spellRank: 2
  - type: CFSpell
    spell: FloatingFlame
    rank: 2
    sustained: true
    movesWhenRecast: true
  - type: CFTargeting
    rangeFeet: 30
  - type: CFAreaFill
    tile: CFFillFlame
    spreadSeconds: 0.1
  - type: CFAreaEffect
    # One 5-foot square, which is one tile. Not a 5-foot burst, which would be four.
    shape: Square
    sizeFeet: 5
  - type: CFCheck
    defense: Reflex
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 3
      die: 6
      damageType: Fire
      heightenDice: 1
  - type: CFHeighten
    baseRank: 2
