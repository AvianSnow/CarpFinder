- type: entity
  parent: CFSpellTarget
  id: CFSleep
  name: Sleep
  description: On a failed Will save the target falls unconscious.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 1
  - type: CFSpell
    spell: Sleep
    rank: 1
  - type: CFTargeting
    rangeFeet: 30
  - type: CFCheck
    defense: Will
    basicSave: false
  - type: CFDegreeEffects
    failure:
    - !type:CFApplyConditionEffect
      condition: Asleep
      durationSeconds: 6
    criticalFailure:
    - !type:CFApplyConditionEffect
      condition: Asleep
      durationSeconds: 18
