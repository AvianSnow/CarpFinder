# Ported from CP14 by the CF converter.

- type: entity
  id: CFWallmountFlagBase
  abstract: true
  parent:
  - CFBaseWallmount
  - CFBaseFlammableSpreadingStrong
  categories: [ ForkFiltered ]
  name: tapestry
  description: A piece of cloth pinned to the wall.
  components:
  - type: Sprite
    sprite: _CP14/Structures/Decoration/flags_wallmount.rsi
  - type: Damageable
    damageModifierSet: CFWood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          CFCloth1:
            min: 1
            max: 2

# Mercenary

- type: entity
  parent: CFWallmountFlagBase
  id: CFWallmountFlagAlchemist
  name: alchemist tapestry
  description: A tapestry with a potion symbol indicating that alchemists dwell here.
  components:
  - type: Sprite
    layers:
    - state: fill_mercenary
    - state: icon_potion

- type: entity
