# Runesmith actions. CFRuneSystem runs them.

- type: entity
  parent: CFActivityTarget
  id: CFActInvokeRune
  name: Invoke Rune
  description: Invokes up to two of your runes on a creature within 30 feet, or on what it holds. They fade afterwards.
  components:
  - type: TargetAction
    range: 6.5
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFInvokeRuneAction

- type: entity
  parent: CFActivityTarget
  id: CFActTraceAtryl
  name: "Trace Atryl"
  description: "1 action next to the target, 2 from up to 30 feet away. It lasts 12 seconds. Reducing fire resistance: TBA. Invoke: 1d8 fire, basic Fortitude."
  components:
  - type: TargetAction
    range: 6.5
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFTraceRuneAction
    rune: Atryl
  - type: CFCheck
    defense: Fortitude
    dcSource: Class
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 8
      damageType: Fire
      diceEveryLevels: 2

- type: entity
  parent: CFActivityTarget
  id: CFActTraceBaruiel
  name: "Trace Baruiel"
  description: "1 action next to the target, 2 from up to 30 feet away. It lasts 12 seconds. Easing frightened: TBA. Invoke: allies within 10 feet of the bearer lower their frightened by 2."
  components:
  - type: TargetAction
    range: 6.5
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFTraceRuneAction
    rune: Baruiel
  - type: CFAreaEffect
    shape: Emanation
    sizeFeet: 10
    filter: Allies
    includeSelf: true
  - type: CFDegreeEffects
    effects:
    - !type:CFReduceFrightenedEffect
      by: 2

- type: entity
  parent: CFActivityTarget
  id: CFActTraceCamonica
  name: "Trace Camonica"
  description: "1 action next to the target, 2 from up to 30 feet away. It lasts 12 seconds. Damage when the bearer concentrates: TBA. Invoke: 1d4 mental, basic Will, and stupefied on a failure."
  components:
  - type: TargetAction
    range: 6.5
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFTraceRuneAction
    rune: Camonica
  - type: CFCheck
    defense: Will
    dcSource: Class
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 4
      damageType: Mental
      diceEveryLevels: 2
    failure:
    - !type:CFApplyConditionEffect
      condition: Stupefied
      value: 1
      durationSeconds: 6
    criticalFailure:
    - !type:CFApplyConditionEffect
      condition: Stupefied
      value: 2
      durationSeconds: 6

- type: entity
  parent: CFActivityTarget
  id: CFActTraceEsvadir
  name: "Trace Esvadir"
  description: "1 action next to the target, 2 from up to 30 feet away. It lasts 12 seconds. A piercing or slashing weapon. 2 persistent bleed per die. Invoke: 1d8 slashing to a creature next to the bearer, basic Reflex."
  components:
  - type: TargetAction
    range: 6.5
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFTraceRuneAction
    rune: Esvadir
  - type: CFCheck
    defense: Reflex
    dcSource: Class
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 8
      damageType: Slashing
      diceEveryLevels: 2

- type: entity
  parent: CFActivityTarget
  id: CFActTraceHoltrik
  name: "Trace Holtrik"
  description: "1 action next to the target, 2 from up to 30 feet away. It lasts 12 seconds. The bonus while the shield is raised: TBA. Invoke: the bearer raises its shield, and has +1 status to AC for 6 seconds."
  components:
  - type: TargetAction
    range: 6.5
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFTraceRuneAction
    rune: Holtrik
  - type: CFDegreeEffects
    landed:
    - !type:CFRaiseShieldEffect
    - !type:CFBonusEffect
      stat: ArmorClass
      type: Status
      value: 1
      durationSeconds: 6

- type: entity
  parent: CFActivityTarget
  id: CFActTraceLedria
  name: "Trace Ledria"
  description: "1 action next to the target, 2 from up to 30 feet away. It lasts 12 seconds. +1 status to Deception, Diplomacy and Performance. Invoke: allies within 30 feet of the bearer get +10 feet Speed for 3 seconds, standing in for a Step closer."
  components:
  - type: TargetAction
    range: 6.5
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFTraceRuneAction
    rune: Ledria
  - type: CFAreaEffect
    shape: Emanation
    sizeFeet: 30
    filter: Allies
    includeSelf: true
  - type: CFDegreeEffects
    effects:
    - !type:CFBonusEffect
      stat: Speed
      type: Status
      value: 10
      durationSeconds: 3

- type: entity
  parent: CFActivityTarget
  id: CFActTraceLyskel
  name: "Trace Lyskel"
  description: "1 action next to the target, 2 from up to 30 feet away. It lasts 12 seconds. -5 feet Speed. Clumsy from moving: TBA. Invoke: 1d4 cold, basic Fortitude, and snow around the bearer for 6 seconds."
  components:
  - type: TargetAction
    range: 6.5
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFTraceRuneAction
    rune: Lyskel
  - type: CFCheck
    defense: Fortitude
    dcSource: Class
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 4
      damageType: Cold
      diceEveryLevels: 2
    - !type:CFFillEffect
      shape: Emanation
      sizeFeet: 5
      tile: CFFillSnowdrift

- type: entity
  parent: CFActivityTarget
  id: CFActTraceMarssyl
  name: "Trace Marssyl"
  description: "1 action next to the target, 2 from up to 30 feet away. It lasts 12 seconds. A bludgeoning weapon. 1 bludgeoning splash per die. Invoke: the next Strike to hit deals another die. The push: TBA."
  components:
  - type: TargetAction
    range: 6.5
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFTraceRuneAction
    rune: Marssyl
  - type: CFDegreeEffects
    landed:
    - !type:CFRuneNextStrikeEffect

- type: entity
  parent: CFActivityTarget
  id: CFActTraceOljinex
  name: "Trace Oljinex"
  description: "1 action next to the target, 2 from up to 30 feet away. It lasts 12 seconds. Hardness against ranged attacks: TBA. Invoke: TBA."
  components:
  - type: TargetAction
    range: 6.5
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFTraceRuneAction
    rune: Oljinex

- type: entity
  parent: CFActivityTarget
  id: CFActTracePluuna
  name: "Trace Pluuna"
  description: "1 action next to the target, 2 from up to 30 feet away. It lasts 12 seconds. Its light: TBA. Invoke: enemies within 20 feet of the bearer roll Fortitude against your class DC or are dazzled for 6 seconds."
  components:
  - type: TargetAction
    range: 6.5
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFTraceRuneAction
    rune: Pluuna
  - type: CFAreaEffect
    shape: Emanation
    sizeFeet: 20
    filter: Enemies
  - type: CFCheck
    defense: Fortitude
    dcSource: Class
  - type: CFDegreeEffects
    failure:
    - !type:CFApplyConditionEffect
      condition: Dazzled
      value: 1
      durationSeconds: 6
    criticalFailure:
    - !type:CFApplyConditionEffect
      condition: Dazzled
      value: 1
      durationSeconds: 6

- type: entity
  parent: CFActivityTarget
  id: CFActTraceRanshu
  name: "Trace Ranshu"
  description: "1 action next to the target, 2 from up to 30 feet away. It lasts 12 seconds. Damage for standing still: TBA. Invoke: 1d8 electricity, basic Fortitude."
  components:
  - type: TargetAction
    range: 6.5
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFTraceRuneAction
    rune: Ranshu
  - type: CFCheck
    defense: Fortitude
    dcSource: Class
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 8
      damageType: Electricity
      diceEveryLevels: 2

- type: entity
  parent: CFActivityTarget
  id: CFActTraceRehgog
  name: "Trace Rehgog"
  description: "1 action next to the target, 2 from up to 30 feet away. It lasts 12 seconds. Scent: TBA. Invoke: +10 feet Speed for 3 seconds, and the next unarmed Strike to hit deals another die."
  components:
  - type: TargetAction
    range: 6.5
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFTraceRuneAction
    rune: Rehgog
  - type: CFDegreeEffects
    landed:
    - !type:CFBonusEffect
      stat: Speed
      type: Status
      value: 10
      durationSeconds: 3
    - !type:CFRuneNextStrikeEffect
      unarmedOnly: true

- type: entity
  parent: CFActivityTarget
  id: CFActTraceSertum
  name: "Trace Sertum"
  description: "1 action next to the target, 2 from up to 30 feet away. It lasts 12 seconds. +1 status to Survival. Invoke: +10 feet Speed for 3 seconds, standing in for three Steps."
  components:
  - type: TargetAction
    range: 6.5
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFTraceRuneAction
    rune: Sertum
  - type: CFDegreeEffects
    landed:
    - !type:CFBonusEffect
      stat: Speed
      type: Status
      value: 10
      durationSeconds: 3

- type: entity
  parent: CFActivityTarget
  id: CFActTraceThullax
  name: "Trace Thullax"
  description: "1 action next to the target, 2 from up to 30 feet away. It lasts 12 seconds. Reducing physical resistance: TBA. Invoke: 1d6 acid, basic Fortitude, and 1 persistent acid on a critical failure."
  components:
  - type: TargetAction
    range: 6.5
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFTraceRuneAction
    rune: Thullax
  - type: CFCheck
    defense: Fortitude
    dcSource: Class
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 6
      damageType: Acid
      diceEveryLevels: 2
    criticalFailure:
    - !type:CFDamageEffect
      damageType: Acid
      persistentFlat: 1
      scaleByDegree: false

- type: entity
  parent: CFActivityTarget
  id: CFActTraceTilus
  name: "Trace Tilus"
  description: "1 action next to the target, 2 from up to 30 feet away. It lasts 12 seconds. +1 status to Society. Sharing a language: TBA. Invoke: TBA."
  components:
  - type: TargetAction
    range: 6.5
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFTraceRuneAction
    rune: Tilus

- type: entity
  parent: CFActivityTarget
  id: CFActTraceZohk
  name: "Trace Zohk"
  description: "1 action next to the target, 2 from up to 30 feet away. It lasts 12 seconds. Its Speed bonus: TBA. Invoke: the bearer is called to your side. An enemy rolls Will against your class DC first."
  components:
  - type: TargetAction
    range: 6.5
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFTraceRuneAction
    rune: Zohk
  - type: CFCheck
    defense: Will
    dcSource: Class
  - type: CFDegreeEffects
    effects:
    - !type:CFTeleportToUserEffect

# Feats. Each that traces a rune asks which on the wheel, and a rune the Runesmith does not know does nothing.
- type: entity
  parent: CFActStrikeBase
  id: CFActEngravingStrike
  name: Engraving Strike
  description: A melee Strike. On a hit, the rune you chose is traced on the target. Costs 1 action. A flourish.
  components:
  - type: CFFlourish
  - type: CFModeChoice
    modes:
    - { value: 1, name: cf-rune-atryl }
    - { value: 2, name: cf-rune-baruiel }
    - { value: 3, name: cf-rune-camonica }
    - { value: 4, name: cf-rune-ledria }
    - { value: 5, name: cf-rune-lyskel }
    - { value: 6, name: cf-rune-pluuna }
    - { value: 7, name: cf-rune-ranshu }
    - { value: 8, name: cf-rune-rehgog }
    - { value: 9, name: cf-rune-sertum }
    - { value: 10, name: cf-rune-thullax }
    - { value: 11, name: cf-rune-tilus }
    - { value: 12, name: cf-rune-zohk }
  - type: CFStrikeAction
    effectsNeedDamage: false
    onHit:
    - !type:CFTraceRuneEffect
      runes:
        - Atryl
        - Baruiel
        - Camonica
        - Ledria
        - Lyskel
        - Pluuna
        - Ranshu
        - Rehgog
        - Sertum
        - Thullax
        - Tilus
        - Zohk

- type: entity
  parent: CFActStrikeBase
  id: CFActPatternFlight
  name: Pattern Flight
  description: A ranged Strike. Hit or miss, the rune you chose is traced on the target. Costs 2 actions. A flourish.
  components:
  - type: CFRadialSlot
    actions: 2
  - type: CFFlourish
  - type: CFModeChoice
    modes:
    - { value: 1, name: cf-rune-atryl }
    - { value: 2, name: cf-rune-baruiel }
    - { value: 3, name: cf-rune-camonica }
    - { value: 4, name: cf-rune-ledria }
    - { value: 5, name: cf-rune-lyskel }
    - { value: 6, name: cf-rune-pluuna }
    - { value: 7, name: cf-rune-ranshu }
    - { value: 8, name: cf-rune-rehgog }
    - { value: 9, name: cf-rune-sertum }
    - { value: 10, name: cf-rune-thullax }
    - { value: 11, name: cf-rune-tilus }
    - { value: 12, name: cf-rune-zohk }
  - type: CFStrikeAction
    ranged: true
    effectsNeedDamage: false
    onHit:
    - !type:CFTraceRuneEffect
      runes:
        - Atryl
        - Baruiel
        - Camonica
        - Ledria
        - Lyskel
        - Pluuna
        - Ranshu
        - Rehgog
        - Sertum
        - Thullax
        - Tilus
        - Zohk
    onFailure:
    - !type:CFTraceRuneEffect
      runes:
        - Atryl
        - Baruiel
        - Camonica
        - Ledria
        - Lyskel
        - Pluuna
        - Ranshu
        - Rehgog
        - Sertum
        - Thullax
        - Tilus
        - Zohk

- type: entity
  parent: CFActStrikeBase
  id: CFActRemoteDetonation
  name: Remote Detonation
  description: A ranged Strike. On a hit, up to two of your runes on the target are invoked. Costs 1 action. A flourish.
  components:
  - type: CFFlourish
  - type: CFStrikeAction
    ranged: true
    effectsNeedDamage: false
    onHit:
    - !type:CFInvokeRunesEffect

- type: entity
  parent: CFActivityInstant
  id: CFActFortifyingKnock
  name: Fortifying Knock
  description: Raise your shield and trace the rune you chose on it. Costs 1 action. A flourish.
  components:
  - type: CFFlourish
  - type: CFModeChoice
    modes:
    - { value: 1, name: cf-rune-holtrik }
    - { value: 2, name: cf-rune-oljinex }
  - type: CFEffectAction
    raisesShield: true
  - type: CFDegreeEffects
    effects:
    - !type:CFTraceRuneEffect
      onShield: true
      runes:
        - Holtrik
        - Oljinex

- type: entity
  parent: CFActivityTarget
  id: CFActTerrifyingInvocation
  name: Terrifying Invocation
  description: Demoralize a creature within 30 feet and invoke your runes on it, together. Costs 1 action.
  components:
  - type: TargetAction
    range: 6.5
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFDemoralizeEffect
    - !type:CFInvokeRunesEffect

- type: entity
  parent: CFActivityTarget
  id: CFActTransposeEtching
  name: Transpose Etching
  description: Your newest rune within 30 feet moves onto the creature or item you choose, within 30 feet. Costs 1 action.
  components:
  - type: TargetAction
    range: 6.5
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFTransposeRuneEffect
      feet: 30

- type: entity
  parent: CFActivityTarget
  id: CFActArtistsAttendance
  name: "Artist's Attendance"
  description: Rush up to 50 feet to a creature and trace the rune you chose on it. Costs 2 actions. A flourish.
  components:
  - type: CFRadialSlot
    actions: 2
  - type: TargetAction
    range: 10.25
  - type: EntityTargetAction
    canTargetSelf: false
  - type: CFFlourish
  - type: CFModeChoice
    modes:
    - { value: 1, name: cf-rune-atryl }
    - { value: 2, name: cf-rune-baruiel }
    - { value: 3, name: cf-rune-camonica }
    - { value: 4, name: cf-rune-ledria }
    - { value: 5, name: cf-rune-lyskel }
    - { value: 6, name: cf-rune-pluuna }
    - { value: 7, name: cf-rune-ranshu }
    - { value: 8, name: cf-rune-rehgog }
    - { value: 9, name: cf-rune-sertum }
    - { value: 10, name: cf-rune-thullax }
    - { value: 11, name: cf-rune-tilus }
    - { value: 12, name: cf-rune-zohk }
  - type: CFEffectAction
    closesFeet: 50
  - type: CFDegreeEffects
    effects:
    - !type:CFTraceRuneEffect
      runes:
        - Atryl
        - Baruiel
        - Camonica
        - Ledria
        - Lyskel
        - Pluuna
        - Ranshu
        - Rehgog
        - Sertum
        - Thullax
        - Tilus
        - Zohk

- type: entity
  parent: CFActivityInstant
  id: CFActSongOfGloriousInvocation
  name: Song of Glorious Invocation
  description: One of your runes is invoked on each of up to three bearers within 30 feet, and each takes heart for a minute. Costs 1 action, once per 10 minutes.
  components:
  - type: Action
    useDelay: 600
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFInvokeAllEffect
      feet: 30
      bearers: 3
