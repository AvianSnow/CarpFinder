# Ported from CP14 by the CF converter.

- type: constructionGraph
  id: CFSeat
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: CFChairWooden
          steps:
            - material: CFWoodenPlanks
              amount: 2
              doAfter: 2
        - to: CFChairWoodenBirch
          steps:
          - material: CFBirchWoodenPlanks
            amount: 2
            doAfter: 2
    - node: CFChairWooden
      entity: CFChairWooden
      edges:
      - to: start
        steps:
        - tool: Prying
          doAfter: 2
        completed:
        - !type:SpawnPrototype
          prototype: CFWoodenPlanks1
          amount: 2
    - node: CFChairWoodenBirch
      entity: CFChairWoodenBirch
      edges:
      - to: start
        steps:
        - tool: Prying
          doAfter: 2
        completed:
        - !type:SpawnPrototype
          prototype: CFBirchWoodenPlanks1
          amount: 2

