# Whole vegetables. Slices and cooked versions come with cooking. If the Consumables port lands with these ids, delete this file.

- type: entity
  id: CFFoodCabbage
  parent: FoodInjectableBase
  categories: [ ForkFiltered ]
  name: cabbage
  description: Green edible ball.
  components:
  - type: CFItemPrice
    copper: 3
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _CP14/Objects/Flora/Farm/cabbage.rsi
    layers:
      - state: base1
        map: [ "random" ]
  - type: RandomSprite
    available:
      - random:
          base1: ""
          base2: ""
          base3: ""
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 3
      - ReagentId: Vitamin
        Quantity: 0.5

