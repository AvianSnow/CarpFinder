- type: entity
  parent: CFSpellInstant
  id: CFWarpStep
  name: Warp Step
  description: +5 feet status bonus to your Speed for 6 seconds. Amped, +10 feet.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 1
  - type: CFSpell
    spell: WarpStep
    rank: 0
  # The Unbound Step's amp. Status bonuses do not stack, so the larger one takes over.
  - type: CFPsiCantrip
    ampEffects:
    - !type:CFBonusEffect
      stat: Speed
      type: Status
      value: 10
      durationSeconds: 6
  - type: CFTargeting
    filter: All
  - type: CFDegreeEffects
    landed:
    - !type:CFBonusEffect
      stat: Speed
      type: Status
      value: 5
      durationSeconds: 6
