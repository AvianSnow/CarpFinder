- type: entity
  parent: CFSpellObject
  id: CFPrestidigitation
  name: Prestidigitation
  description: A minor trick. Food cooks and flavours a bite, Lift draws an object, Make conjures a trinket, and Tidy clears a puddle.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: Prestidigitation
    rank: 0
  - type: CFTargeting
    rangeFeet: 10
    filter: All
  - type: CFPrestidigitation
  - type: CFModeChoice
    modes:
    - value: 1
      name: cf-spell-trick-food
      tooltip: cf-spell-trick-food-tip
      objectWhitelist:
        components:
        - Edible
    - value: 2
      name: cf-spell-trick-lift
      tooltip: cf-spell-trick-lift-tip
      objectWhitelist:
        components:
        - Item
      objectBlacklist:
        components:
        - MobState
        - Stack
    - value: 3
      name: cf-spell-trick-make
      tooltip: cf-spell-trick-make-tip
      immediate: true
    - value: 4
      name: cf-spell-trick-tidy
      tooltip: cf-spell-trick-tidy-tip
      objectWhitelist:
        components:
        - Puddle
