# Ported from CP14 by the CF converter.

- type: entity
  id: CFOrderBoard
  parent:
  - BaseStructure
  - CFBaseFlammableSpreading
  name: orders board
  description: Is there a job for a witcher?
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    snapCardinals: true
    drawdepth: Mobs
    sprite: _CP14/Structures/Furniture/order_board.rsi
    layers:
      - state: base
      - state: paper-0
      - map: ["enum.StorageFillLayers.Fill"]
  - type: StorageFillVisualizer
    maxFillLevels: 4
    fillBaseName: paper
  - type: Appearance
  - type: InteractionOutline
  - type: Clickable
  - type: Damageable
    damageModifierSet: CFWood
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          CFWoodenPlanks1:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Storage
    grid:
    - 0,0,4,3
    maxItemSize: Small
    whitelist:
      tags:
        - Document
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Construction
    graph: CFOrderBoard
    node: CFOrderBoard

- type: entity
  parent: CFOrderBoard
  id: CFOrderBoardBlue
  suffix: Blue flag
  components:
  - type: Sprite
    layers:
      - state: base
      - state: paper-0
      - map: ["enum.StorageFillLayers.Fill"]
      - state: flag_blue

