# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Champion
  name: cf-class-champion
  description: cf-class-description-champion
  hitPoints: 10
  keyAbility: Dexterity
  hitPointsAbility: Constitution
  usesDeity: true
  classDC: cf-class-champion
  proficiencies:
    perception:
      trained:
        - Perception
    savingThrows:
      trained:
        - Reflex
      expert:
        - Fortitude
        - Will
    skills:
      trained:
        - Religion
    attacks:
      trained:
        - MartialWeapons
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - MediumArmor
        - HeavyArmor
        - LightArmor
  additionalSkillTrainings: 2
  features:
    - level: 1
      name: "Champion's Aura"
      description: "You are surrounded by a 15-foot emanation. It does nothing by itself, but your feats and devotion spells work through it."
      grants:
        - !type:CFGrantAura {}
    - level: 1
      name: "Cause"
      description: "Choose a cause in the builder. For now every cause has the same reaction: when an ally near you is hit, you can Strike the attacker if it is in your reach. Each cause's own reaction: TBA"
      grants:
        - !type:CFGrantOption
          option: Champion
    - level: 1
      name: "Deity (Champion)"
      description: "Deities are our own pantheon, and none exist yet: TBA"
    - level: 1
      name: "Devotion Spells"
      description: "Choose Lay on Hands, Touch of the Void or Shields of the Spirit in the builder. It costs a Focus Point."
    - level: 1
      name: "Shield Block"
      description: "While your shield is raised, you can spend your reaction to block 5 damage."
      grants:
        - !type:CFGrantOption
          option: ShieldBlock
    - level: 3
      name: "Blessing of the Devoted"
      description: "A boon from your deity, such as a blessed weapon or shield: TBA"
    - level: 5
      name: "Weapon Expertise"
      description: "Expert with simple weapons, martial weapons and unarmed attacks."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - SimpleWeapons
            - MartialWeapons
            - Unarmed
          rank: Expert
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
