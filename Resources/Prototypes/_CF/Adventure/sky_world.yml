# CF takes place in the sky: floating islands and airships, not space.
# Every generated map gets these, through CFOutdoorsSystem.ApplySkyWorld.

- type: entity
  id: CFSkyWorld
  name: sky world
  description: The air and sky of every generated map.
  categories: [ HideSpawnMenu ]
  components:
  - type: MapAtmosphere
    space: False
    mixture:
      temperature: 288.15
      volume: 2500
      moles:
        Oxygen: 21.824879
        Nitrogen: 82.10312
      immutable: True
  - type: Parallax
    parallax: Sky
