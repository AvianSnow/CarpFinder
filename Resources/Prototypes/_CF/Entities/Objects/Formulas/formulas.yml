- type: entity
  abstract: true
  parent: BaseItem
  id: CFBaseFormula
  name: formula
  description: A schematic on rolled-up parchment. Read it in hand to learn it.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    state: paper_words
  - type: CFBulk
    bulk: 0.1
  - type: CFItemPrice
    copper: 50 # level 0 formula: 5 sp

- type: entity
  parent: BaseItem
  id: CFBasicCraftersBook
  name: basic crafter's book
  description: Formulas for all the common level 0 items. Read it in hand to learn them.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Objects/Misc/books.rsi
    state: book_icon
  - type: CFFormula
    allBasic: true
  - type: CFItem
    level: 0
  - type: CFBulk
    bulk: 0.1
  - type: CFItemPrice
    copper: 10 # 1 sp

