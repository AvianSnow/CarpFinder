- type: constructionGraph
  id: CFWallmountTorch
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: CFWallmountTorch
          steps:
            - material: CFWoodenPlanks
              amount: 1
              doAfter: 1
            - material: CFCloth
              amount: 1
              doAfter: 1

    - node: CFWallmountTorch
      entity: CFWallmountTorch

