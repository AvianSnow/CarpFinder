# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Rogue
  name: cf-class-rogue
  description: cf-class-description-rogue
  hitPoints: 8
  keyAbility: Dexterity
  hitPointsAbility: Constitution
  classDC: cf-class-rogue
  proficiencies:
    perception:
      expert:
        - Perception
    savingThrows:
      trained:
        - Fortitude
      expert:
        - Reflex
        - Will
    skills:
      trained:
        - Stealth
    attacks:
      trained:
        - MartialWeapons
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - LightArmor
  additionalSkillTrainings: 7
  features:
    - level: 1
      name: "Rogue's Racket"
      description: "Choose how you make your living with the Rogue's Racket button."
    - level: 1
      name: "Sneak Attack"
      description: "Agile or finesse attacks and ranged weapons deal extra precision damage to off-guard creatures. A thrown weapon must be agile or finesse."
      grants:
        - !type:CFGrantOption
          option: SneakAttack
    - level: 1
      name: "Surprise Attack"
      description: "Being off-guard to you before a creature has acted: TBA"
    - level: 3
      name: "Deny Advantage"
      description: "You are not off-guard to flanking creatures of your level or lower. The same for hidden creatures: TBA"
      grants:
        - !type:CFGrantOption
          option: DenyAdvantage
    - level: 5
      name: "Weapon Tricks"
      description: "Expert with simple weapons, martial weapons and unarmed attacks. Critical specialization against off-guard targets: TBA"
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - SimpleWeapons
            - MartialWeapons
            - Unarmed
          rank: Expert
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
