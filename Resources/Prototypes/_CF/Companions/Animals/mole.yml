# Young Mole. Ancestry Hit Points 8. At 1st level that is 16 Hit Points.
- type: cfPet
  id: CFPetMole
  name: Mole
  kind: Companion
  entity: CFCompanionMole
  size: "Small"
  strength: 3
  dexterity: 2
  constitution: 2
  intelligence: -4
  wisdom: 1
  charisma: 0
  hitPoints: 8
  description: "A young mole companion."
  speeds:
    - name: Speed
      feet: 25
    - name: burrow
      feet: 20
  senses:
    - "low-light vision"
    - "scent (imprecise, 30 feet)"
  attacks:
    - name: "Jaws"
      die: 8
      damage: piercing
    - name: "Claw"
      die: 6
      damage: slashing
      agile: true
  skills:
    - name: Stealth
      ability: Dexterity
  support: "Until the end of your next turn, a creature adjacent to it that you damage is clumsy 1 until it leaves that square."
  advanced: "Burrowing Ambush"

- type: entity
  parent: [ SimpleMobBase, CFCompanionBase ]
  id: CFCompanionMole
  name: mole companion
  description: "A young mole companion."
  suffix: Companion
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: companion
      sprite: _CF/Mobs/companion-default.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: companion
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: HTN
    rootTask:
      task: CFGOAPCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 15
    maxHp: 16
    currentHp: 16
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 3
      Dexterity: 2
      Constitution: 2
      Intelligence: -4
      Wisdom: 1
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 8
    naturalType: piercing
    naturalFinesse: false
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      16: Dead
