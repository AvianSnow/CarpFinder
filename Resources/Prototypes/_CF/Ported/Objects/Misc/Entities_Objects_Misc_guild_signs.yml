# Ported from CP14 by the CF converter.

- type: entity
  id: CFGuildSignRed
  name: red guild sign
  description: A small sign to indicate a desk related to red quests.
  parent: 
  - BaseItem
  - CFBaseFlammable
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    noRot: true
    sprite: _CP14/Objects/Misc/guild_signs.rsi
    state: red
  - type: Item
    size: Small
  - type: Damageable
    damageModifierSet: CFWood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 6
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          CFAsh1:
            min: 1
            max: 2
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          CFWoodenPlanks1:
            min: 1
            max: 1
  - type: PhysicalComposition
    materialComposition:
      CFWoodenPlanks: 20

