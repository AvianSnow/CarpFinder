- type: entity
  parent: CFSpellTarget
  id: CFForbiddingWard
  name: Forbidding Ward
  description: An ally gains a +1 status bonus to AC.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: shield
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: ForbiddingWard
    rank: 0
  - type: CFTargeting
    rangeFeet: 30
    filter: All
  - type: CFDegreeEffects
    landed:
    - !type:CFBonusEffect
      stat: ArmorClass
      type: Status
      value: 1
  - type: EntityTargetAction
    canTargetSelf: true
