# Ported from CP14 by the CF converter.

- type: entity
  parent: BaseStructure
  id: CFBaseFenceBig
  abstract: true
  categories: [ ForkFiltered ]
  name: big fence
  description: You definitely need a towel to get to the other side
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    drawdepth: Mobs
  - type: Icon
    state: full
  - type: PlacementReplacement
    key: walls
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/Weapons/boxingpunch1.ogg"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        density: 1000
        mask:
        - Impassable
        layer:
        - LowImpassable
        - MidImpassable
        - HighImpassable
        - InteractImpassable
  - type: IconSmooth
    key: CFfencebig
    states:
    - !type:CornerSpriteSmoothing
      mask: [ CFfencebig, CFwall ]
      base: fence

- type: entity
  parent:
  - CFBaseFenceBig
  - CFBaseFlammableSpreading
  id: CFFenceBigWooden
  suffix: Wooden
  components:
  - type: Sprite
    sprite: _CP14/Structures/Fence/wooden_big.rsi
  - type: Icon
    sprite: _CP14/Structures/Fence/wooden_big.rsi
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          CFWoodenPlanks1:
            min: 2
            max: 4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: CFFenceBigWooden
    node: CFFenceBigWooden

- type: entity
  parent: CFFenceBigWooden
  id: CFFenceBigWoodenBirch
  suffix: Wooden Birch
  components:
  - type: Sprite
    sprite: _CP14/Structures/Fence/wooden_birch_big.rsi
  - type: Icon
    sprite: _CP14/Structures/Fence/wooden_birch_big.rsi
  - type: Construction
    graph: CFFenceBigWoodenBirch
    node: CFFenceBigWoodenBirch

- type: entity
  parent: CFBaseFenceBig
  id: CFFenceBigIron
  suffix: Iron
  components:
  - type: Sprite
    sprite: _CP14/Structures/Fence/iron_big.rsi
  - type: Icon
    sprite: _CP14/Structures/Fence/iron_big.rsi
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          CFScrapIron:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
