# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Runesmith
  name: cf-class-runesmith
  description: cf-class-description-runesmith
  hitPoints: 8
  keyAbility: Intelligence
  hitPointsAbility: Constitution
  classDC: cf-class-runesmith
  proficiencies:
    perception:
      trained:
        - Perception
    savingThrows:
      trained:
        - Reflex
      expert:
        - Fortitude
        - Will
    skills:
      trained:
        - Crafting
    attacks:
      trained:
        - MartialWeapons
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - MediumArmor
        - LightArmor
  additionalSkillTrainings: 2
  features:
    - level: 1
      name: "Runes"
      description: "Trace and invoke magical runes. Runes are not built yet: TBA"
    - level: 1
      name: "Runic Repertoire"
      description: "The runes you know. Runes are not built yet: TBA"
    - level: 1
      name: "Shield Block"
      description: "You can spend your reaction to block damage with a raised shield."
      grants:
        - !type:CFGrantOption
          option: ShieldBlock
    - level: 2
      name: "Runic Crafter"
      description: "Magical Crafting and rune formulas: TBA"
    - level: 5
      name: "Weapon Expertise"
      description: "Expert with simple weapons, martial weapons and unarmed attacks."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - SimpleWeapons
            - MartialWeapons
            - Unarmed
          rank: Expert
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
