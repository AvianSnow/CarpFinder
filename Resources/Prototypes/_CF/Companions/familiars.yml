# Familiar bodies, one per cfPet familiar in pets.yml. A familiar follows its master and never fights
# (CFCompanion.peaceful): it picks no enemy and ignores an order to attack. It uses its master's AC and saves and has
# 5 Hit Points, which CFCharacterSpawnSystem sets from the cfPet as it spawns. Its daily abilities are not built.
# List the stock body first, so its sprite and movement win, and CFFamiliarBody second.

- type: entity
  abstract: true
  parent: CFCompanionBase
  id: CFFamiliarBody
  categories: [ HideSpawnMenu ]
  components:
  - type: CFCompanion
    peaceful: true

- type: entity
  parent: [ MobBat, CFFamiliarBody ]
  id: CFFamiliarBodyBat
  name: bat familiar
  description: A bat familiar. It keeps close to its master and does not fight.
  suffix: Familiar
  components:
  - type: HTN
    rootTask:
      task: CFGOAPCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 15
    maxHp: 5
    currentHp: 5
  - type: MobThresholds
    thresholds:
      0: Alive
      5: Dead

