# Attaching runes at a workbench. The weapon or armor stays, and only the rune is used up.

- type: craftingRecipe
  id: AttachWeaponPotency1
  tag: CFRecipeWorkbench
  craftTime: 4
  attachRune: true
  requirements:
  - !type:CFItemRequirement
    protoId: CFRuneItemWeaponPotency1
  - !type:CFRuneTargetRequirement
    rune: CFRuneItemWeaponPotency1
    count: 0
  result: CFRuneItemWeaponPotency1

