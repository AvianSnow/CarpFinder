# Bases for CF weapons. Numbers are the printed Player Core rows, held as a table in CFGearPortTest.

- type: entity
  abstract: true
  parent: BaseItem
  id: CFBaseWeapon
  categories: [ ForkFiltered ]
  components:
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    damage:
      types:
        Blunt: 0
  - type: CFMeleeWeapon
  - type: DisarmMalus
  - type: CFItem
    level: 0

- type: entity
  abstract: true
  id: CFBaseWeaponCarryBelt
  components:
  - type: Clothing
    quickEquip: false
    slots:
    - belt

- type: entity
  abstract: true
  id: CFBaseWeaponCarryNeck
  components:
  - type: Clothing
    quickEquip: false
    slots:
    - neck

- type: entity
  abstract: true
  parent: CFBaseWeapon
  id: CFBaseShield
  description: Use it in hand to raise it.
  components:
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      collection: MetalThud
  - type: CFWeapon
    damageDie: 4
    damageType: Bludgeoning
    category: Martial
    group: Shield

- type: entity
