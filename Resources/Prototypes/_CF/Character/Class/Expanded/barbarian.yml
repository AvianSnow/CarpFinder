# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Barbarian
  name: cf-class-barbarian
  description: cf-class-description-barbarian
  hitPoints: 12
  keyAbility: Strength
  hitPointsAbility: Constitution
  classDC: cf-class-barbarian
  proficiencies:
    perception:
      expert:
        - Perception
    savingThrows:
      trained:
        - Reflex
      expert:
        - Fortitude
        - Will
    skills:
      trained:
        - Athletics
    attacks:
      trained:
        - MartialWeapons
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - MediumArmor
        - LightArmor
  additionalSkillTrainings: 3
  features:
    - level: 1
      name: "Instinct"
      description: "Choose an instinct in the builder. It changes what your Rage does."
    - level: 1
      name: "Quick-Tempered"
      description: "Rage as a free action when a fight begins. Real time has no initiative to set it off: TBA"
    - level: 1
      name: "Rage"
      description: "Rage is on your action wheel. While raging, melee Strikes deal +2 damage, or +1 with an agile attack, and your AC takes -1. The temporary Hit Points and the time limit: TBA"
      grants:
        - !type:CFGrantOption
          option: CanRage
        - !type:CFGrantAction
          action: CFActRage
    - level: 3
      name: "Furious Footfalls"
      description: "+5 feet status bonus to Speed, or +10 feet while raging."
      grants:
        - !type:CFGrantBonus
          stat: Speed
          type: Status
          value: 5
        - !type:CFGrantWhile
          while: Raging
          stat: Speed
          type: Status
          value: 10
    - level: 5
      name: "Brutality"
      description: "Expert with simple weapons, martial weapons and unarmed attacks. Critical specialization while raging: TBA"
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - SimpleWeapons
            - MartialWeapons
            - Unarmed
          rank: Expert
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
