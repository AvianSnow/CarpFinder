# Weapon property runes (remaster). Each runs its effects on the target after a hit with the weapon,
# using the Strike's degree: damage in onHit doubles on a critical hit like any other weapon damage.
# A weapon holds as many property runes as its potency rune. Prices are in copper (1 gp = 100).

- type: cfPropertyRune
  id: Flaming
  name: Flaming
  level: 8
  price: 50000
  summary: "1d6 fire damage on a hit. On a critical hit, also 1d10 persistent fire damage."
  onHit:
  - !type:CFDamageEffect
    dice: 1
    die: 6
    damageType: Fire
  onCriticalHit:
  - !type:CFDamageEffect
    damageType: Fire
    scaleByDegree: false
    persistentDice: 1
    persistentDie: 10

