  range: 500 feet
  targets: 1 creature
  defense: Fortitude
  summary: "The target is pushed away, and knocked prone on a critical failure."

- type: cfSpell
  id: AgileFeet
  name: Agile Feet
  rank: 1
  traits: [Manipulate]
  actionCost: One
  range: self
  targets: self
