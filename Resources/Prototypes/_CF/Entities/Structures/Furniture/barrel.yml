- type: entity
  id: CFBarrelSolution
  abstract: true
  components:
    - type: InteractionOutline
    - type: Appearance
    - type: DrainableSolution
      solution: barrel
    - type: MixableSolution
      solution: barrel
    - type: RefillableSolution
      solution: barrel
    - type: DrawableSolution
      solution: barrel
    - type: Edible
      solution: barrel
      edible: Drink
      destroyOnEmpty: false

- type: entity
  id: CFBaseBarrel
  parent:
    - BaseStructureDynamic
    - CFBarrelSolution
    - CFBaseFlammable
  name: wooden barrel
  suffix: Empty
  description: The simplest design for storing liquids.
  categories: [ForkFiltered]
  placement:
    mode: PlaceFree
  components:
    - type: Openable
      sound:
        collection: bottleOpenSounds
      closeable: true
      closeSound:
        collection: bottleCloseSounds
    - type: GenericVisualizer
      visuals:
        enum.OpenableVisuals.Opened:
          enum.OpenableVisuals.Layer:
            True: { visible: false }
            False: { visible: true }
    - type: Sprite
      drawdepth: Mobs
      sprite: _CP14/Structures/Furniture/Barrels/barrel.rsi
      noRot: true
      layers:
        - state: barrel_open
        - state: liq1
          map: ["enum.SolutionContainerLayers.Fill"]
          visible: false
        - state: barrel
          map: ["enum.OpenableVisuals.Layer"]
    - type: Transform
      noRot: true
    - type: Physics
    - type: Construction
      graph: CFBaseBarrel
      node: CFBaseBarrel
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeAabb
            bounds: "-0.3,-0.3,0.3,0.3"
          density: 155
          mask:
            - MachineMask
          layer:
            - MachineLayer
    - type: Damageable
      damageModifierSet: CFWood
    - type: Injurable
      damageContainer: Inorganic
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 50
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]
        - trigger: !type:DamageTypeTrigger
            damageType: Heat
            damage: 5
          behaviors:
            - !type:SolutionExplosionBehavior
              solution: barrel
        - trigger: !type:DamageTypeTrigger
            damageType: Piercing
            damage: 5
          behaviors:
            - !type:SolutionExplosionBehavior
              solution: barrel
        - trigger: !type:DamageTrigger
            damage: 20
          behaviors:
            - !type:SpillBehavior
              solution: barrel
            - !type:PlaySoundBehavior
              sound:
                collection: WoodDestroy
            - !type:DoActsBehavior
              acts: ["Destruction"]
    - type: SolutionContainerManager
      solutions:
        barrel:
          maxVol: 300
    - type: SolutionContainerVisuals
      maxFillLevels: 5
      fillBaseName: liq
    - type: ExaminableSolution
      solution: barrel
    - type: PhysicalComposition
      materialComposition:
        CFWoodenPlanks: 30

- type: entity
  id: CFBarrelWater
  parent: CFBaseBarrel
  suffix: Water
  components:
    - type: SolutionContainerManager
      solutions:
        barrel:
          reagents:
            - ReagentId: Water
              Quantity: 300

