# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Sorcerer
  name: cf-class-sorcerer
  description: cf-class-description-sorcerer
  hitPoints: 6
  keyAbility: Charisma
  hitPointsAbility: Constitution
  classDC: cf-class-sorcerer
  proficiencies:
    perception:
      trained:
        - Perception
    savingThrows:
      trained:
        - Fortitude
        - Reflex
      expert:
        - Will
    attacks:
      trained:
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
  additionalSkillTrainings: 2
  spellcasting:
    tradition: Arcane
    ability: Charisma
    cantrips: 5
    slots:
      - 3
    laterSlots:
      - [ 4 ]
      - [ 4, 3 ]
      - [ 4, 4 ]
      - [ 4, 4, 3 ]
  features:
    - level: 1
      name: "Bloodline"
      description: "Choose a bloodline in the builder. It sets your tradition, trains two skills and teaches a cantrip and usually a rank 1 spell."
    - level: 1
      name: "Bloodline Spells"
      description: "Focus spells and blood magic from your bloodline: TBA"
    - level: 1
      name: "Sorcerer Spellcasting"
      description: "Level 1 cantrips and spell slots are on the spell sheet."
    - level: 1
      name: "Sorcerous Potency"
      description: "Spells cast from a slot add their rank to the damage or healing they deal."
      grants:
        - !type:CFGrantOption
          option: SorcerousPotency
    - level: 1
      name: "Spell Repertoire"
      description: "Level 1 cantrips and spell slots are on the spell sheet."
    - level: 3
      name: "Signature Spells"
      description: "Heighten chosen spells freely. Casting from a higher slot does not exist yet: TBA"
    - level: 5
      name: "Magical Fortitude"
      description: "Expert in Fortitude saves."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Fortitude
          rank: Expert
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
