# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Thaumaturge
  name: cf-class-thaumaturge
  description: cf-class-description-thaumaturge
  hitPoints: 8
  keyAbility: Charisma
  hitPointsAbility: Constitution
  classDC: cf-class-thaumaturge
  proficiencies:
    perception:
      expert:
        - Perception
    savingThrows:
      trained:
        - Reflex
      expert:
        - Fortitude
        - Will
    skills:
      trained:
        - Arcana
        - Nature
        - Occultism
        - Religion
    attacks:
      trained:
        - MartialWeapons
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - MediumArmor
        - LightArmor
  additionalSkillTrainings: 3
  features:
    - level: 1
      name: "Esoteric Lore"
      description: "Recall Knowledge about haunts, curses and strange creatures: TBA"
    - level: 1
      name: "Exploit Vulnerability"
      description: "Exploit Vulnerability is on your action wheel. The creature is off-guard to you and your Strikes deal 2 extra damage."
      grants:
        - !type:CFGrantOption
          option: Exploit
        - !type:CFGrantOption
          pointMark: Exploit
    - level: 1
      name: "First Implement and Esoterica"
      description: "Choose an implement in the builder. What each one does: TBA"
    - level: 1
      name: "Implement's Empowerment"
      description: "Extra damage while holding an implement. Implements are not items yet: TBA"
    - level: 3
      name: "Reflex Expertise"
      description: "Expert in Reflex saves."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Reflex
          rank: Expert
    - level: 5
      name: "Second Implement"
      description: "A second implement: TBA"
    - level: 5
      name: "Weapon Expertise"
      description: "Expert with simple weapons, martial weapons and unarmed attacks."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - SimpleWeapons
            - MartialWeapons
            - Unarmed
          rank: Expert
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
