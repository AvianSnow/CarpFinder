# Young Augdunar. Ancestry Hit Points 10. At 1st level that is 19 Hit Points.
- type: cfPet
  id: CFPetAugdunar
  name: Augdunar
  kind: Companion
  entity: CFCompanionAugdunar
  size: "Medium"
  strength: 3
  dexterity: 1
  constitution: 3
  intelligence: -4
  wisdom: 1
  charisma: 0
  hitPoints: 10
  description: "A young augdunar companion. It is built to be ridden."
  mount: true
  speeds:
    - name: Speed
      feet: 25
  senses:
    - "low-light vision"
    - "scent (imprecise, 30 feet)"
  attacks:
    - name: "Hoof"
      die: 8
      damage: bludgeoning
  skills:
    - name: Athletics
      ability: Strength
  support: "You Interact to draw an item the augdunar is carrying."
  advanced: "Weighted Kick"

- type: entity
  parent: [ SimpleMobBase, CFCompanionBase ]
  id: CFCompanionAugdunar
  name: augdunar companion
  description: "A young augdunar companion. It is built to be ridden."
  suffix: Companion
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: companion
      sprite: _CF/Mobs/companion-default.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: companion
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: HTN
    rootTask:
      task: CFGOAPCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 14
    maxHp: 19
    currentHp: 19
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 3
      Dexterity: 1
      Constitution: 3
      Intelligence: -4
      Wisdom: 1
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 8
    naturalType: bludgeoning
    naturalFinesse: false
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      19: Dead
