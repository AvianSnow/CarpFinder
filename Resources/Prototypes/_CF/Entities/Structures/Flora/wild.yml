# Wild plants to gather, from CP14's Flora/Gatherable/Wild (ported as they were, without the mushroom monsters that
# sometimes grew in their place). Each is picked by hand and gives its alchemy ingredient (Objects/Alchemy/ingredients.yml).
# They do not grow back: a mapper places them, and a round's foragers find them.

- type: entity
  abstract: true
  parent: BaseStructure
  id: CFGatherableBase
  categories: [ ForkFiltered ]
  components:
  - type: PlacementReplacement
    key: CFPlant
  - type: Sprite
    snapCardinals: true
    drawdepth: FloorTiles
  - type: InteractionOutline
  - type: Clickable
  - type: Physics
    canCollide: false
    bodyType: Static
  - type: Appearance
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - HalfWallLayer
        layer:
        - MidImpassable
        - LowImpassable

- type: entity
  parent: CFGatherableBase
  id: CFGatherableBloodFlower
  name: blood rose
  description: Scarlet flowers growing where blood has been spilled.
  suffix: Gatherable
  components:
  - type: Sprite
    sprite: _CP14/Structures/Flora/Wild/blood_flower.rsi
    layers:
    - state: world1
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        world1: ""
        world2: ""
        world3: ""
  - type: CFPlantGatherable
    deleteAfterHarvest: true
    loot: !type:GroupSelector
      children:
      - id: CFBloodFlower

