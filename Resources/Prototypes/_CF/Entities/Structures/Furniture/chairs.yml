- type: entity
  name: wooden chair
  description: Made of the most common planks. Simple and effective!
  id: CFChairWooden
  categories: [ ForkFiltered ]
  parent:
  - UnanchoredChairBase
  - CFBaseFlammable
  components:
  - type: Damageable
    damageModifierSet: CFWood
  - type: Injurable
    damageContainer: Inorganic
  - type: Sprite
    sprite: _CP14/Structures/Furniture/chairs.rsi
    state: wooden
  - type: Construction
    graph: CFSeat
    node: CFChairWooden
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 20
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          CFWoodenPlanks1:
            min: 1
            max: 1

