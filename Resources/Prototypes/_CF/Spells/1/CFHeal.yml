- type: entity
  parent: CFSpellTarget
  id: CFHeal
  name: Heal
  description: Restores 1d8+8 Hit Points.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 1
  - type: CFSpell
    spell: Heal
    rank: 1
  - type: CFTargeting
    rangeFeet: 30
    filter: All
  - type: CFDegreeEffects
    landed:
    - !type:CFHealEffect
      dice: 1
      die: 8
      flat: 8
      heightenDice: 1
      heightenFlat: 8
  - type: CFHeighten
    baseRank: 1
  - type: EntityTargetAction
    canTargetSelf: true
