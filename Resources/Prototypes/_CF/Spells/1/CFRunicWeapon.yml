- type: entity
  parent: CFSpellTarget
  id: CFRunicWeapon
  name: Runic Weapon
  description: Strikes with this creature's weapon deal one extra damage die.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 1
  - type: CFSpell
    spell: RunicWeapon
    rank: 1
  - type: CFTargeting
    rangeFeet: 5
    filter: All
  - type: CFDegreeEffects
    landed:
    - !type:CFBonusEffect
      stat: WeaponDice
      type: Status
      value: 1
  - type: EntityTargetAction
    canTargetSelf: true
