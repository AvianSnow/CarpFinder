# Ported from CP14 by the CF converter.

- type: entity
  id: CFDirtEffect
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    sprite: _CP14/Effects/material_splash.rsi
    drawdepth: Effects
    noRot: true
    layers:
      - state: dirt1
        map: [ "random" ]
  - type: RandomSprite
    available:
      - random:
          dirt1: ""
          dirt2: ""
  - type: TimedDespawn
    lifetime: 2
  - type: Tag
    tags:
      - HideContextMenu
  - type: AnimationPlayer
  - type: EmitSoundOnSpawn
    sound:
      collection: CFDigging

- type: entity
  id: CFSnowEffect
  parent: CFDirtEffect
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
      - state: snow1
        map: [ "random" ]
  - type: RandomSprite
    available:
      - random:
          snow1: ""
          snow2: ""

- type: entity
  id: CFRandomDirtLootSpawner
  name: dirt spawner
  parent: CFDirtEffect
  categories: [ ForkFiltered ]
  components:
  - type: RandomSpawner
    prototypes:
    - CFDirtBlock1
    chance: 1
    deleteSpawnerAfterSpawn: false

- type: entity
  id: CFRandomStoneLootSpawner
  name: dirt spawner
  parent: CFDirtEffect
  categories: [ ForkFiltered ]
  components:
  - type: RandomSpawner
    prototypes:
    - CFStoneBlock1
    chance: 1
    deleteSpawnerAfterSpawn: false

- type: entity
  id: CFRandomSnowLootSpawner
  name: snow spawner
  parent: CFSnowEffect
  categories: [ ForkFiltered ]
  components:
  - type: RandomSpawner
    prototypes:
    - CFSnowball
    chance: 1
    deleteSpawnerAfterSpawn: false
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_CP14/Effects/snowball.ogg
      params:
        variation: 0.250
        volume: 15

- type: entity
  id: CFSnowball
  parent:
  - BaseItem
  - ItemHeftyBase
  categories: [ ForkFiltered ]
  name: snowball
  description: A small handful of snow, handy for throwing.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _CP14/Objects/Materials/snowball.rsi
    layers:
    - state: ball
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 30
        hard: true
        mask:
        - ItemMask
  - type: LandAtCursor
  - type: DamageOnHighSpeedImpact
    minimumSpeed: 0.1
    damage:
      types:
        Blunt: 3
  - type: MeleeWeapon
    attackRate: 1.8
    wideAnimationRotation: 225
    wideAnimation: WeaponArcSlash
    damage:
      types:
        Cold: 0
    soundHit:
      path: /Audio/_CP14/Effects/snowball.ogg
      params:
        variation: 0.250
        volume: 15
  - type: DamageOtherOnHit
    damage:
      types:
        Cold: 0
  - type: StaminaDamageOnCollide
    damage: 5
    sound:
      path: /Audio/Effects/pop.ogg
      params:
        variation: 0.250
        volume: 15
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/_CP14/Effects/snowball.ogg
          params:
            variation: 0.250
            volume: 15
      - !type:SpawnEntitiesBehavior
        spawn:
          CFSnowEffect:
            min: 1
            max: 1

- type: localizedDataset
  id: CFWeaponMessages
  values:
    prefix: cp14-damageable-weapon-
    count: 4
