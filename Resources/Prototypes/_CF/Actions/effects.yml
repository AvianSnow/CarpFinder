- type: entity
  parent: CFActivityTarget
  id: CFActSipChalice
  name: Sip from the Chalice
  description: You or an adjacent ally gain temporary Hit Points equal to your level, 3 at least, for 6 seconds. Once every 6 seconds.
  components:
  - type: Action
