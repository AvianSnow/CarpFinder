# Crops, from CP14's Flora/Gatherable. Plant seeds in a seedbed, keep them watered, and pick them by hand.

- type: entity
  abstract: true
  parent:
  - CFBaseFlammableSpreading
  - BaseStructure
  - Solution
  id: CFPlantBase
  categories: [ ForkFiltered ]
  components:
  - type: PlacementReplacement
    key: CFPlant
  - type: Sprite
    snapCardinals: true
    drawdepth: FloorTiles
    sprite: _CP14/Structures/Specific/Farming/seedbed.rsi
  - type: InteractionOutline
  - type: Clickable
  - type: Physics
    canCollide: false
    bodyType: Static
  - type: Appearance
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - HalfWallLayer
        layer:
        - MidImpassable
        - LowImpassable
  - type: CFPlant
  - type: Solution
    id: plant
    solution:
      maxVol: 200
  - type: RefillableSolution
    solution: plant
    maxRefill: 50
  - type: ExaminableSolution
    solution: plant
  - type: SolutionContainerVisuals
    maxFillLevels: 4
    fillBaseName: liq-
    solutionName: plant

- type: entity
  id: CFPlantCabbage
  parent: CFPlantBase
  name: cabbage
  description: You see a cabbage in front of you. Perhaps you were born in one.
  components:
  - type: Sprite
    layers:
    - state: liq-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: grow-1
      sprite: _CP14/Structures/Flora/Farm/cabbage.rsi
      map: ["enum.CFPlantVisualLayers.Base"]
  - type: CFPlantGatherable
    loot: !type:AllSelector
      children:
      - id: CFFoodCabbage
        rolls: !type:RangeNumberSelector
          range: 6, 8
      - id: CFSeedCabbage
        rolls: !type:RangeNumberSelector
          range: 1, 2

- type: entity
  id: CFPlantCotton
  parent: CFPlantBase
  name: cotton
  description: In a way, you're growing future clothes.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - state: liq-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: grow-1
      offset: 0, 0.5
      sprite: _CP14/Structures/Flora/Farm/cotton.rsi
      map: ["enum.CFPlantVisualLayers.Base"]
  - type: CFPlantGatherable
    loot: !type:AllSelector
      children:
      - id: CFCotton
        rolls: !type:RangeNumberSelector
          range: 4, 6
      - id: CFSeedCotton
        rolls: !type:RangeNumberSelector
          range: 1, 2

