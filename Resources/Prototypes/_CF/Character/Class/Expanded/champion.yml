# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Champion
  name: cf-class-champion
  description: cf-class-description-champion
  hitPoints: 10
  keyAbility: Dexterity
  hitPointsAbility: Constitution
  usesDeity: true
  classDC: cf-class-champion
  proficiencies:
    perception:
      trained:
        - Perception
    savingThrows:
      trained:
        - Reflex
      expert:
        - Fortitude
        - Will
    skills:
      trained:
        - Religion
    attacks:
      trained:
        - MartialWeapons
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - MediumArmor
        - HeavyArmor
        - LightArmor
  additionalSkillTrainings: 2
  features:
    - level: 1
      name: "Champion's Aura"
      description: "You are surrounded by a 15-foot emanation. It does nothing by itself, but your feats and devotion spells work through it."
      grants:
        - !type:CFGrantAura {}
    - level: 1
      name: "Cause"
      description: "Choose a cause in the builder. It gives you your champion's reaction, which fires by itself through your aura."
    - level: 1
      name: "Deity (Champion)"
      description: "Choose yours with the Deity button. It trains a skill and gives its favored weapon."
    - level: 1
      name: "Devotion Spells"
      description: "Choose Lay on Hands, Touch of the Void or Shields of the Spirit in the builder. It costs a Focus Point."
    - level: 1
      name: "Shield Block"
      description: "While your shield is raised, you can spend your reaction to block 5 damage."
      grants:
        - !type:CFGrantOption
          option: ShieldBlock
    - level: 3
      name: "Blessing of the Devoted"
      description: "Choose a boon. Blessed Armament: a critical hit with any weapon gets its critical specialization. Blessed Shield: your Shield Block stops 3 more damage, to 8 at most. Blessed Swiftness: +5 feet status bonus to Speed. The armament's property rune: TBA"
      choiceTitle: cf-class-feature-blessing
      choices:
        - kind: Named
          options: [ BlessedArmament, BlessedShield, BlessedSwiftness ]
      grants:
        - !type:CFGrantChosen
          options:
            BlessedArmament:
              - !type:CFGrantCriticalSpecialization
                specialization: {}
            BlessedShield:
              - !type:CFGrantOption
                option: BlessedShield
            BlessedSwiftness:
              - !type:CFGrantBonus
                stat: Speed
                type: Status
                value: 5
    - level: 5
      name: "Weapon Expertise"
      description: "Expert with simple weapons, martial weapons and unarmed attacks."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - SimpleWeapons
            - MartialWeapons
            - Unarmed
          rank: Expert
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
