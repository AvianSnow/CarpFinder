      ability: Charisma
  support: "Until your next turn, a creature in its reach that you hit takes an extra 1d4 piercing and 1d4 electricity."
  advanced: "Snatch and Zap"

- type: entity
  parent: [ SimpleMobBase, CFCompanionBase ]
