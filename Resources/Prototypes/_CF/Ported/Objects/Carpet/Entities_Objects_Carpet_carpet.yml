# Ported from CP14 by the CF converter.

- type: entity
  parent: BaseItem
  id: CFFloorTileItemBase
  name: carpet
  description: Rolled up carpet for easy transport.
  abstract: true
  components:
  - type: Stack
    count: 1
  - type: Sprite
    sprite: _CP14/Structures/Furniture/Carpets/icons.rsi
  - type: StackPrice
    price: 0.5
  - type: SpawnAfterInteract 
    doAfter: 0.5
    removeOnInteract: true

- type: entity
  name: blue carpet
  parent: CFFloorTileItemBase
  id: CFFloorCarpetItemBlue1
  categories: [ ForkFiltered ]
  suffix: Blue
  components:
  - type: Sprite
    state: blue
  - type: Stack
    stackType: CFFloorCarpetBlue
  - type: SpawnAfterInteract 
    prototype: CFCarpetBlue
  - type: PhysicalComposition
    materialComposition:
      CFCloth: 15

