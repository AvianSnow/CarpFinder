- type: cfSpell
  id: BitOfLuck
  name: Bit of Luck
  rank: 1
  traits: [Concentrate, Fortune, Manipulate]
  actionCost: Two
  range: 30 feet
  targets: 1 willing creature
  summary: "The target rolls its next save twice and keeps the better. The 24 hour immunity: TBA"

- type: cfSpell
  id: ReadFate
  name: Read Fate
  rank: 1
  traits: [Concentrate, Manipulate, Prediction]
  actionCost: Two
  range: 30 feet
  targets: 1 creature other than you
  summary: "One enigmatic word about the target's fate."

- type: cfSpell
  id: EjectSoul
  name: Eject Soul
  rank: 1
  traits: [Concentrate, Incapacitation, Manipulate]
  actionCost: Two
  range: touch
  targets: 1 living creature that has a soul
  defense: Fortitude
  summary: "Stunned on a failure. The soul leaving the body on a critical failure: TBA"

- type: cfSpell
  id: CloakOfShadow
  name: Cloak of Shadow
  rank: 1
  traits: [Aura, Darkness, Manipulate, Shadow]
  actionCost: One
  range: touch
  targets: 1 willing creature
  summary: "The target is concealed. The rules dim the light around it instead, and the light layer is TBA, so here it is concealed outright."

