# Breath weapons, and other areas a creature lets loose and then has to wait to use again. CFBreathWeaponSystem runs
# them: the area resolves through CFEffectSystem, and the rolled recharge becomes the action's cooldown. Grant one to a
# creature with ActionGrant. The AI breathes through the Breathe action in goap.yml.
# Two ways a breath can take time to spread instead of landing at once:
# - CFBreathGas: a cloud of gas that spreads over the area's tiles like atmos and stops at walls. Anyone on a filled tile
#   rolls, once per breath, then the cloud thins out (CFBreathGasSystem). Poison Breath.
# - A reagent on CFBreathWeapon: the breath pours out as that liquid for flowSeconds, and only then do the creatures
#   standing in it roll (CFBreathFlowSystem). The puddles then evaporate. Toxic Spew.

- type: entity
  abstract: true
  parent: BaseAction
  id: CFActBreathBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigAction
    raiseOnAction: true
  - type: TargetAction
    range: -1
    checkCanAccess: false
    targetingIndicator: true
  - type: WorldTargetAction
    event: !type:CFBreathWeaponEvent
  - type: CFTargeting
    delivery: Point
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Action
    actions: 2
  - type: CFBreathWeapon

# Juvenile Horned Dragon, Beginner Box Adventure. A toxic cloud: 5d6 poison in a 30-foot cone, DC 21 basic Reflex.
# It cannot breathe again for 1d4 rounds. Here the cloud billows out over the cone in about 2 seconds, and whoever
# stands where it has thickened rolls, including anyone who walks in while it lingers. It is gone in about 12 seconds.
- type: entity
  parent: CFActBreathBase
  id: CFActPoisonBreath
  name: Poison Breath
  description: A 30-foot cone of toxic cloud. 5d6 poison, DC 21 basic Reflex. 2 actions, then 1d4 rounds to recharge.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: repulse
    color: "#7FD35A"
  - type: CFBreathGas
    cloud: CFBreathCloudPoison
  - type: CFTrait
    traits:
    - Arcane
    - Poison
  - type: CFAreaEffect
    shape: Cone
    sizeFeet: 30
  - type: CFCheck
    defense: Reflex
    basicSave: true
    dcSource: Fixed
    fixedDc: 21
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 5
      die: 6
      damageType: Poison

# Not granted to anything yet. Poison Breath's numbers, poured out as a green liquid: it floods the cone's open tiles over
# 2 seconds, everyone standing in it rolls once it has filled, and the puddles evaporate in about 20 seconds.
- type: entity
  parent: CFActBreathBase
  id: CFActToxicSpew
  name: Toxic Spew
  description: A 30-foot cone of toxic liquid that floods the floor. 5d6 poison, DC 21 basic Reflex, once it has spread. 2 actions, then 1d4 rounds to recharge.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: repulse
    color: "#4FD13A"
  - type: CFBreathWeapon
    reagent: CFToxicSpew
    flowSeconds: 2
  - type: CFTrait
    traits:
    - Arcane
    - Poison
  - type: CFAreaEffect
    shape: Cone
    sizeFeet: 30
  - type: CFCheck
    defense: Reflex
    basicSave: true
    dcSource: Fixed
    fixedDc: 21
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 5
      die: 6
      damageType: Poison
