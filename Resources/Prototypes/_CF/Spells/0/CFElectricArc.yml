- type: entity
  parent: CFSpellTarget
  id: CFElectricArc
  name: Electric Arc
  description: One or two creatures take 1d4 electricity plus your spellcasting modifier. A Reflex save applies.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: ElectricArc
    rank: 0
  - type: CFTargeting
    rangeFeet: 30
    extraTargets: 1
  - type: CFCheck
    defense: Reflex
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 4
      damageType: Electricity
      addAbilityModifier: true
      heightenDice: 1
  - type: CFHeighten
    baseRank: 1
    interval: 2
