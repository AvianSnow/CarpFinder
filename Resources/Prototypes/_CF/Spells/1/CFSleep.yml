- type: entity
  parent: CFSpellArea
  id: CFSleep
  name: Sleep
  description: Each creature in a 5-foot burst within 30 feet falls unconscious on a failed Will save.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 1
  - type: CFSpell
    spell: Sleep
    rank: 1
  - type: CFTargeting
    rangeFeet: 30
  - type: CFAreaEffect
    shape: Burst
    sizeFeet: 5
  - type: CFCheck
    defense: Will
    basicSave: false
  - type: CFDegreeEffects
    failure:
    - !type:CFApplyConditionEffect
      condition: Asleep
      durationSeconds: 6
    criticalFailure:
    - !type:CFApplyConditionEffect
      condition: Asleep
      durationSeconds: 18
