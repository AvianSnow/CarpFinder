# The Chirurgeon's field vial: a drink, not a bomb.
- type: entity
  parent: CFBasePotion
  id: CFVersatileVialHealing
  name: versatile vial (healing)
  description: A vial of quick alchemy. Drinking it restores 1d6 Hit Points. It goes inert within moments.
  components:
  - type: Sprite
    layers:
    - state: vial
    - state: fill-6
      color: "#e85a6a"
  - type: Tag
    tags:
    - CFAlchemical
    - CFConsumable
    - CFHealing
  - type: CFTrait
    traits:
    - Alchemical
    - Consumable
    - Elixir
    - Healing
    - Infused
  - type: CFItem
    level: 1
  - type: CFAlchemicalItem
    itemLevel: 1
    priceGp: 0
  - type: CFItemUse
    uses: Heals
  - type: CFHealConsumable
    healDice: 1
    healDie: 6
