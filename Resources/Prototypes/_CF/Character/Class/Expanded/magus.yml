# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Magus
  name: cf-class-magus
  description: cf-class-description-magus
  hitPoints: 8
  keyAbility: Dexterity
  hitPointsAbility: Constitution
  classDC: cf-class-magus
  proficiencies:
    perception:
      trained:
        - Perception
    savingThrows:
      trained:
        - Reflex
      expert:
        - Fortitude
        - Will
    skills:
      trained:
        - Arcana
    attacks:
      trained:
        - MartialWeapons
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - MediumArmor
        - LightArmor
  additionalSkillTrainings: 2
  spellcasting:
    tradition: Arcane
    ability: Dexterity
    cantrips: 5
    slots:
      - 1
    laterSlots:
      - [ 2 ]
      - [ 2, 1 ]
      - [ 2, 2 ]
      - [ 2, 2, 1 ]
    prepared: true
  features:
    - level: 1
      name: "Arcane Cascade"
      description: "Arcane Cascade is on your action wheel. In this stance your melee Strikes deal 1 more damage. Matching the type of your last spell: TBA"
      grants:
        - !type:CFGrantAction
          action: CFActArcaneCascade
    - level: 1
      name: "Conflux Spells"
      description: "Focus spells from your hybrid study: TBA"
    - level: 1
      name: "Hybrid Study"
      description: "Choose a hybrid study in the builder. What each study does depends on recharging Spellstrike: TBA"
    - level: 1
      name: "Magus Spellcasting"
      description: "Level 1 cantrips and spell slots are on the spell sheet."
    - level: 1
      name: "Spellstrike"
      description: "Spellstrike is on your action wheel. A melee Strike also deals force damage and can spend a rank 1 slot. It then has to be recharged with its 1 action, or by casting a conflux spell. Choosing which spell goes into the Strike: TBA"
      grants:
        - !type:CFGrantOption
          option: Spellstrike
        - !type:CFGrantAction
          action: CFActSpellstrike
        - !type:CFGrantAction
          action: CFActSpellstrikeRecharge
    - level: 5
      name: "Reflex Expertise"
      description: "Expert in Reflex saves."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Reflex
          rank: Expert
    - level: 5
      name: "Weapon Expertise"
      description: "Expert with simple weapons, martial weapons and unarmed attacks."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - SimpleWeapons
            - MartialWeapons
            - Unarmed
          rank: Expert
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
