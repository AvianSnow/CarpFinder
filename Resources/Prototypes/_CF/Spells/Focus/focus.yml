# Focus spells. Each costs a Focus Point and heightens to half the caster's level, rounded up, so rank is 0 on the action.
# Grant one with CFGrantFocusSpell.

- type: entity
  parent: CFSpellTarget
  id: CFTempestSurge
  name: Tempest Surge
  description: A storm deals 1d12 electricity to a creature, basic Reflex. On a failure it is also clumsy 2 for a round. Costs a Focus Point.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: TempestSurge
    rank: 0
    focus: true
  - type: CFTargeting
    rangeFeet: 30
  - type: CFHeighten
    baseRank: 1
    interval: 1
  - type: CFCheck
    defense: Reflex
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 12
      damageType: Electricity
      heightenDice: 1
    failure:
    - !type:CFApplyConditionEffect
      condition: Clumsy
      value: 2
      durationSeconds: 6
    criticalFailure:
    - !type:CFApplyConditionEffect
      condition: Clumsy
      value: 2
      durationSeconds: 6

- type: entity
  parent: CFSpellTarget
  id: CFForceBolt
  name: Force Bolt
  description: A bolt of force that always hits for 1d4+1. Costs a Focus Point.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: ForceBolt
    rank: 0
    focus: true
  - type: CFTargeting
    rangeFeet: 30
  - type: CFHeighten
    baseRank: 1
    interval: 2
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 4
      flat: 1
      damageType: Force
      heightenDice: 1
      heightenFlat: 1

- type: entity
  parent: CFActivityInstant
  id: CFActRefocus
  name: Refocus
  description: Spend 1 minute to regain 1 Focus Point. Moving or being hurt interrupts it.
  components:
  - type: CFRefocus
  - type: CFRadialSlot
    group: Free
    tab: Focus

# Untamed Form: Pest Form at rank 1, Animal Form's shapes from rank 2 (level 3), with Animal Form's rank 3 numbers at level 5.
- type: entity
  parent: CFSpellInstant
  id: CFUntamedForm
  name: Untamed Form
  description: You take another shape. A pest for 10 minutes, which cannot attack, or from level 3 an ape, bear, bull, canine, cat or deer for a minute. You cannot cast spells or use a weapon in it. Costs a Focus Point.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: UntamedForm
    rank: 0
    focus: true
  - type: CFTargeting
    filter: All
  - type: CFModeChoice
    modes:
    - { value: 7, name: cf-battle-form-pest, immediate: true }
    - { value: 1, name: cf-battle-form-ape, immediate: true }
    - { value: 2, name: cf-battle-form-bear, immediate: true }
    - { value: 3, name: cf-battle-form-bull, immediate: true }
    - { value: 4, name: cf-battle-form-canine, immediate: true }
    - { value: 5, name: cf-battle-form-cat, immediate: true }
    - { value: 6, name: cf-battle-form-deer, immediate: true }
  - type: CFBattleFormSpell
    ownAttackBonus: 2
    formControl: true
    tiers:
    - { rank: 3, baseArmorClass: 17, attackModifier: 14, damageBonus: 5, temporaryHp: 10 }
    forms:
    - { mode: 7, name: cf-battle-form-pest, noStrikes: true, baseArmorClass: 15, speedFeet: 20, durationSeconds: 600, physicalWeakness: 5, sprite: { sprite: Mobs/Animals/Rodents/mouse.rsi, state: mouse-0 } }
    - { mode: 1, name: cf-battle-form-ape, minRank: 2, dice: 2, die: 6, damageType: Bludgeoning, speedFeet: 25, sprite: { sprite: Mobs/Animals/gorilla.rsi, state: crawling } }
    - { mode: 2, name: cf-battle-form-bear, minRank: 2, dice: 2, die: 8, damageType: Piercing, speedFeet: 30, sprite: { sprite: Mobs/Animals/bear.rsi, state: bear } }
    - { mode: 3, name: cf-battle-form-bull, minRank: 2, dice: 2, die: 8, damageType: Piercing, speedFeet: 30, sprite: { sprite: Mobs/Animals/Farm/cow.rsi, state: alive } }
    - { mode: 4, name: cf-battle-form-canine, minRank: 2, dice: 2, die: 8, damageType: Piercing, speedFeet: 40, sprite: { sprite: Mobs/Pets/corgi.rsi, state: corgi } }
    - { mode: 5, name: cf-battle-form-cat, minRank: 2, dice: 2, die: 6, damageType: Piercing, speedFeet: 40, sprite: { sprite: Mobs/Pets/cat.rsi, state: cat } }
    - { mode: 6, name: cf-battle-form-deer, minRank: 2, dice: 2, die: 6, damageType: Piercing, speedFeet: 50, sprite: { sprite: Mobs/Animals/reindeer_buck.rsi, state: reindeer_buck } }

# The list of spells hides these from the builder: an empty traditions list is on nobody's spell list.
- type: cfSpell
  id: UntamedForm
  name: Untamed Form
  rank: 1
  traits: [Concentrate, Manipulate, Polymorph]
  actionCost: Two
  duration: varies
  summary: You become a pest for 10 minutes, or from rank 2 one of Animal Form's shapes for 1 minute. Your own attack modifier gets a +2 status bonus when you use it.
  heightened: Rank 2 adds Animal Form's shapes. Rank 3 uses Animal Form's rank 3 numbers.

- type: cfSpell
  id: TempestSurge
  name: Tempest Surge
  rank: 1
  traits: [Concentrate, Electricity, Manipulate]
  actionCost: Two
  range: 30 feet
  targets: 1 creature
  defense: basic Reflex
  summary: A storm deals 1d12 electricity damage. On a failure the target is also clumsy 2 for 1 round.
  heightened: Damage increases by 1d12 per rank.

- type: cfSpell
  id: ForceBolt
  name: Force Bolt
  rank: 1
  traits: [Concentrate, Force, Manipulate]
  actionCost: One
  range: 30 feet
  targets: 1 creature
  summary: A bolt of force automatically hits for 1d4+1 force damage.
  heightened: Damage increases by 1d4+1 every 2 ranks.

- type: entity
  parent: CFSpellTarget
  id: CFLayOnHands
  name: Lay on Hands
  description: A touch heals a creature for 6 Hit Points, or more when heightened. Costs a Focus Point.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 1
  - type: CFSpell
    spell: LayOnHands
    rank: 0
    focus: true
  - type: CFTargeting
    rangeFeet: 5
    touch: true
    filter: All
  - type: CFHeighten
    baseRank: 1
    interval: 1
  # The 2-action version is Mercy's: it also ends a condition.
  - type: CFModeChoice
    modes:
    - { value: 1, name: cf-mode-touch-1, tooltip: cf-mode-lay-on-hands-1-desc, actions: 1 }
    - { value: 2, name: cf-mode-touch-2, tooltip: cf-mode-lay-on-hands-2-desc, actions: 2, requires: Mercy }
  - type: CFDegreeEffects
    landed:
    - !type:CFHealEffect
      flat: 6
      heightenFlat: 6
    - !type:CFMercyEffect
      onlyMode: 2
  - type: EntityTargetAction
    canTargetSelf: true

- type: entity
  parent: CFSpellTarget
  id: CFTouchOfTheVoid
  name: Touch of the Void
  description: A touch deals 1d6 void damage, basic Fortitude. On a failure the target also takes -2 to AC for 6 seconds. Costs a Focus Point.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 1
  - type: CFSpell
    spell: TouchOfTheVoid
    rank: 0
    focus: true
  - type: CFTargeting
    rangeFeet: 5
    touch: true
  - type: CFHeighten
    baseRank: 1
    interval: 1
  # The 2-action version is Cruelty's: it also enfeebles.
  - type: CFModeChoice
    modes:
    - { value: 1, name: cf-mode-touch-1, tooltip: cf-mode-touch-of-the-void-1-desc, actions: 1 }
    - { value: 2, name: cf-mode-touch-2, tooltip: cf-mode-touch-of-the-void-2-desc, actions: 2, requires: Cruelty }
  - type: CFCheck
    defense: Fortitude
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 6
      damageType: Void
      heightenDice: 1
    failure:
    - !type:CFBonusEffect
      stat: ArmorClass
      type: Status
      value: -2
      durationSeconds: 6
    - !type:CFApplyConditionEffect
      condition: Enfeebled
      value: 1
      durationSeconds: 60
      onlyMode: 2
    criticalFailure:
    - !type:CFBonusEffect
      stat: ArmorClass
      type: Status
      value: -2
      durationSeconds: 6
    - !type:CFApplyConditionEffect
      condition: Enfeebled
      value: 2
      durationSeconds: 60
      onlyMode: 2

- type: cfSpell
  id: LayOnHands
  name: Lay on Hands
  rank: 1
  traits: [Healing, Manipulate, Vitality]
  actionCost: One
  range: touch
  targets: 1 creature
  summary: The target regains 6 Hit Points. Damaging undead and the AC bonus are TBA.
  heightened: Healing increases by 6 per rank.

- type: cfSpell
