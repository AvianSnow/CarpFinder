# Actions that only apply effects. CFEffectActionSystem runs them. Grant one with CFGrantAction.

- type: entity
  parent: CFActivityInstant
  id: CFActExtravagantParry
  name: Extravagant Parry
  description: +1 circumstance bonus to AC for 6 seconds.
  components:
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFBonusEffect
      stat: ArmorClass
      type: Circumstance
      value: 1
      durationSeconds: 6

- type: entity
  parent: CFActivityInstant
  id: CFActTributaryCirculation
  name: Tributary Circulation
  description: +2 circumstance bonus to Will saves for 6 seconds.
  components:
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFBonusEffect
      stat: Will
      type: Circumstance
      value: 2
      durationSeconds: 6

- type: entity
  parent: CFActivityInstant
  id: CFActTranceOfCelerity
  name: Trance of Celerity
  description: +5 feet status bonus to Speed for a minute.
  components:
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFBonusEffect
      stat: Speed
      type: Status
      value: 5
      durationSeconds: 60

- type: entity
  parent: CFActivityTarget
  id: CFActNudgeScales
  name: Nudge the Scales
  description: Heal a creature within 30 feet for 2 Hit Points plus double your level.
  components:
  - type: TargetAction
    range: 6.25
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFHealEffect
      flat: 2
      perLevel: 2

- type: entity
  parent: CFActivityTarget
  id: CFActPsiBurst
  name: Psi Burst
  description: A creature within 30 feet takes 1d4 bludgeoning, basic Reflex. The damage grows at levels 3 and 5.
  components:
  - type: TargetAction
    range: 6.25
  - type: CFEffectAction
  - type: CFCheck
    defense: Reflex
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 4
      damageType: Bludgeoning
      diceEveryLevels: 2

- type: entity
  parent: CFActivityTarget
  id: CFActDrainChalice
  name: Drain the Chalice
  description: You or an adjacent ally regain 3 Hit Points per level. The chalice refills in 10 minutes.
  components:
  - type: Action
    useDelay: 600
  - type: EntityTargetAction
    canTargetSelf: true
    whitelist:
      components:
      - MobState
    event: !type:CFActivityTargetEvent
  - type: CFNeedsImplement
    kind: Chalice
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFHealEffect
      perLevel: 3

- type: entity
  abstract: true
  parent: CFActivityTarget
  id: CFActFlingMagicBase
  components:
  - type: TargetAction
    range: 12.25
  - type: CFRadialSlot
    actions: 2
  - type: CFNeedsImplement
    kind: Wand
  - type: CFEffectAction
  - type: CFCheck
    defense: Reflex
    dcSource: Class

- type: entity
  parent: CFActFlingMagicBase
  id: CFActFlingMagicFire
  name: Fling Magic
  description: A creature within 60 feet takes 3d4 fire damage, basic Reflex against your class DC, and 1d4 more at levels 3 and 5. Costs 2 actions.
  components:
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 3
      die: 4
      damageType: Fire
      diceEveryLevels: 2

- type: entity
  parent: CFActFlingMagicBase
  id: CFActFlingMagicCold
  name: Fling Magic
  description: A creature within 60 feet takes 3d4 cold damage, basic Reflex against your class DC, and 1d4 more at levels 3 and 5. Costs 2 actions.
  components:
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 3
      die: 4
      damageType: Cold
      diceEveryLevels: 2

- type: entity
  parent: CFActFlingMagicBase
  id: CFActFlingMagicElectricity
  name: Fling Magic
  description: A creature within 60 feet takes 3d4 electricity damage, basic Reflex against your class DC, and 1d4 more at levels 3 and 5. Costs 2 actions.
  components:
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 3
      die: 4
      damageType: Electricity
      diceEveryLevels: 2

- type: entity
  parent: CFActivityInstant
  id: CFActUnleashPsyche
  name: Unleash Psyche
  description: For 12 seconds, damaging spells with no duration deal double their rank more. Needs a spell cast in the last 6 seconds. Stupefied 1 for 12 seconds after.
  components:
  - type: CFRadialSlot
    group: Free
    actions: 0
  - type: CFUnleashAction

- type: entity
  parent: CFActivityInstant
  id: CFActCalculateThreats
  name: Calculate Threats
  description: While Unleashed, +2 circumstance bonus to AC and Reflex for 6 seconds.
  components:
  - type: CFNeedsUnleashed
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFBonusEffect
      stat: ArmorClass
      type: Circumstance
      value: 2
      durationSeconds: 6
    - !type:CFBonusEffect
      stat: Reflex
      type: Circumstance
      value: 2
      durationSeconds: 6

- type: entity
  parent: CFActivityInstant
  id: CFActFadeIntoDaydreams
  name: Fade into Daydreams
  description: While Unleashed, you are concealed for 6 seconds.
  components:
  - type: CFNeedsUnleashed
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFApplyConditionEffect
      condition: Concealed
      durationSeconds: 6

- type: entity
  parent: CFActivityTarget
  id: CFActRestoreTheMind
  name: Restore the Mind
  description: While Unleashed, an ally within 30 feet regains 2 Hit Points plus double your level. Once every 10 minutes.
  components:
  - type: Action
    useDelay: 600
  - type: TargetAction
    range: 6.25
  - type: CFNeedsUnleashed
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFHealEffect
      flat: 2
      perLevel: 2
