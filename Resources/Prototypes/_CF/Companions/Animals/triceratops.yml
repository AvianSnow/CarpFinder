# Young Triceratops. Ancestry Hit Points 8. At 1st level that is 16 Hit Points.
- type: cfPet
  id: CFPetTriceratops
  name: Triceratops
  kind: Companion
  entity: CFCompanionTriceratops
  size: "Large"
  strength: 3
  dexterity: 1
  constitution: 2
  intelligence: -4
  wisdom: 2
  charisma: 0
  hitPoints: 8
  description: "A young triceratops companion. It is built to be ridden."
  mount: true
  speeds:
    - name: Speed
      feet: 25
  senses:
    - "low-light vision"
    - "scent (imprecise, 30 feet)"
  attacks:
    - name: "Horn"
      die: 8
      damage: piercing
    - name: "Foot"
      die: 6
      damage: bludgeoning
  skills:
    - name: Intimidation
      ability: Charisma
  support: "Until your next turn, a damaging Strike against a prone creature in its reach also deals 1d8 persistent bleed, or 2d8 once it is nimble or savage."
  advanced: "Lumbering Knockdown"

- type: entity
  parent: [ SimpleMobBase, CFCompanionBase ]
  id: CFCompanionTriceratops
  name: triceratops companion
  description: "A young triceratops companion. It is built to be ridden."
  suffix: Companion
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: companion
      sprite: _CF/Mobs/companion-default.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: companion
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: HTN
    rootTask:
      task: CFCompanionCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 14
    maxHp: 16
    currentHp: 16
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 3
      Dexterity: 1
      Constitution: 2
      Intelligence: -4
      Wisdom: 2
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 8
    naturalType: piercing
    naturalFinesse: false
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      16: Dead
