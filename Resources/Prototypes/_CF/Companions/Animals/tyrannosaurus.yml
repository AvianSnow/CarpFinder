# Young Tyrannosaurus. Ancestry Hit Points 8. At 1st level that is 17 Hit Points.
- type: cfPet
  id: CFPetTyrannosaurus
  name: Tyrannosaurus
  kind: Companion
  entity: CFCompanionTyrannosaurus
  size: "Large"
  strength: 3
  dexterity: 1
  constitution: 3
  intelligence: -4
  wisdom: 1
  charisma: 0
  hitPoints: 8
  description: "A young tyrannosaurus companion."
  speeds:
    - name: Speed
      feet: 35
  senses:
    - "low-light vision"
    - "scent (imprecise, 30 feet)"
  attacks:
    - name: "Jaws"
      die: 8
      damage: piercing
    - name: "Foot"
      die: 6
      damage: bludgeoning
  skills:
    - name: Intimidation
      ability: Charisma
  support: "Until your next turn, a creature in its reach that you damage becomes frightened 1."
  advanced: "Overwhelm"

- type: entity
  parent: [ SimpleMobBase, CFCompanionBase ]
  id: CFCompanionTyrannosaurus
  name: tyrannosaurus companion
  description: "A young tyrannosaurus companion."
  suffix: Companion
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: companion
      sprite: _CF/Mobs/companion-default.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: companion
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: HTN
    rootTask:
      task: CFCompanionCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 14
    maxHp: 17
    currentHp: 17
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 3
      Dexterity: 1
      Constitution: 3
      Intelligence: -4
      Wisdom: 1
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 8
    naturalType: piercing
    naturalFinesse: false
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      17: Dead
