# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Bard
  name: cf-class-bard
  description: cf-class-description-bard
  hitPoints: 8
  keyAbility: Charisma
  hitPointsAbility: Constitution
  classDC: cf-class-bard
  proficiencies:
    perception:
      expert:
        - Perception
    savingThrows:
      trained:
        - Fortitude
        - Reflex
      expert:
        - Will
    skills:
      trained:
        - Occultism
        - Performance
    attacks:
      trained:
        - MartialWeapons
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - LightArmor
  additionalSkillTrainings: 4
  spellcasting:
    tradition: Occult
    ability: Charisma
    cantrips: 5
    slots:
      - 2
    laterSlots:
      - [ 3 ]
      - [ 3, 2 ]
      - [ 3, 3 ]
      - [ 3, 3, 2 ]
  features:
    - level: 1
      name: "Bard Spellcasting"
      description: "Level 1 cantrips and spell slots are on the spell sheet."
    - level: 1
      name: "Composition Spells"
      description: "Courageous Anthem is on your action wheel."
      grants:
        - !type:CFGrantOption
          option: Anthem
        - !type:CFGrantAction
          action: CFActAnthem
    - level: 1
      name: "Muses"
      description: "Choose yours with the Muse button."
    - level: 1
      name: "Spell Repertoire"
      description: "Level 1 cantrips and spell slots are on the spell sheet."
    - level: 3
      name: "Reflex Expertise"
      description: "Expert in Reflex saves."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Reflex
          rank: Expert
    - level: 3
      name: "Signature Spells"
      description: "Choose one spell of each rank. You can cast it at any rank you have a slot for, without learning it there."
      choiceTitle: cf-class-feature-signature-spells
      choices:
        - kind: SignatureSpell
          spellRank: 1
        - kind: SignatureSpell
          spellRank: 2
        - kind: SignatureSpell
          spellRank: 3
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
