# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Druid
  name: cf-class-druid
  description: cf-class-description-druid
  hitPoints: 8
  keyAbility: Wisdom
  hitPointsAbility: Constitution
  classDC: cf-class-druid
  proficiencies:
    perception:
      trained:
        - Perception
    savingThrows:
      trained:
        - Fortitude
        - Reflex
      expert:
        - Will
    skills:
      trained:
        - Nature
    attacks:
      trained:
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - MediumArmor
        - LightArmor
  additionalSkillTrainings: 2
  spellcasting:
    tradition: Primal
    ability: Wisdom
    cantrips: 5
    slots:
      - 2
    prepared: true
  features:
    - level: 1
      name: "Anathema (Druid)"
      description: "The acts your order forbids: TBA"
    - level: 1
      name: "Druid Spellcasting"
      description: "Level 1 cantrips and spell slots are on the spell sheet."
    - level: 1
      name: "Druidic Order"
      description: "Choose yours with the Druidic Order button."
    - level: 1
      name: "Shield Block"
      description: "While your shield is raised, you can spend your reaction to block damage."
      grants:
        - !type:CFGrantOption
          option: ShieldBlock
    - level: 1
      name: "Voice of Nature"
      description: "Your bond with the natural world: TBA"
    - level: 1
      name: "Wildsong"
      description: "The druids' secret language: TBA"
    - level: 3
      name: "Fortitude Expertise"
      description: "Expert in Fortitude saves."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Fortitude
          rank: Expert
    - level: 3
      name: "Perception Expertise"
      description: "Expert in Perception."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Perception
          rank: Expert
    - level: 5
      name: "Reflex Expertise"
      description: "Expert in Reflex saves."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Reflex
          rank: Expert
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
