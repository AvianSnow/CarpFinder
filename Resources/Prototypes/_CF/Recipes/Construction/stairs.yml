# Staircases from the construction menu. Build one on the lower level, facing the way it climbs, and take the
# floor tile above its top out on the level above.

- type: construction
  id: CFZLevelStairsFrame
  graph: CFZLevelStairs
  startNode: start
  targetNode: CFZLevelStairsFrame
  category: construction-category-structures
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  conditions:
    - !type:TileNotBlocked

