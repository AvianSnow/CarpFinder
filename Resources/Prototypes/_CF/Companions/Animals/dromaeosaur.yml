# Young Dromaeosaur. Ancestry Hit Points 6. At 1st level that is 14 Hit Points.
- type: cfPet
  id: CFPetDromaeosaur
  name: Dromaeosaur
  kind: Companion
  entity: CFCompanionDromaeosaur
  size: "Small"
  strength: 2
  dexterity: 3
  constitution: 2
  intelligence: -4
  wisdom: 1
  charisma: 0
  hitPoints: 6
  description: "A young dromaeosaur companion."
  speeds:
    - name: Speed
      feet: 50
  senses:
    - "low-light vision"
    - "scent (imprecise, 30 feet)"
  attacks:
    - name: "Jaws"
      die: 8
      damage: piercing
      finesse: true
    - name: "Talon"
      die: 6
      damage: slashing
      agile: true
      finesse: true
  skills:
    - name: Stealth
      ability: Dexterity
  support: "Until your next turn, it can count as occupying an empty square within 10 feet when checking whether the two of you flank."
  advanced: "Darting Attack"

- type: entity
  parent: [ SimpleMobBase, CFCompanionBase ]
  id: CFCompanionDromaeosaur
  name: dromaeosaur companion
  description: "A young dromaeosaur companion."
  suffix: Companion
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: companion
      sprite: _CF/Mobs/companion-default.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: companion
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: HTN
    rootTask:
      task: CFCompanionCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 16
    maxHp: 14
    currentHp: 14
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 2
      Dexterity: 3
      Constitution: 2
      Intelligence: -4
      Wisdom: 1
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 8
    naturalType: piercing
    naturalFinesse: true
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      14: Dead
