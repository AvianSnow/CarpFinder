# Domain spells (Player Core and Divine Mysteries): the first spell of each domain our deities have. A cfDomain grants one
# (Character/domains.yml). Each costs a Focus Point and heightens to half the caster's level, rounded up. Spells cast as a
# reaction are not here: their domain grants a CFGrantReaction instead.

- type: entity
  parent: CFSpellArea
  id: CFDazzlingFlash
  name: Dazzling Flash
  description: "A 15-foot cone of light, Fortitude save. Success: dazzled 6 seconds. Failure: blinded 6 seconds and dazzled a minute. Critical failure: dazzled an hour. Costs a Focus Point."
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 2
  - type: CFSpell
    spell: DazzlingFlash
    rank: 0
    focus: true
  - type: CFAreaEffect
    shape: Cone
    sizeFeet: 15
  - type: CFCheck
    defense: Fortitude
    basicSave: false
  - type: CFDegreeEffects
    success:
    - !type:CFApplyConditionEffect
      condition: Dazzled
      value: 1
      durationSeconds: 6
    failure:
    - !type:CFApplyConditionEffect
      condition: Blinded
      value: 1
      durationSeconds: 6
    - !type:CFApplyConditionEffect
      condition: Dazzled
      value: 1
      durationSeconds: 60
    criticalFailure:
    - !type:CFApplyConditionEffect
      condition: Blinded
      value: 1
      durationSeconds: 6
    - !type:CFApplyConditionEffect
      condition: Dazzled
      value: 1
      durationSeconds: 3600

- type: entity
  parent: CFSpellTarget
  id: CFHealersBlessing
  name: Healer's Blessing
  description: "For a minute an ally regains 2 more Hit Points each time a spell heals it, 2 more per rank above the first. Costs a Focus Point."
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 1
  - type: CFSpell
    spell: HealersBlessing
    rank: 0
    focus: true
  - type: EntityTargetAction
    canTargetSelf: true
  - type: CFTargeting
    rangeFeet: 30
    filter: Allies
  - type: CFHeighten
    baseRank: 1
    interval: 1
  - type: CFDegreeEffects
    landed:
    - !type:CFBonusEffect
      stat: SpellHealing
      type: Untyped
      value: 2
      heightenValue: 2
      durationSeconds: 60

- type: entity
  parent: CFSpellInstant
  id: CFWordOfTruth
  name: Word of Truth
  description: "A symbol of your deity shows that you believe what you say: +2 status to Diplomacy for a minute. Costs a Focus Point."
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 1
  - type: CFSpell
    spell: WordOfTruth
    rank: 0
    focus: true
  - type: CFTargeting
    filter: All
  - type: CFDegreeEffects
    landed:
    - !type:CFBonusEffect
      stat: SkillChecks
      skill: Diplomacy
      value: 2
      durationSeconds: 60

- type: entity
  parent: CFSpellInstant
  id: CFSwearOath
  name: Swear Oath
  description: "You swear to act: +1 status to attack rolls and skill checks for 6 seconds. The rules have you Ready an action for it. Costs a Focus Point."
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 1
  - type: CFSpell
    spell: SwearOath
    rank: 0
    focus: true
  - type: CFTargeting
    filter: All
  - type: CFDegreeEffects
    landed:
    - !type:CFBonusEffect
      stat: AttackRoll
      value: 1
      durationSeconds: 6
    - !type:CFBonusEffect
      stat: SkillChecks
      value: 1
      durationSeconds: 6

- type: entity
  parent: CFSpellArea
  id: CFCreativeSplash
  name: Creative Splash
  description: "Paint splashes a 5-foot burst within 30 feet, Will save. One colour per cast: white dazzles, red enfeebles, yellow frightens, blue makes clumsy. Costs a Focus Point."
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 2
  - type: CFSpell
    spell: CreativeSplash
    rank: 0
    focus: true
  - type: CFTargeting
    rangeFeet: 30
  - type: CFAreaEffect
    shape: Burst
    sizeFeet: 5
  - type: CFCheck
    defense: Will
    basicSave: false
  - type: CFDegreeEffects
    effects:
    - !type:CFRandomOptionEffect
      options:
      - failure:
        - !type:CFApplyConditionEffect
          condition: Dazzled
          value: 1
          durationSeconds: 6
        criticalFailure:
        - !type:CFApplyConditionEffect
          condition: Dazzled
          value: 1
          durationSeconds: 60
      - failure:
        - !type:CFApplyConditionEffect
          condition: Enfeebled
          value: 1
          durationSeconds: 6
        criticalFailure:
        - !type:CFApplyConditionEffect
          condition: Enfeebled
          value: 2
          durationSeconds: 6
      - failure:
        - !type:CFApplyConditionEffect
          condition: Frightened
          value: 1
          durationSeconds: 6
        criticalFailure:
        - !type:CFApplyConditionEffect
          condition: Frightened
          value: 2
          durationSeconds: 6
      - failure:
        - !type:CFApplyConditionEffect
          condition: Clumsy
          value: 1
          durationSeconds: 6
        criticalFailure:
        - !type:CFApplyConditionEffect
          condition: Clumsy
          value: 2
          durationSeconds: 6

- type: entity
