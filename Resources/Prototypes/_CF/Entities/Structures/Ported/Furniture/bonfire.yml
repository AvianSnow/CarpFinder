# Ported from CP14 by the CF converter.

- type: entity
  id: CFBonfire
  parent: CFBaseFireplace
  name: bonfire
  description: A pile of logs stacked together, ready to burst into flames at the slightest spark.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    noRot: true
    sprite: _CP14/Structures/Furniture/bonfire.rsi
    layers:
      - state: base
      - state: full-1
        visible: false
      - map: ["enum.StorageFillLayers.Fill"]
  - type: Construction
    graph: CFBonfire
    node: CFBonfire
  - type: Damageable
    damageModifierSet: CFWood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 20
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
  - type: StorageFillVisualizer
    maxFillLevels: 2
    fillBaseName: full
  - type: FireVisuals
    sprite: _CP14/Structures/Furniture/bonfire.rsi
    normalState: burning
  - type: Storage
    grid:
    - 0,0,2,1
    whitelist:
      tags:
      - CFFireplaceFuel
