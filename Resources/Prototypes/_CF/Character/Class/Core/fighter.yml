# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Fighter
  name: cf-class-fighter
  description: cf-class-description-fighter
  hitPoints: 10
  keyAbility: Strength
  hitPointsAbility: Constitution
  classDC: cf-class-fighter
  proficiencies:
    perception:
      expert:
        - Perception
    savingThrows:
      trained:
        - Will
      expert:
        - Fortitude
        - Reflex
    attacks:
      trained:
        - AdvancedWeapons
      expert:
        - MartialWeapons
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - MediumArmor
        - HeavyArmor
        - LightArmor
  additionalSkillTrainings: 3
  features:
    - level: 1
      name: "Reactive Strike"
      description: "When an enemy in your reach casts a spell, makes a ranged Strike, or runs out of your reach, you Strike it. Uses your reaction. An enemy that walks out and spends 1 action is safe."
      grants:
        - !type:CFGrantOption
          option: ReactiveStrike
    - level: 1
      name: "Shield Block"
      description: "While your shield is raised, you can spend your reaction to block 5 damage."
      grants:
        - !type:CFGrantOption
          option: ShieldBlock
    - level: 3
      name: "Bravery"
      description: "Expert in Will saves. A success against fear becomes a critical success, and frightened is 1 lower whenever you gain it."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Will
          rank: Expert
        - !type:CFGrantSaveUpgrade
          trait: Fear
        - !type:CFGrantOption
          option: Bravery
    - level: 5
      name: "Fighter Weapon Mastery"
      description: "Choose a weapon group. You become a master with it. Advanced weapons should only reach expert, and critical specialization: TBA"
      choiceTitle: cf-class-feature-weapon-mastery
      choices:
        - kind: WeaponGroup
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
