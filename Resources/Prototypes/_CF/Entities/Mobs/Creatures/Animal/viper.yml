# Viper. Creature -1, Tiny, Animal. Monster Core p. 316. Recall Knowledge DC 13.
# Fangs with viper venom (Afflictions/monsters.yml). Its 1d8-3 bite deals at least 1.
# Not in: Slither away, and its climb and swim Speeds. A Tiny creature has a Medium body's reach here.
- type: entity
  parent: [CFBaseCreature]
  id: CFMobViper
  name: viper
  description: A small snake with a flat head and a bite that burns.
  components:
    - type: GhostRole
      name: cf-ghost-viper-name
      description: cf-ghost-viper-desc
    - type: Sprite
      drawdepth: Mobs
      scale: 0.8, 0.8
      layers:
        - map: ["enum.DamageStateVisualLayers.Base"]
          sprite: Mobs/Animals/snake.rsi
          state: snake
    - type: DamageStateVisuals
      states:
        Alive:
          Base: snake
        Critical:
          Base: dead
        Dead:
          Base: dead
    - type: MovementSpeedModifier
      baseWalkSpeed: 2
      baseSprintSpeed: 3.6
    - type: CFSenses
      lowLightVision: true
      impreciseFeet: 30
    - type: CFSmeller
    - type: NightVision
      enabled: true
      prioritized: true
      noiseAmount: 0
      lightingColor: "#9BB6FF18"
    - type: CFGOAP
      tactics: Beast
    - type: CFCombatant
      level: -1
      armorClass: 14
      speedFeet: 20
      maxHp: 8
      currentHp: 8
      printedFortitude: 2
      printedReflex: 7
      printedWill: 5
      printedPerception: 5
      printedAttack: 6
      printedDamage: -3
      trainedSkills:
        - Acrobatics
        - Athletics
        - Stealth
        - Survival
      printedSkills:
        Acrobatics: 5
        Athletics: 1
        Stealth: 5
        Survival: 3
    - type: CFAbilityScore
      abilityModifiers:
        Strength: -3
        Dexterity: 4
        Constitution: 0
        Intelligence: -4
        Wisdom: 1
        Charisma: -2
    # Each Strike with its own printed numbers. With no player in the body the AI picks (CFMonsterAttackSystem).
    - type: CFMonsterAttacks
      attacks:
      - name: fangs
        attack: 6
        dice: 1
        die: 8
        bonus: -3
        damageType: Piercing
        traits: [ Agile, Finesse ]
        onHit:
        - !type:CFExposeAfflictionEffect
          affliction: ViperVenom
    - type: CFCombatOptions
      naturalDice: 1
      naturalDie: 8
      naturalType: Piercing
      naturalAgile: true
      naturalFinesse: true
    - type: CFTrait
      traits:
        - Animal
    - type: MobThresholds
      thresholds:
        0: Alive
        7: Critical
        8: Dead
    # Monster parts: what a harvest gives, sharing the monster's parts value (CFHarvestSystem).
    - type: CFHarvestable
      parts:
        - id: CFFoodMeatMonster
          amount: 1
          maxAmount: 1
