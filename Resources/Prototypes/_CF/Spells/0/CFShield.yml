- type: entity
  parent: CFSpellInstant
  id: CFShield
  name: Shield
  description: +1 circumstance bonus to AC. The shield can block 5 damage once, then the spell ends.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: shield
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: Shield
    rank: 0
  - type: CFTargeting
    filter: All
  - type: CFDegreeEffects
    landed:
    - !type:CFBonusEffect
      stat: ArmorClass
      type: Circumstance
      value: 1
      durationSeconds: 12
    - !type:CFApplyConditionEffect
      condition: SpellShield
      value: 5
