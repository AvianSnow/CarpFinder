# Dire Wolf. Creature 3, Large, Animal. Monster Core p. 350. Recall Knowledge DC 18.
# Jaws with 10 feet of reach and Knockdown, and Pack Attack of 1d6. The stat block lets it choose Grab or
# Knockdown after a hit: here it always knocks down. Not in: Worry, which shakes a creature held in its jaws.
# On the wolf's stock corgi sprite, larger.
- type: entity
  parent: [CFBaseCreature]
  id: CFMobDireWolf
  name: dire wolf
  description: A wolf as tall as a pony at the shoulder, with jaws that reach for you from a stride away.
  components:
    - type: GhostRole
      name: cf-ghost-dire-wolf-name
      description: cf-ghost-dire-wolf-desc
    - type: Sprite
      drawdepth: Mobs
      scale: 1.7, 1.7
      layers:
        - map: ["enum.DamageStateVisualLayers.Base"]
          sprite: Mobs/Pets/corgi.rsi
          state: corgi
    - type: DamageStateVisuals
      states:
        Alive:
          Base: corgi
        Critical:
          Base: corgi_dead
        Dead:
          Base: corgi_dead
    - type: MovementSpeedModifier
      baseWalkSpeed: 3.5
      baseSprintSpeed: 6.3
    - type: CFSenses
      lowLightVision: true
      impreciseFeet: 30
    - type: CFSmeller
    - type: NightVision
      enabled: true
      prioritized: true
      noiseAmount: 0
      lightingColor: "#9BB6FF18"
    - type: CFGOAP
      tactics: Beast
    - type: CFCombatant
      level: 3
      armorClass: 18
      speedFeet: 35
      maxHp: 50
      currentHp: 50
      printedFortitude: 11
      printedReflex: 8
      printedWill: 8
      printedPerception: 10
      printedAttack: 12
      printedDamage: 5
      trainedSkills:
        - Acrobatics
        - Athletics
        - Stealth
        - Survival
      printedSkills:
        Acrobatics: 8
        Athletics: 10
        Stealth: 8
        Survival: 10
    - type: CFAbilityScore
      abilityModifiers:
        Strength: 5
        Dexterity: 3
        Constitution: 4
        Intelligence: -4
        Wisdom: 3
        Charisma: -2
    # Each Strike with its own printed numbers. With no player in the body the AI picks (CFMonsterAttackSystem).
    - type: CFMonsterAttacks
      attacks:
      - name: jaws
        attack: 12
        dice: 1
        die: 10
        bonus: 5
        damageType: Piercing
        traits: [ Reach ]
        followUp: Knockdown
    - type: CFCombatOptions
      naturalDice: 1
      naturalDie: 10
      naturalType: Piercing
      naturalAgile: false
      naturalFinesse: false
      packAttackDie: 6
    - type: CFTrait
      traits:
        - Animal
    - type: MobThresholds
      thresholds:
        0: Alive
        49: Critical
        50: Dead
    # Monster parts: what a harvest gives, sharing the monster's parts value (CFHarvestSystem).
    - type: CFHarvestable
      parts:
        - id: CFFoodMeatMonster
          amount: 2
          maxAmount: 3
        - id: CFLeather1
          amount: 2
          maxAmount: 3
