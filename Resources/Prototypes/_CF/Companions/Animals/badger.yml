# Young Badger. Ancestry Hit Points 8. At 1st level that is 16 Hit Points.
- type: cfPet
  id: CFPetBadger
  name: Badger
  kind: Companion
  entity: CFCompanionBadger
  size: "Small"
  strength: 2
  dexterity: 2
  constitution: 2
  intelligence: -4
  wisdom: 2
  charisma: 0
  hitPoints: 8
  description: "A young badger companion."
  speeds:
    - name: Speed
      feet: 25
    - name: burrow
      feet: 10
    - name: climb
      feet: 10
  senses:
    - "low-light vision"
    - "scent (imprecise, 30 feet)"
  attacks:
    - name: "Jaws"
      die: 8
      damage: piercing
    - name: "Claw"
      die: 6
      damage: slashing
      agile: true
  skills:
    - name: Survival
      ability: Wisdom
  support: "Until your next turn, a creature it threatens that you damage cannot Step until it leaves that square."
  advanced: "Badger Rage"

- type: entity
  parent: [ SimpleMobBase, CFCompanionBase ]
  id: CFCompanionBadger
  name: badger companion
  description: "A young badger companion."
  suffix: Companion
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: companion
      sprite: _CF/Mobs/companion-default.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: companion
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: HTN
    rootTask:
      task: CFCompanionCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 15
    maxHp: 16
    currentHp: 16
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 2
      Dexterity: 2
      Constitution: 2
      Intelligence: -4
      Wisdom: 2
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 8
    naturalType: piercing
    naturalFinesse: false
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      16: Dead
