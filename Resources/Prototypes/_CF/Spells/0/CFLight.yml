- type: entity
  parent: CFSpellObject
  id: CFLight
  name: Light
  description: An orb of light floats with a creature or object. Cast it on your own light to dismiss it.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: Light
    rank: 0
  - type: CFTargeting
    rangeFeet: 120
    filter: All
  - type: CFDegreeEffects
    landed:
    - !type:CFLightEffect
  - type: TargetAction
    range: 24
  - type: EntityTargetAction
    canTargetSelf: true
