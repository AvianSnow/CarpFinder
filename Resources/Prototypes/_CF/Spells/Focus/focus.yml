- type: entity
  parent: CFSpellInstant
  id: CFShieldsOfTheSpirit
  name: Shields of the Spirit
  description: Raise your shield. For 6 seconds, allies in your aura have +1 status bonus to AC, and an enemy that attacks one takes 1d4 spirit damage. Costs a Focus Point.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
