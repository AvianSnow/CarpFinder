# Pathfinder 2e Remaster damage types (cfDamageType).
# ss14Type is only written to stock SS14 objects (doors, crates). Carpfinder HP is the source of truth for creatures.
# Lookups ignore case, so existing `damageType: slashing` strings resolve to Slashing.

# Physical

- type: cfDamageType
  id: Bludgeoning
  name: cf-damage-bludgeoning
  category: Physical
  ss14Type: Blunt
  color: "#A0AAB2"
  hitSound:
    path: /Audio/Weapons/smash.ogg
  aliases: [ blunt ]

- type: cfDamageType
  id: Piercing
  name: cf-damage-piercing
  category: Physical
  ss14Type: Piercing
  color: "#C82A2A"
  hitSound:
    path: /Audio/Weapons/bladeslice.ogg
  aliases: [ pierce ]

- type: cfDamageType
  id: Slashing
  name: cf-damage-slashing
  category: Physical
  ss14Type: Slash
  color: "#FF3333"
  hitSound:
    path: /Audio/Weapons/bladeslice.ogg
  aliases: [ slash ]

