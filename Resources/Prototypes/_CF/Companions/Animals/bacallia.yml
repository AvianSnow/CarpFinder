# Young Bacallia. Ancestry Hit Points 8. At 1st level that is 16 Hit Points.
- type: cfPet
  id: CFPetBacallia
  name: Bacallia
  kind: Companion
  entity: CFCompanionBacallia
  size: "Medium"
  strength: 2
  dexterity: 2
  constitution: 2
  intelligence: -4
  wisdom: 1
  charisma: 1
  hitPoints: 8
  description: "A young bacallia companion. It is built to be ridden. It ignores one temperature extreme, chosen when you gain it."
  mount: true
  speeds:
    - name: Speed
      feet: 40
  senses:
    - "low-light vision"
  attacks:
    - name: "Foot"
      die: 8
      damage: bludgeoning
  skills:
    - name: Survival
      ability: Wisdom
  support: "Until your next turn, a creature in its reach that you damage is dazzled."
  advanced: "Spit"

- type: entity
  parent: [ SimpleMobBase, CFCompanionBase ]
  id: CFCompanionBacallia
  name: bacallia companion
  description: "A young bacallia companion. It is built to be ridden. It ignores one temperature extreme, chosen when you gain it."
  suffix: Companion
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: companion
      sprite: _CF/Mobs/companion-default.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: companion
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: HTN
    rootTask:
      task: CFGOAPCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 15
    maxHp: 16
    currentHp: 16
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 2
      Dexterity: 2
      Constitution: 2
      Intelligence: -4
      Wisdom: 1
      Charisma: 1
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 8
    naturalType: bludgeoning
    naturalFinesse: false
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      16: Dead
