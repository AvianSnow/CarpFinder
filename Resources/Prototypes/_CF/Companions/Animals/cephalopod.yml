# Young Cephalopod. Ancestry Hit Points 6. At 1st level that is 14 Hit Points.
- type: cfPet
  id: CFPetCephalopod
  name: Cephalopod
  kind: Companion
  entity: CFCompanionCephalopod
  size: "Small"
  strength: 2
  dexterity: 3
  constitution: 2
  intelligence: -4
  wisdom: 1
  charisma: 0
  hitPoints: 6
  description: "A young cephalopod companion."
  speeds:
    - name: Speed
      feet: 10
    - name: swim
      feet: 30
  senses:
    - "low-light vision"
  attacks:
    - name: "Beak"
      die: 6
      damage: piercing
      finesse: true
    - name: "Arm"
      die: 4
      damage: bludgeoning
      agile: true
      finesse: true
  skills:
    - name: Stealth
      ability: Dexterity
  support: "Until your next turn, a creature in its reach that you damage takes a -1 circumstance penalty to attack rolls."
  advanced: "Crushing Embrace"

- type: entity
  parent: [ SimpleMobBase, CFCompanionBase ]
  id: CFCompanionCephalopod
  name: cephalopod companion
  description: "A young cephalopod companion."
  suffix: Companion
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: companion
      sprite: _CF/Mobs/companion-default.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: companion
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: HTN
    rootTask:
      task: CFGOAPCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 16
    maxHp: 14
    currentHp: 14
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 2
      Dexterity: 3
      Constitution: 2
      Intelligence: -4
      Wisdom: 1
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 6
    naturalType: piercing
    naturalFinesse: true
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      14: Dead
