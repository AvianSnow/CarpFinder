    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 1
  - type: CFSpell
    spell: GustOfWind
    rank: 1
  - type: CFAreaEffect
    shape: Line
    sizeFeet: 60
  - type: CFCheck
    defense: Fortitude
  - type: CFDegreeEffects
    effects:
