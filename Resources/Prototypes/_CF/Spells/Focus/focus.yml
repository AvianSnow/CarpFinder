# Grave spells. Each is cast on one of your own thralls.

- type: entity
  parent: CFSpellTarget
  id: CFNecroticBomb
  name: Necrotic Bomb
  description: A thrall explodes for 1d12 void, basic Fortitude, in 10 feet. Costs a Focus Point.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 2
  - type: CFSpell
    spell: NecroticBomb
    rank: 0
    focus: true
  - type: CFTargeting
    rangeFeet: 30
    filter: All
  - type: EntityTargetAction
    whitelist:
      components:
      - CFThrall
  - type: CFHeighten
    baseRank: 1
    interval: 1
  - type: CFDegreeEffects
    landed:
    - !type:CFThrallBlastEffect
      shape: Burst
      sizeFeet: 10
      defense: Fortitude
      effects:
      - !type:CFDamageEffect
        dice: 1
        die: 12
        damageType: Void
        heightenDice: 1

