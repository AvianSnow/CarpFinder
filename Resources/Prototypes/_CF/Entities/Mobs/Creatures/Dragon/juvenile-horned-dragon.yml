# Juvenile Horned Dragon. Creature 4, Medium, Amphibious Dragon. Beginner Box Adventure (on Demiplane; Archives of Nethys
# only has the young, adult and ancient horned dragons of Monster Core). Recall Knowledge DC 19.
# The stat block lists no languages. These are the horned dragon family's from Monster Core, so a party can talk to it.
# Its Strikes are on CFMonsterAttacks: jaws +14 (2d8+4 piercing), claw +14 (2d6+4 slashing, agile), tail +12
# (1d8+4 bludgeoning, reach 10 feet) and horn +12 (1d12+4 bludgeoning). The poison on the jaws is not in.
# Poison Breath (CFActPoisonBreath in Actions/breath.yml) and Draconic Momentum are in. The breath is a toxic cloud that
# spreads over the cone in about 2 seconds; anyone standing where it has thickened rolls, once, and it fades after.
# Not in yet: Draconic Frenzy, the Twisting Tail reaction, and its fly 30 feet and swim 20 feet Speeds.
# It keeps a lair (CFGOAPLair): where it spawns is home. It breathes on whoever the cone would catch whenever its breath is
# charged, and goes for anyone it sees or is hurt by anywhere in its lair, which reaches 30 tiles from that spot. Past
# the edge of the lair it turns back at once. It used to wait for whoever came within 3 tiles, so casters stood off and
# shot it where it sat (changed 26 November 2026).
# Sprite: _CF/Mobs/Monsters/Dragon/horned_dragon.rsi, made for CarpFinder, 64x64, so it is drawn about two tiles wide.
- type: entity
  parent: [CFBaseCreature]
  id: CFMobJuvenileHornedDragon
  name: juvenile horned dragon
  description: A young green dragon with a pair of heavy horns, still small enough to fit through a door. It watches you as if weighing what you know.
  components:
    - type: GhostRole
      name: cf-ghost-juvenile-horned-dragon-name
      description: cf-ghost-juvenile-horned-dragon-desc
    - type: Sprite
      drawdepth: Mobs
      layers:
        - map: ["enum.DamageStateVisualLayers.Base"]
          sprite: _CF/Mobs/Monsters/Dragon/horned_dragon.rsi
          state: alive
    - type: DamageStateVisuals
      states:
        Alive:
          Base: alive
        Critical:
          Base: dead
        Dead:
          Base: dead
    - type: CFLanguages
      known: [ Common, Draconic ]
    - type: MovementSpeedModifier
      baseWalkSpeed: 2.5
      baseSprintSpeed: 4.5
    - type: NightVision
      enabled: true
      prioritized: true
      noiseAmount: 0
      lightingColor: "#9BB6FF30"
    - type: ActionGrant
      actions:
        - CFActPoisonBreath
    - type: CFDraconicMomentum
    - type: CFGOAPLair
      engageTiles: 30
      leashTiles: 30
    # It is the boss of its adventure, and a thinker, so it sizes everyone up and does not wait as long between bites.
    # It keeps its own lists, so an encounter cannot send it chasing or fleeing out of its lair.
    - type: CFGOAP
      tactics: Tactician
      homeRange: 30
      keepOwnLists: true
      goals:
        - PutOutFire
        - ReturnToLair
        - KillTarget
        - HuntTarget
        - Investigate
        - GoHome
        - Idle
      actions:
        - Breathe
        - Strike
        - Close
        - Await
        - Demoralize
        - HoldBack
        - FollowScent
        - GoToLkp
        - CheckNode
        - LookAround
        - GoHome
        - Wander
        - PutOutFire
    - type: CFSenses
      darkvision: true
      impreciseFeet: 60
    - type: CFCombatant
      level: 4
      armorClass: 20
      speedFeet: 25
      maxHp: 60
      currentHp: 60
      thinkingTimer: 0.1
      printedFortitude: 11
      printedReflex: 11
      printedWill: 9
      printedPerception: 11
      # Jaws +14, 2d8+4 piercing.
      printedAttack: 14
      printedDamage: 4
      trainedSkills:
        - Acrobatics
        - Arcana
        - Athletics
        - Deception
        - Diplomacy
        - Intimidation
        - Nature
        - Occultism
        - Society
        - Stealth
      printedSkills:
        Acrobatics: 8
        Arcana: 11
        Athletics: 12
        Deception: 9
        Diplomacy: 11
        Intimidation: 11
        Nature: 9
        Occultism: 12
        Society: 9
        Stealth: 10
    - type: CFAbilityScore
      abilityModifiers:
        Strength: 4
        Dexterity: 1
        Constitution: 3
        Intelligence: 1
        Wisdom: 1
        Charisma: 3
    # Each Strike with its own printed numbers. With no player in the body the AI picks (CFMonsterAttackSystem).
    - type: CFMonsterAttacks
      attacks:
      - name: jaws
        attack: 14
        dice: 2
        die: 8
        bonus: 4
        damageType: Piercing
      - name: claw
        attack: 14
        dice: 2
        die: 6
        bonus: 4
        damageType: Slashing
        traits: [ Agile ]
      - name: tail
        attack: 12
        dice: 1
        die: 8
        bonus: 4
        damageType: Bludgeoning
        traits: [ Reach ]
      - name: horn
        attack: 12
        dice: 1
        die: 12
        bonus: 4
        damageType: Bludgeoning
    - type: CFCombatOptions
      naturalDice: 2
      naturalDie: 8
      naturalType: Piercing
    - type: CFTrait
      traits:
        - Amphibious
        - Dragon
    # Immune to poison and sleep.
    - type: CFResistances
      entries:
        - damageType: Poison
          amount: 9999
    # Immunities: paralyzed, poison, sleep.
    - type: CFConditionImmunity
      conditions:
        - Asleep
        - Paralyzed
      traits: [ Poison, Sleep ]
    - type: MobThresholds
      thresholds:
        0: Alive
        59: Critical
        60: Dead
    # Monster parts: what a harvest gives, sharing the monster's parts value (CFHarvestSystem).
    - type: CFHarvestable
      parts:
        - id: CFFoodMeatMonster
          amount: 2
          maxAmount: 4
        - id: CFLeather1
          amount: 2
          maxAmount: 4
        - id: CFBone1
          amount: 2
          maxAmount: 3
