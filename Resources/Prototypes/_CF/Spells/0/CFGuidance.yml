- type: entity
  parent: CFSpellTarget
  id: CFGuidance
  name: Guidance
  description: The target gains a +1 status bonus to attack rolls.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: Guidance
    rank: 0
  # The Infinite Eye's amp is a reaction that saves a failed check. Here the amped spell guides every roll for 6 seconds.
  - type: CFPsiCantrip
    ampEffects:
    - !type:CFBonusEffect
      stat: Saves
      type: Status
      value: 1
      durationSeconds: 6
    - !type:CFBonusEffect
      stat: SkillChecks
      type: Status
      value: 1
      durationSeconds: 6
    - !type:CFBonusEffect
      stat: Perception
      type: Status
      value: 1
      durationSeconds: 6
  - type: CFTargeting
    rangeFeet: 30
    filter: All
  - type: CFDegreeEffects
    landed:
    - !type:CFBonusEffect
      stat: AttackRoll
      type: Status
      value: 1
  - type: EntityTargetAction
    canTargetSelf: true
