- type: entity
  parent: CFSpellTarget
  id: CFVoidWarp
  name: Void Warp
  description: The target takes 2d4 void damage. Fortitude save.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: VoidWarp
    rank: 0
  - type: CFTargeting
    rangeFeet: 30
  - type: CFCheck
    defense: Fortitude
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 2
      die: 4
      damageType: Void
      heightenDice: 1
  - type: CFHeighten
    baseRank: 1
    interval: 2
