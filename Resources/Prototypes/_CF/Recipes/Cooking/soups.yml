# Dishes a pot, pan or pie plate makes. From CP14's Recipes/Cooking.

- type: cookingRecipe
  id: InedibleSoup
  foodType: Soup
  foodData:
    name: cf-soup-recipe-trash-name
    desc: cf-soup-recipe-trash-desc
    visuals:
    - sprite: _CP14/Objects/Consumable/Food/Soups/misc.rsi
      state: trash
  requirements:
  - !type:CFAlwaysMet

# 1 req

