# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Investigator
  name: cf-class-investigator
  description: cf-class-description-investigator
  hitPoints: 8
  keyAbility: Intelligence
  hitPointsAbility: Constitution
  classDC: cf-class-investigator
  bonusSkillFeats: [ 3, 5 ]
  proficiencies:
    perception:
      expert:
        - Perception
    savingThrows:
      trained:
        - Fortitude
      expert:
        - Reflex
        - Will
    skills:
      trained:
        - Society
    attacks:
      trained:
        - MartialWeapons
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - LightArmor
  additionalSkillTrainings: 4
  features:
    - level: 1
      name: "Devise a Stratagem"
      description: "Point at an enemy to Devise a Stratagem. Your next Strike against that creature uses the stored d20."
      grants:
        - !type:CFGrantOption
          option: Devise
        - !type:CFGrantOption
          pointMark: Stratagem
    - level: 1
      name: "Methodology"
      description: "Choose a methodology in the builder. It trains a skill and shapes your feats."
    - level: 1
      name: "On the Case"
      description: "Pursue a Lead and Clue In need investigations, which do not exist: TBA"
    - level: 1
      name: "Strategic Strike"
      description: "A Strike that uses your stored Devise a Stratagem roll adds Intelligence to the attack in place of Strength or Dexterity, when that is better, and deals 1d6 extra precision damage, or 2d6 from level 5. It has to be a ranged weapon, or an agile or finesse attack in melee or thrown."
      grants:
        - !type:CFGrantOption
          option: StrategicStrike
    - level: 3
      name: "Keen Recollection"
      description: "A skill you are untrained in adds your level when you Recall Knowledge."
      grants:
        - !type:CFGrantOption
          option: KeenRecollection
    - level: 3
      name: "Skillful Lessons"
      description: "An extra skill feat at levels 3 and 5. The rules limit it to Intelligence, Wisdom and Charisma skills and your methodology's skill: here any skill feat fits."
    - level: 5
      name: "Weapon Expertise"
      description: "Expert with simple weapons, martial weapons and unarmed attacks."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - SimpleWeapons
            - MartialWeapons
            - Unarmed
          rank: Expert
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
