# Where each CF job appears at round start. Every job on a map needs one, or the map fails its stock load test.

- type: entity
  parent: SpawnPointJobBase
  id: CFSpawnPointAlpha
  name: Alpha spawn
  components:
  - type: SpawnPoint
    job_id: CFAlpha
  - type: Sprite
    layers:
    - state: green
    - state: passenger

