# Vegetables and their slices, from CP14 through .agent/port-scripts/produce.py. Put fixes in the script.

- type: entity
  id: CFFoodCabbage
  parent: FoodInjectableBase
  categories: [ ForkFiltered ]
  name: cabbage
  description: Green edible ball.
  components:
  - type: Item
    size: Normal
  - type: FlavorProfile
    flavors:
      - cabbage
  - type: Sprite
    sprite: _CP14/Objects/Flora/Farm/cabbage.rsi
    layers:
      - state: base1
        map: [ "random" ]
  - type: RandomSprite
    available:
      - random:
          base1: ""
          base2: ""
          base3: ""
  - type: Solution
    solution:
      maxVol: 12
      reagents:
      - ReagentId: Nutriment
        Quantity: 3
      - ReagentId: Vitamin
        Quantity: 0.5
  - type: ToolRefinable
    qualityNeeded: Slicing
    verbText: refined-slice-verb-name
    refineTime: 1.5
    refineResult:
    - id: CFFoodCabbageSlice
      amount: 4
  - type: Tag
    tags:
    - CFFarmFood
    - CFVegetable
    - CFSalad
    - CFCabbage
  - type: CFItemPrice
    copper: 3

