- type: entity
  parent: CFSpellProjectile
  id: CFTangleVine
  name: Tangle Vine
  description: Spell attack for 2d4 bludgeoning. A hit immobilizes the target.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: TangleVine
    rank: 0
  - type: CFTargeting
    rangeFeet: 30
  - type: CFCheck
    defense: ArmorClass
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 2
      die: 4
      damageType: Bludgeoning
      heightenDice: 1
    landed:
    - !type:CFApplyConditionEffect
      condition: Immobilized
  - type: CFHeighten
    baseRank: 1
    interval: 2
