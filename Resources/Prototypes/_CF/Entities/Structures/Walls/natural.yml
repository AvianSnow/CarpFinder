- type: entity
  id: CFWallStone
  name: rock
  parent: CFBaseWall
  description: A solid stone natural wall. It has a cave-like coldness to it.
  components:
    - type: Sprite
      sprite: _CP14/Structures/Walls/Natural/cave_stone.rsi
    - type: Icon
      sprite: _CP14/Structures/Walls/Natural/cave_stone.rsi
    - type: IconSmooth
      states:
        - !type:CornerSpriteSmoothing
          mask: [CFWall]
          base: wall
    - type: Damageable
      damageContainer: StructuralInorganic
      damageModifierSet: CFRockStructural
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 150
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]
        - trigger: !type:DamageTrigger
            damage: 50
          behaviors:
            - !type:PlaySoundBehavior
              sound:
                path: /Audio/Effects/break_stone.ogg
                params:
                  volume: -6
            - !type:SpawnEntitiesBehavior
              spawn:
                CFStoneBlock1:
                  min: 5
                  max: 7
            - !type:DoActsBehavior
              acts: ["Destruction"]

