# Young Ape. Ancestry Hit Points 8. At 1st level that is 16 Hit Points.
- type: cfPet
  id: CFPetApe
  name: Ape
  kind: Companion
  entity: CFCompanionApe
  size: "Small"
  strength: 3
  dexterity: 1
  constitution: 2
  intelligence: -4
  wisdom: 2
  charisma: 0
  hitPoints: 8
  description: "A young ape companion."
  speeds:
    - name: Speed
      feet: 25
    - name: climb
      feet: 25
  senses:
    - "low-light vision"
  attacks:
    - name: "Fist"
      die: 8
      damage: bludgeoning
  skills:
    - name: Intimidation
      ability: Charisma
  support: "Until your next turn, a creature in its reach that you damage becomes frightened 1."
  advanced: "Frightening Display"

- type: entity
  parent: [ MobGorilla, CFCompanionBase ]
  id: CFCompanionApe
  name: ape companion
  description: "A young ape companion."
  suffix: Companion
  components:
  - type: HTN
    rootTask:
      task: CFGOAPCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 14
    maxHp: 16
    currentHp: 16
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 3
      Dexterity: 1
      Constitution: 2
      Intelligence: -4
      Wisdom: 2
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 8
    naturalType: bludgeoning
    naturalFinesse: false
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      16: Dead
