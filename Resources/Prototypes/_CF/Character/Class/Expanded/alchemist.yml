# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Alchemist
  name: cf-class-alchemist
  description: cf-class-description-alchemist
  hitPoints: 8
  keyAbility: Intelligence
  hitPointsAbility: Constitution
  classDC: cf-class-alchemist
  proficiencies:
    perception:
      trained:
        - Perception
    savingThrows:
      trained:
        - Will
      expert:
        - Fortitude
        - Reflex
    skills:
      trained:
        - Crafting
    attacks:
      trained:
        - SimpleWeapons
        - Unarmed
        - AlchemicalWeapons
    defenses:
      trained:
        - Unarmored
        - MediumArmor
        - LightArmor
  additionalSkillTrainings: 3
  features:
    - level: 1
      name: "Alchemy"
      description: "You start with two minor healing potions."
      grants:
        - !type:CFGrantItem
          item: CFHealingPotionMinor
          count: 2
    - level: 1
      name: "Research Field"
      description: "Choose a research field in the builder. What each field does needs versatile vials and Quick Alchemy: TBA"
    - level: 5
      name: "Field Discovery"
      description: "A benefit from your research field: TBA"
    - level: 5
      name: "Powerful Alchemy"
      description: "Infused items use your class DC. Infused items do not exist yet: TBA"
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
