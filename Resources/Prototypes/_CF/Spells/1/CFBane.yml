- type: entity
  parent: CFSpellArea
  id: CFBane
  name: Bane
  description: Enemies that fail a Will save take -1 to attack rolls and saves.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 1
  - type: CFSpell
    spell: Bane
    rank: 1
  - type: CFAreaEffect
    shape: Emanation
    sizeFeet: 5
  - type: CFCheck
    defense: Will
    basicSave: false
  - type: CFDegreeEffects
    landed:
    - !type:CFBonusEffect
      stat: AttackRoll
      type: Status
      value: -1
    - !type:CFBonusEffect
      stat: Saves
      type: Status
      value: -1
