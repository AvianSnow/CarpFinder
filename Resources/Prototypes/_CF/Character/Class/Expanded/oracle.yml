# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Oracle
  name: cf-class-oracle
  description: cf-class-description-oracle
  hitPoints: 8
  keyAbility: Charisma
  hitPointsAbility: Constitution
  classDC: cf-class-oracle
  proficiencies:
    perception:
      trained:
        - Perception
    savingThrows:
      trained:
        - Fortitude
        - Reflex
      expert:
        - Will
    skills:
      trained:
        - Religion
    attacks:
      trained:
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - LightArmor
  additionalSkillTrainings: 3
  spellcasting:
    tradition: Divine
    ability: Charisma
    cantrips: 5
    slots:
      - 3
    laterSlots:
      - [ 4 ]
      - [ 4, 3 ]
      - [ 4, 4 ]
      - [ 4, 4, 3 ]
  features:
    - level: 1
      name: "Mystery"
      description: "Choose a mystery in the builder. It trains a skill and teaches a cantrip and sometimes a rank 1 spell."
    - level: 1
      name: "Oracle Spellcasting"
      description: "Level 1 cantrips and spell slots are on the spell sheet."
    - level: 1
      name: "Oracular Curse"
      description: "Your curse and the cursebound condition: TBA"
    - level: 1
      name: "Revelation Spells"
      description: "Focus spells from your mystery: TBA"
    - level: 1
      name: "Spell Repertoire"
      description: "Level 1 cantrips and spell slots are on the spell sheet."
    - level: 3
      name: "Signature Spells"
      description: "Choose one spell of each rank. You can cast it at any rank you have a slot for, without learning it there."
      choiceTitle: cf-class-feature-signature-spells
      choices:
        - kind: SignatureSpell
          spellRank: 1
        - kind: SignatureSpell
          spellRank: 2
        - kind: SignatureSpell
          spellRank: 3
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
