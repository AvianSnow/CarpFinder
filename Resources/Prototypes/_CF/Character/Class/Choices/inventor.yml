      options: [ CFLongsword, CFDagger, CFRapier, CFScimitar, CFGreatsword, CFBattleAxe, CFWarhammer, CFFlail, CFWarFlail, CFSpear, CFHatchet, CFSickle, CFLightHammer, CFPick, CFStaff, CFShortbow, CFLongbow, CFCrossbow, CFHeavyCrossbow, CFSling, CFFlintlockPistol, CFFlintlockMusket, CFArquebus, CFBlunderbuss, CFHandCannon ]
