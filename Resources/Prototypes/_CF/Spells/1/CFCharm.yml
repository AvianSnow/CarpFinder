- type: entity
  parent: CFSpellTarget
  id: CFCharm
  name: Charm
  description: On a failed Will save the target's attitude toward you improves.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 1
  - type: CFSpell
    spell: Charm
    rank: 1
  - type: CFTargeting
    rangeFeet: 30
  - type: CFCheck
    defense: Will
    basicSave: false
  - type: CFDegreeEffects
    landed:
    - !type:CFApplyConditionEffect
      condition: Charmed
