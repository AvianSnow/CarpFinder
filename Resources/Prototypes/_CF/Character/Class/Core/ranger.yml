# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Ranger
  name: cf-class-ranger
  description: cf-class-description-ranger
  hitPoints: 10
  keyAbility: Dexterity
  hitPointsAbility: Constitution
  classDC: cf-class-ranger
  proficiencies:
    perception:
      expert:
        - Perception
    savingThrows:
      trained:
        - Will
      expert:
        - Fortitude
        - Reflex
    skills:
      trained:
        - Survival
    attacks:
      trained:
        - MartialWeapons
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - MediumArmor
        - LightArmor
  additionalSkillTrainings: 4
  features:
    - level: 1
      name: "Hunt Prey"
      description: "Point at an enemy to hunt it. What that does is your Hunter's Edge."
      grants:
        - !type:CFGrantOption
          pointMark: Prey
    - level: 1
      name: "Hunter's Edge"
      description: "Choose Flurry, Outwit or Precision with the Hunter's Edge button."
    - level: 3
      name: "Will Expertise"
      description: "Expert in Will saves."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Will
          rank: Expert
    - level: 5
      name: "Ranger Weapon Expertise"
      description: "Expert with simple weapons, martial weapons and unarmed attacks. Critical specialization against your prey: TBA"
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - SimpleWeapons
            - MartialWeapons
            - Unarmed
          rank: Expert
    - level: 5
      name: "Trackless Journey"
      description: "Being hard to track in natural terrain: TBA"
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
