# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Summoner
  name: cf-class-summoner
  description: cf-class-description-summoner
  hitPoints: 10
  keyAbility: Charisma
  hitPointsAbility: Constitution
  classDC: cf-class-summoner
  proficiencies:
    perception:
      trained:
        - Perception
    savingThrows:
      trained:
        - Reflex
      expert:
        - Fortitude
        - Will
    attacks:
      trained:
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
  additionalSkillTrainings: 3
  spellcasting:
    tradition: Occult
    ability: Charisma
    cantrips: 5
    slots:
      - 1
    laterSlots:
      - [ 2 ]
      - [ 2, 1 ]
      - [ 2, 2 ]
      - [ 2, 2, 1 ]
  features:
    - level: 1
      name: "Eidolon"
      description: "Choose your eidolon, its key attribute and its attack in the builder. Manifest Eidolon brings it to your side. You share Hit Points, and it stays within 100 feet. Point at an enemy to send it, and a ghost can take it over. Act Together and Share Senses: TBA"
      grants:
        - !type:CFGrantAction
          action: CFActManifestEidolon
    - level: 1
      name: "Evolution Feat"
      description: "You pick an evolution feat for your eidolon, as your level 1 class feat."
    - level: 1
      name: "Link Spells"
      description: "You know Boost Eidolon and Evolution Surge."
      grants:
        - !type:CFGrantSpell
          spell: BoostEidolon
        - !type:CFGrantFocusSpell
          spell: EvolutionSurge
    - level: 1
      name: "Spell Repertoire"
      description: "Level 1 cantrips and spell slots are on the spell sheet."
    - level: 1
      name: "Summoner Spellcasting"
      description: "Level 1 cantrips and spell slots are on the spell sheet."
    - level: 3
      name: "Shared Vigilance"
      description: "Expert in Perception, for you and your eidolon."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Perception
          rank: Expert
    - level: 3
      name: "Signature Spells"
      description: "Heighten chosen spells freely. Casting from a higher slot does not exist yet: TBA"
    - level: 5
      name: "Eidolon Unarmed Expertise"
      description: "Your eidolon is expert with its unarmed attacks."
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
