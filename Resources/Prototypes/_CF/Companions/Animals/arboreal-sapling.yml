# Young Arboreal Sapling. Ancestry Hit Points 8. At 1st level that is 16 Hit Points.
- type: cfPet
  id: CFPetArborealSapling
  name: Arboreal Sapling
  kind: Companion
  entity: CFCompanionArborealSapling
  size: "Small"
  strength: 3
  dexterity: 1
  constitution: 2
  intelligence: -4
  wisdom: 2
  charisma: 0
  hitPoints: 8
  description: "A young arboreal sapling companion."
  speeds:
    - name: Speed
      feet: 25
  senses:
    - "low-light vision"
  attacks:
    - name: "Branch"
      die: 8
      damage: bludgeoning
  skills:
    - name: Stealth
      ability: Dexterity
  support: "Until your next turn, the first square a damaged creature in its reach enters is difficult terrain."
  advanced: "Throw Rock"

- type: entity
  parent: [ SimpleMobBase, CFCompanionBase ]
  id: CFCompanionArborealSapling
  name: arboreal sapling companion
  description: "A young arboreal sapling companion."
  suffix: Companion
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: companion
      sprite: _CF/Mobs/companion-default.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: companion
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: HTN
    rootTask:
      task: CFCompanionCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 14
    maxHp: 16
    currentHp: 16
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 3
      Dexterity: 1
      Constitution: 2
      Intelligence: -4
      Wisdom: 2
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 8
    naturalType: bludgeoning
    naturalFinesse: false
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      16: Dead
