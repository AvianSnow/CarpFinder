# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Animist
  name: cf-class-animist
  description: cf-class-description-animist
  hitPoints: 8
  keyAbility: Wisdom
  hitPointsAbility: Constitution
  classDC: cf-class-animist
  proficiencies:
    perception:
      trained:
        - Perception
    savingThrows:
      trained:
        - Fortitude
        - Reflex
      expert:
        - Will
    skills:
      trained:
        - Religion
    attacks:
      trained:
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - MediumArmor
        - LightArmor
  additionalSkillTrainings: 2
  spellcasting:
    tradition: Divine
    ability: Wisdom
    cantrips: 2
    slots:
      - 1
    prepared: true
  features:
    - level: 1
      name: "Animist & Apparition Spellcasting"
      description: "You prepare divine spells, and also have apparition slots, spent like a spontaneous caster, for the spells your apparitions know."
      grants:
        - !type:CFGrantApparitionSlots
          rank: 1
    - level: 1
      name: "Animistic Practice"
      description: "Choose a practice in the builder."

    - level: 1
      name: "Apparition Attunement"
      description: "Choose two apparitions in the builder. Each teaches you a Lore and spells, and your primary one gives you its vessel spell. Changing primary when you Refocus: TBA"

    - level: 3
      name: "Fortitude Expertise"
      description: "Expert in Fortitude saves."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Fortitude
          rank: Expert
    - level: 2
      name: "Apparition Slot"
      description: "Another apparition spell slot."
      grants:
        - !type:CFGrantApparitionSlots
          rank: 1
    - level: 3
      name: "Apparition Slot"
      description: "Another apparition spell slot."
      grants:
        - !type:CFGrantApparitionSlots
          rank: 2
    - level: 4
      name: "Apparition Slot"
      description: "Another apparition spell slot."
      grants:
        - !type:CFGrantApparitionSlots
          rank: 2
    - level: 5
      name: "Apparition Slot"
      description: "Another apparition spell slot."
      grants:
        - !type:CFGrantApparitionSlots
          rank: 3
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
