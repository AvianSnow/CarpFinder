- type: constructionGraph
  id: CFWindowMarbleBrick
  start: start
  graph:
    - node: start
      edges:
        - to: CFWindowFrameMarbleBrick
          completed:
            - !type:SnapToGrid
              southRotation: true
          steps:
            - material: CFMarbleStone
              amount: 2
              doAfter: 2

    - node: CFWindowFrameMarbleBrick
      entity: CFWindowFrameMarbleBrick
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: CFMarbleBlock1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Prying
              doAfter: 2
        - to: CFWindowMarbleBrick
          steps:
            - material: CFGlassSheet
              amount: 2
              doAfter: 2

    - node: CFWindowMarbleBrick
      entity: CFWindowMarbleBrick
      edges:
        - to: CFWindowFrameMarbleBrick
          steps:
            - tool: Screwing
              doAfter: 1
            - tool: Anchoring
              doAfter: 2
          completed:
            - !type:SpawnPrototype
              prototype: CFGlassSheet1
              amount: 2

    - node: CFWindowMarbleBrickBroken
      entity: CFWindowMarbleBrickBroken
      edges:
        - to: CFWindowFrameMarbleBrick
          steps:
            - tool: Anchoring
              doAfter: 2
          completed:
            - !type:SpawnPrototype
              prototype: CFGlassShard
              amount: 1
