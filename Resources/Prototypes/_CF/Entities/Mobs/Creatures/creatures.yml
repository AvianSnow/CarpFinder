# Monster Core creatures on CP14 bodies. Numbers are the printed stat blocks, checked on Archives of Nethys.
# Copy one for a new creature. printedAttack and printedDamage are the melee Strike's +N and +M in "+N, 1dX+M".

- type: entity
  abstract: true
  parent: [SimpleMobBase, MobCombat]
  id: CFBaseCreature
  suffix: Monster
  categories: [ForkFiltered]
  components:
    - type: InputMover
    - type: MobMover
    - type: HTN
      rootTask:
        task: SimpleHostileCompound
    - type: NpcFactionMember
      factions:
        - SimpleHostile
    - type: CFFaction
      faction: Monster
    - type: Appearance
    - type: MeleeWeapon
      angle: 0
      animation: WeaponArcBite
      attackRate: 1
      soundHit:
        path: /Audio/Effects/bite.ogg
      damage:
        types:
          Piercing: 0

# Giant rat. Creature -1, Small, Animal. Monster Core p. 288. Recall Knowledge DC 13.
# Not in yet: putrid plague, low-light vision, scent, the climb Speed, and +4 Athletics to Climb or Swim.
# It is an animal, so an encounter should set "tactics: Beast".
- type: entity
  parent: CFBaseCreature
  id: CFMobGiantRat
  name: giant rat
  description: A rat the size of a dog, with matted fur and yellow teeth.
  components:
    - type: Sprite
      drawdepth: SmallMobs
      layers:
        - map: ["enum.DamageStateVisualLayers.Base"]
          sprite: _CP14/Mobs/Pets/rat.rsi
          state: rat
    - type: DamageStateVisuals
      states:
        Alive:
          Base: rat
        Critical:
          Base: rat_dead
        Dead:
          Base: rat_dead
    - type: MovementSpeedModifier
      baseWalkSpeed: 3
      baseSprintSpeed: 5.4
    - type: CFCombatant
      level: -1
      armorClass: 12
      speedFeet: 30
      maxHp: 8
      currentHp: 8
      diesAtZeroHp: true
      printedFortitude: 6
      printedReflex: 7
      printedWill: 3
      printedPerception: 5
      printedAttack: 7
      printedDamage: 1
      trainedSkills:
        - Acrobatics
        - Athletics
        - Stealth
      printedSkills:
        Acrobatics: 5
        Athletics: 2
        Stealth: 5
    - type: CFAbilityScore
      abilityModifiers:
        Strength: 0
        Dexterity: 3
        Constitution: 2
        Intelligence: -4
        Wisdom: 1
        Charisma: -3
    - type: CFCombatOptions
      naturalDice: 1
      naturalDie: 4
      naturalType: Piercing
      naturalAgile: true
      naturalFinesse: true
    - type: CFTrait
      traits:
        - Animal
    - type: MobThresholds
      thresholds:
        0: Alive
        7: Critical
        8: Dead

