# Young War Pig. Ancestry Hit Points 8. At 1st level that is 16 Hit Points.
- type: cfPet
  id: CFPetWarPig
  name: War Pig
  kind: Companion
  entity: CFCompanionWarPig
  size: "Large"
  strength: 3
  dexterity: 1
  constitution: 2
  intelligence: -4
  wisdom: 1
  charisma: 1
  hitPoints: 8
  description: "A young war pig companion. It is built to be ridden."
  mount: true
  speeds:
    - name: Speed
      feet: 35
  senses:
    - "low-light vision"
    - "scent (imprecise, 30 feet)"
  attacks:
    - name: "Hoof"
      die: 6
      damage: bludgeoning
      agile: true
    - name: "Tusk"
      die: 8
      damage: piercing
  skills:
    - name: Intimidation
      ability: Charisma
  support: "Until your next turn, a damaging Strike against a creature in its reach makes that creature clumsy 1 until the end of your next turn."
  advanced: "Bucking Frenzy"

- type: entity
  parent: [ MobPig, CFCompanionBase ]
  id: CFCompanionWarPig
  name: war pig companion
  description: "A young war pig companion. It is built to be ridden."
  suffix: Companion
  components:
  - type: HTN
    rootTask:
      task: CFGOAPCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 14
    maxHp: 16
    currentHp: 16
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 3
      Dexterity: 1
      Constitution: 2
      Intelligence: -4
      Wisdom: 1
      Charisma: 1
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 6
    naturalType: bludgeoning
    naturalFinesse: false
    naturalAgile: true
  - type: MobThresholds
    thresholds:
      0: Alive
      16: Dead
