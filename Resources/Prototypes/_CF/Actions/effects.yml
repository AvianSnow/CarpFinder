# Actions that only apply effects. CFEffectActionSystem runs them. Grant one with CFGrantAction.

- type: entity
  parent: CFActivityInstant
  id: CFActExtravagantParry
  name: Extravagant Parry
  description: +1 circumstance bonus to AC for 6 seconds.
  components:
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFBonusEffect
      stat: ArmorClass
      type: Circumstance
      value: 1
      durationSeconds: 6

- type: entity
  parent: CFActivityInstant
  id: CFActTributaryCirculation
  name: Tributary Circulation
  description: +2 circumstance bonus to Will saves and to saves against poison for 6 seconds.
  components:
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFBonusEffect
      stat: Will
      type: Circumstance
      value: 2
      durationSeconds: 6
    - !type:CFBonusEffect
      stat: Saves
      type: Circumstance
      value: 2
      trait: Poison
      durationSeconds: 6

- type: entity
  parent: CFActivityInstant
  id: CFActTranceOfCelerity
  name: Trance of Celerity
  description: +5 feet status bonus to Speed for a minute.
  components:
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFBonusEffect
      stat: Speed
      type: Status
      value: 5
      durationSeconds: 60

- type: entity
  parent: CFActivityTarget
  id: CFActNudgeScales
  name: Nudge the Scales
  description: Cursebound. Heal a creature within 30 feet for 2 Hit Points plus double your level.
  components:
  - type: TargetAction
    range: 6.25
  - type: CFEffectAction
    cursebound: true
  - type: CFDegreeEffects
    effects:
    - !type:CFHealEffect
      flat: 2
      perLevel: 2

- type: entity
  parent: CFActivityTarget
  id: CFActPsiBurst
  name: Psi Burst
  description: A creature within 30 feet takes 1d4 bludgeoning, basic Reflex. The damage grows at levels 3 and 5.
  components:
  - type: TargetAction
    range: 6.25
  - type: CFEffectAction
  - type: CFCheck
    defense: Reflex
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 4
      damageType: Bludgeoning
      diceEveryLevels: 2

- type: entity
  parent: CFActivityTarget
  id: CFActDrainChalice
  name: Drain the Chalice
  description: You or an adjacent ally regain 3 Hit Points per level. The chalice refills in 10 minutes.
  components:
  - type: Action
    useDelay: 600
  - type: EntityTargetAction
    canTargetSelf: true
    whitelist:
      components:
      - MobState
    event: !type:CFActivityTargetEvent
  - type: CFNeedsImplement
    kind: Chalice
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFHealEffect
      perLevel: 3

- type: entity
  abstract: true
  parent: CFActivityTarget
  id: CFActFlingMagicBase
  components:
  - type: TargetAction
    range: 12.25
  - type: CFRadialSlot
    actions: 2
  - type: CFNeedsImplement
    kind: Wand
  - type: CFEffectAction
  - type: CFCheck
    defense: Reflex
    dcSource: Class

- type: entity
  parent: CFActFlingMagicBase
  id: CFActFlingMagicFire
  name: Fling Magic
  description: A creature within 60 feet takes 3d4 fire damage, basic Reflex against your class DC, and 1d4 more at levels 3 and 5. Costs 2 actions.
  components:
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 3
      die: 4
      damageType: Fire
      diceEveryLevels: 2

- type: entity
  parent: CFActFlingMagicBase
  id: CFActFlingMagicCold
  name: Fling Magic
  description: A creature within 60 feet takes 3d4 cold damage, basic Reflex against your class DC, and 1d4 more at levels 3 and 5. Costs 2 actions.
  components:
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 3
      die: 4
      damageType: Cold
      diceEveryLevels: 2

- type: entity
  parent: CFActFlingMagicBase
  id: CFActFlingMagicElectricity
  name: Fling Magic
  description: A creature within 60 feet takes 3d4 electricity damage, basic Reflex against your class DC, and 1d4 more at levels 3 and 5. Costs 2 actions.
  components:
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 3
      die: 4
      damageType: Electricity
      diceEveryLevels: 2

- type: entity
  parent: CFActivityInstant
  id: CFActUnleashPsyche
  name: Unleash Psyche
  description: For 12 seconds, damaging spells with no duration deal double their rank more. Needs a spell cast in the last 6 seconds. Stupefied 1 for 12 seconds after.
  components:
  - type: CFRadialSlot
    group: Free
    actions: 0
  - type: CFUnleashAction

- type: entity
  parent: CFActivityInstant
  id: CFActCalculateThreats
  name: Calculate Threats
  description: While Unleashed, +2 circumstance bonus to AC and Reflex for 6 seconds.
  components:
  - type: CFNeedsUnleashed
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFBonusEffect
      stat: ArmorClass
      type: Circumstance
      value: 2
      durationSeconds: 6
    - !type:CFBonusEffect
      stat: Reflex
      type: Circumstance
      value: 2
      durationSeconds: 6

- type: entity
  parent: CFActivityInstant
  id: CFActFadeIntoDaydreams
  name: Fade into Daydreams
  description: While Unleashed, you are concealed for 6 seconds.
  components:
  - type: CFNeedsUnleashed
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFApplyConditionEffect
      condition: Concealed
      durationSeconds: 6

- type: entity
  parent: CFActivityTarget
  id: CFActRestoreTheMind
  name: Restore the Mind
  description: While Unleashed, an ally within 30 feet regains 2 Hit Points plus double your level, and has +1 status to saves against mental effects for 12 seconds. Once every 10 minutes.
  components:
  - type: Action
    useDelay: 600
  - type: TargetAction
    range: 6.25
  - type: CFNeedsUnleashed
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFHealEffect
      flat: 2
      perLevel: 2
    - !type:CFBonusEffect
      stat: Saves
      type: Status
      value: 1
      trait: Mental
      durationSeconds: 12

- type: entity
  parent: CFActivityInstant
  id: CFActRecallTheTeachings
  name: Recall the Teachings
  description: While Unleashed, an Occultism check against DC 15 that Aids every ally within 30 feet at once, +1 to their attack rolls and skill checks for 6 seconds, +2 on a critical success, -1 on a critical failure.
  components:
  - type: CFNeedsUnleashed
  - type: CFRecallTeachingsAction
  - type: CFTrait
    traits:
    - Occult

- type: entity
  parent: CFActivityInstant
  id: CFActViolentUnleash
  name: Violent Unleash
  description: Right after you Unleash your Psyche, a shock wave batters every creature within 20 feet for 2d6 force damage, basic Reflex, and 1d6 more at level 5 and every 2 levels after.
  components:
  - type: CFNeedsUnleashed
    withinSeconds: 3
  - type: CFEffectAction
  - type: CFTrait
    traits:
    - Occult
  - type: CFAreaEffect
    shape: Emanation
    sizeFeet: 20
  - type: CFCheck
    defense: Reflex
    dcSource: Class
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 6
      damageType: Force
      diceEveryLevels: 2

- type: entity
  parent: CFActivityInstant
  id: CFActOverdrive
  name: Overdrive
  description: A Crafting check. Your Strikes deal extra damage for a minute, based on your Intelligence. Then it needs a minute to cool.
  components:
  - type: Action
    useDelay: 6
  - type: CFOverdriveAction

- type: entity
  parent: CFActivityInstant
  id: CFActExplode
  name: Explode
  description: Your innovation bursts, dealing 2d6 fire damage around it, basic Reflex, and more at level 3 and up. Costs 2 actions. An unstable action.
  components:
  - type: CFRadialSlot
    actions: 2
  - type: CFExplodeAction
  - type: CFAreaEffect
    shape: Burst
    sizeFeet: 5
  - type: CFCheck
    defense: Reflex
    dcSource: Class
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 2
      die: 6
      damageType: Fire
      innovationCore: true
      diceFromLevel: true

# Given by a battle form while it lasts. See CFBattleFormSystem.
- type: entity
  parent: CFActivityInstant
  id: CFActDismissForm
  name: Dismiss Form
  description: Return to your own shape.
  components:
  - type: CFDismissFormAction

- type: entity
  parent: CFActivityInstant
  id: CFActEmblazonArmament
  name: Emblazon Armament
  description: Draw your deity's symbol on the weapon or shield in your active hand. A follower of your deity deals 1 more damage with the weapon, or the shield has 1 more Hardness for them. Your last symbol fades. You can draw another in 10 minutes.
  components:
  - type: Action
    useDelay: 600
  - type: CFRadialSlot
    actions: 3
  - type: CFEmblazonAction

- type: entity
  parent: CFActivityTarget
  id: CFActSearingRestoration
  name: Searing Restoration
  description: A small blast from your innovation closes wounds. You or an adjacent creature regain 1d10 Hit Points, and 1d10 more at level 3 and every 2 levels after, and get a flat check to stop bleeding. An unstable action.
  components:
  - type: EntityTargetAction
    canTargetSelf: true
    whitelist:
      components:
      - MobState
    event: !type:CFActivityTargetEvent
  - type: CFEffectAction
    unstable: true
  - type: CFDegreeEffects
    effects:
    - !type:CFHealEffect
      dice: 1
      die: 10
      diceEveryLevels: 2
    - !type:CFRecoverPersistentEffect
      damageType: Bleed

- type: entity
  parent: CFActivityInstant
  id: CFActTwinParry
  name: Twin Parry
  description: With a melee weapon in each hand, +1 circumstance bonus to AC for 6 seconds.
  components:
  - type: CFEffectAction
    needsWeaponInEachHand: true
  - type: CFDegreeEffects
    effects:
    - !type:CFBonusEffect
      stat: ArmorClass
      type: Circumstance
      value: 1
      durationSeconds: 6

- type: entity
  parent: CFActivityInstant
  id: CFActRaiseSymbol
  name: Raise Symbol
  description: +2 circumstance bonus to saving throws for 6 seconds.
  components:
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFBonusEffect
      stat: Saves
      type: Circumstance
      value: 2
      durationSeconds: 6

# Guardian. Once an hour in the world is 15 minutes of real time at the default clock.
- type: entity
  parent: CFActivityInstant
  id: CFActArmoredCourage
  name: Armored Courage
  description: In medium or heavy armor, gain temporary Hit Points equal to your level for a minute, and lower frightened by 1. Once an hour.
  components:
  - type: Action
    useDelay: 900
  - type: CFEffectAction
    needsMediumOrHeavyArmor: true
  - type: CFDegreeEffects
    effects:
    - !type:CFTemporaryHpEffect
      perLevel: 1
      durationSeconds: 60
    - !type:CFReduceFrightenedEffect

# Ghostly Stride: a move that sets off no reactions.
- type: entity
  parent: CFActivityInstant
  id: CFActGhostlyStride
  name: Ghostly Stride
  description: For 3 seconds you can leave an enemy's reach at no cost and without setting off a reaction.
  components:
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFFreeStepEffect
      durationSeconds: 3

# Explosive Leap: the innovation throws its Inventor 30 feet.
- type: entity
  parent: CFActivityInstant
  id: CFActExplosiveLeap
  name: Explosive Leap
  description: A blast from your innovation throws you 30 feet the way you are facing. An unstable action.
  components:
  - type: CFEffectAction
    unstable: true
  - type: CFTrait
    traits: [Fire]
  - type: CFDegreeEffects
    effects:
    - !type:CFLeapEffect
      feet: 30

# Parries. Each is +AC for 6 seconds, with something particular in hand.
- type: entity
  parent: CFActivityInstant
  id: CFActDuelingParry
  name: Dueling Parry
  description: With a one-handed melee weapon and your other hand free, +2 circumstance bonus to AC for 6 seconds.
  components:
  - type: CFEffectAction
    needsWeaponAndFreeHand: true
  - type: CFDegreeEffects
    effects:
    - !type:CFBonusEffect
      stat: ArmorClass
      type: Circumstance
      value: 2
      durationSeconds: 6

- type: entity
  parent: CFActivityInstant
  id: CFActRaiseHaft
  name: Raise Haft
  description: With a melee weapon in both hands, +1 circumstance bonus to AC for 6 seconds, or +2 with a weapon that has the parry trait.
  components:
  - type: CFEffectAction
    needsTwoHanded: Melee
  - type: CFDegreeEffects
    effects:
    - !type:CFRaiseHaftEffect
      durationSeconds: 6

- type: entity
  parent: CFActRaiseHaft
  id: CFActDefensiveArmaments
  name: Defensive Armaments
  description: With a crossbow or firearm in both hands, +1 circumstance bonus to AC for 6 seconds.
  components:
  - type: CFEffectAction
    needsTwoHanded: Ranged

# Arcane Bond (Player Core, Wizard): once a day, a spent prepared spell comes back for one cast.
- type: entity
  parent: CFActivityInstant
  id: CFActDrainBondedItem
  name: Drain Bonded Item
  description: Free, once a day. For 6 seconds, one prepared spell you already cast today can be cast again without a slot.
  components:
  - type: CFRadialSlot
    group: Free
    tab: Focus
  - type: CFDailyUses
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFDrainBondedItemEffect

# Barbarian: Shake It Off. The rage trait: only while raging.
- type: entity
  parent: CFActivityInstant
  id: CFActShakeItOff
  name: Shake It Off
  description: While raging, lower your frightened value by 1.
  components:
  - type: CFEffectAction
    needsRaging: true
  - type: CFDegreeEffects
    effects:
    - !type:CFReduceFrightenedEffect

# Champion: Desperate Prayer. The rules give it as a turn begins with no Focus Points: here it is used by hand.
- type: entity
  parent: CFActivityInstant
  id: CFActDesperatePrayer
  name: Desperate Prayer
  description: You regain 1 Focus Point. Once a day.
  components:
  - type: CFRadialSlot
    group: Free
  - type: CFEffectAction
  - type: CFDailyUses
  - type: CFDegreeEffects
    effects:
    - !type:CFRegainFocusEffect

# Swashbuckler styles: the action each style gains panache from. Each is a skill check against one of the target's DCs.
- type: entity
  parent: CFActivityTarget
  id: CFActBonMot
  name: Bon Mot
  description: A cutting remark at an enemy within 30 feet, Diplomacy against its Will DC. On a success it takes -2 status to Perception and Will saves for a minute, -3 on a critical success, and a Swashbuckler gains panache.
  components:
  - type: TargetAction
    range: 6.25
  - type: CFEffectAction
  - type: CFTrait
    traits:
    - Auditory
    - Concentrate
    - Linguistic
    - Mental
  - type: CFCheck
    defense: Will
    skill: Diplomacy
    basicSave: false
  - type: CFDegreeEffects
    success:
    - !type:CFBonusEffect
      stat: Perception
      type: Status
      value: -2
      durationSeconds: 60
    - !type:CFBonusEffect
      stat: Will
      type: Status
      value: -2
      durationSeconds: 60
    - !type:CFGainPanacheEffect {}
    criticalSuccess:
    - !type:CFBonusEffect
      stat: Perception
      type: Status
      value: -3
      durationSeconds: 60
    - !type:CFBonusEffect
      stat: Will
      type: Status
      value: -3
      durationSeconds: 60
    - !type:CFGainPanacheEffect {}

- type: entity
  parent: CFActivityTarget
  id: CFActDirtyTrick
  name: Dirty Trick
  description: A trick on an enemy in reach, Thievery against its Reflex DC. On a success it is clumsy 1 for 6 seconds, a minute on a critical success, and a Swashbuckler gains panache.
  components:
  - type: CFEffectAction
  - type: CFTrait
    traits:
    - Attack
    - Manipulate
  - type: CFCheck
    defense: Reflex
    skill: Thievery
    basicSave: false
  - type: CFDegreeEffects
    success:
    - !type:CFApplyConditionEffect
      condition: Clumsy
      value: 1
      durationSeconds: 6
    - !type:CFGainPanacheEffect {}
    criticalSuccess:
    - !type:CFApplyConditionEffect
      condition: Clumsy
      value: 1
      durationSeconds: 60
    - !type:CFGainPanacheEffect {}

- type: entity
  parent: CFActivityTarget
  id: CFActFascinatingPerformance
  name: Fascinating Performance
  description: Perform for an enemy within 30 feet, Performance against its Will DC. On a critical success it is fascinated for 6 seconds. On any success a Swashbuckler gains panache.
  components:
  - type: TargetAction
    range: 6.25
  - type: CFEffectAction
  - type: CFTrait
    traits:
    - Concentrate
    - Visual
  - type: CFCheck
    defense: Will
    skill: Performance
    basicSave: false
  - type: CFDegreeEffects
    success:
    - !type:CFGainPanacheEffect {}
    criticalSuccess:
    - !type:CFApplyConditionEffect
      condition: Fascinated
      durationSeconds: 6
    - !type:CFGainPanacheEffect {}

# Investigator.
- type: entity
  parent: CFActivityTarget
  id: CFActExpeditiousInspection
  name: Expeditious Inspection
  description: Recall Knowledge about a creature within 30 feet at no cost. Once every 10 minutes.
  components:
  - type: TargetAction
    range: 6.25
  - type: Action
    useDelay: 600
  - type: CFRadialSlot
    group: Free
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFRecallEffect

- type: entity
  parent: CFActivityTarget
  id: CFActPointedQuestion
  name: Pointed Question
  description: Ask a creature within 30 feet a needling question, Diplomacy against its Will DC. On a success it is off-guard to you for 6 seconds.
  components:
  - type: TargetAction
    range: 6.25
  - type: CFEffectAction
  - type: CFTrait
    traits:
    - Auditory
    - Concentrate
    - Linguistic
    - Mental
  - type: CFCheck
    defense: Will
    skill: Diplomacy
    basicSave: false
  - type: CFDegreeEffects
    success:
    - !type:CFOffGuardEffect
      toUser: true
    criticalSuccess:
    - !type:CFOffGuardEffect
      toUser: true

- type: entity
  parent: CFActivityTarget
  id: CFActPersonOfInterest
  name: Person of Interest
  description: Pick a creature within 60 feet. For a minute, Devise a Stratagem against it costs no action. Once every 10 minutes.
  components:
  - type: TargetAction
    range: 12.25
  - type: Action
    useDelay: 600
  - type: CFEffectAction
  - type: CFDegreeEffects
    effects:
    - !type:CFPersonOfInterestEffect {}

# Sorcerer: Bleed Out. Only within 6 seconds of blood magic.
- type: entity
  parent: CFActivityTarget
  id: CFActBleedOut
  name: Bleed Out
  description: Within 6 seconds of your blood magic, a spell attack against a creature within 60 feet. On a hit it takes persistent bleed damage equal to the rank of the spell that set the blood magic off.
  components:
  - type: TargetAction
    range: 12.25
  - type: CFEffectAction
    needsBloodMagic: true
  - type: CFCheck
    defense: ArmorClass
  - type: CFDegreeEffects
    landed:
    - !type:CFBleedOutEffect {}

# Oracle: cursebound abilities. Each use raises the cursebound value by 1, and none can be used at the most.
- type: entity
  parent: CFActivityTarget
  id: CFActWhispersOfWeakness
  name: Whispers of Weakness
  description: Cursebound. Recall Knowledge about a creature within 60 feet at no cost, and get +2 status to attack rolls for 6 seconds.
  components:
  - type: TargetAction
    range: 12.25
  - type: CFEffectAction
    cursebound: true
  - type: CFDegreeEffects
    effects:
    - !type:CFRecallEffect
    - !type:CFBonusEffect
      stat: AttackRoll
      value: 2
      durationSeconds: 6
      onUser: true

- type: entity
  parent: CFActivityTarget
  id: CFActForetellHarm
  name: Foretell Harm
  description: Cursebound, free. Within 6 seconds of casting a damaging spell that is not a cantrip, a creature within 60 feet takes twice that spell's rank in damage of the same type.
  components:
  - type: TargetAction
    range: 12.25
  - type: CFRadialSlot
    group: Free
  - type: CFEffectAction
    cursebound: true
    needsDamagingSpell: true
  - type: CFDegreeEffects
    effects:
    - !type:CFForetellHarmEffect {}

- type: entity
  parent: CFActivityInstant
  id: CFActOracularWarning
  name: Oracular Warning
  description: Cursebound, free. You and allies within 20 feet gain temporary Hit Points equal to half your level for a minute.
  components:
  - type: CFRadialSlot
    group: Free
  - type: CFEffectAction
    cursebound: true
  - type: CFAreaEffect
    shape: Emanation
    sizeFeet: 20
    includeSelf: true
    filter: Allies
  - type: CFDegreeEffects
    effects:
    - !type:CFTemporaryHpEffect
      halfLevel: true
      durationSeconds: 60

