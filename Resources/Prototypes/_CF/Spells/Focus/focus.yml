# Focus spells. Each costs a Focus Point and heightens to half the caster's level, rounded up, so rank is 0 on the action.
# Grant one with CFGrantFocusSpell.

- type: entity
  parent: CFSpellTarget
  id: CFTempestSurge
  name: Tempest Surge
  description: A storm deals 1d12 electricity to a creature, basic Reflex. On a failure it is also clumsy 2 for a round. Costs a Focus Point.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: TempestSurge
    rank: 0
    focus: true
  - type: CFTargeting
    rangeFeet: 30
  - type: CFHeighten
    baseRank: 1
    interval: 1
  - type: CFCheck
    defense: Reflex
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 12
      damageType: Electricity
      heightenDice: 1
    failure:
    - !type:CFApplyConditionEffect
      condition: Clumsy
      value: 2
      durationSeconds: 6
    criticalFailure:
    - !type:CFApplyConditionEffect
      condition: Clumsy
      value: 2
      durationSeconds: 6

- type: entity
  parent: CFSpellTarget
  id: CFForceBolt
  name: Force Bolt
  description: A bolt of force that always hits for 1d4+1. Costs a Focus Point.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: ForceBolt
    rank: 0
    focus: true
  - type: CFTargeting
    rangeFeet: 30
  - type: CFHeighten
    baseRank: 1
    interval: 2
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 4
      flat: 1
      damageType: Force
      heightenDice: 1
      heightenFlat: 1

- type: entity
  parent: CFActivityInstant
  id: CFActRefocus
  name: Refocus
  description: Spend 10 minutes on the world clock to regain 1 Focus Point. Moving or being hurt interrupts it.
  components:
  - type: CFRefocus
  - type: CFRadialSlot
    group: Free
    tab: Focus

# The list of spells hides these from the builder: an empty traditions list is on nobody's spell list.
- type: cfSpell
  id: TempestSurge
  name: Tempest Surge
  rank: 1
  traits: [Concentrate, Electricity, Manipulate]
  actionCost: Two
  range: 30 feet
  targets: 1 creature
  defense: basic Reflex
  summary: A storm deals 1d12 electricity damage. On a failure the target is also clumsy 2 for 1 round.
  heightened: Damage increases by 1d12 per rank.

- type: cfSpell
  id: ForceBolt
  name: Force Bolt
  rank: 1
  traits: [Concentrate, Force, Manipulate]
  actionCost: One
  range: 30 feet
  targets: 1 creature
  summary: A bolt of force automatically hits for 1d4+1 force damage.
  heightened: Damage increases by 1d4+1 every 2 ranks.

- type: entity
  parent: CFSpellTarget
  id: CFLayOnHands
  name: Lay on Hands
  description: A touch heals a creature for 6 Hit Points, or more when heightened. Costs a Focus Point.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 1
  - type: CFSpell
    spell: LayOnHands
    rank: 0
    focus: true
  - type: CFTargeting
    rangeFeet: 5
    touch: true
    filter: All
  - type: CFHeighten
    baseRank: 1
    interval: 1
  - type: CFDegreeEffects
    landed:
    - !type:CFHealEffect
      flat: 6
      heightenFlat: 6
  - type: EntityTargetAction
    canTargetSelf: true

- type: entity
  parent: CFSpellTarget
  id: CFTouchOfTheVoid
  name: Touch of the Void
  description: A touch deals 1d6 void damage, basic Fortitude. On a failure the target also takes -2 to AC for 6 seconds. Costs a Focus Point.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 1
  - type: CFSpell
    spell: TouchOfTheVoid
    rank: 0
    focus: true
  - type: CFTargeting
    rangeFeet: 5
    touch: true
  - type: CFHeighten
    baseRank: 1
    interval: 1
  - type: CFCheck
    defense: Fortitude
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 6
      damageType: Void
      heightenDice: 1
    failure:
    - !type:CFBonusEffect
      stat: ArmorClass
      type: Status
      value: -2
      durationSeconds: 6
    criticalFailure:
    - !type:CFBonusEffect
      stat: ArmorClass
      type: Status
      value: -2
      durationSeconds: 6

- type: cfSpell
  id: LayOnHands
  name: Lay on Hands
  rank: 1
  traits: [Healing, Manipulate, Vitality]
  actionCost: One
  range: touch
  targets: 1 creature
  summary: The target regains 6 Hit Points. Damaging undead and the AC bonus are TBA.
  heightened: Healing increases by 6 per rank.

- type: cfSpell
  id: TouchOfTheVoid
  name: Touch of the Void
  rank: 1
  traits: [Manipulate, Void]
  actionCost: One
  range: touch
  targets: 1 creature
  defense: basic Fortitude
  summary: The target takes 1d6 void damage. On a failure it also takes -2 to AC. Healing undead is TBA.
  heightened: Damage increases by 1d6 per rank.

- type: entity
  parent: CFSpellInstant
  id: CFShieldsOfTheSpirit
  name: Shields of the Spirit
  description: Raise your shield. For 6 seconds, allies in your aura have +1 status bonus to AC, and an enemy that attacks one takes 1d4 spirit damage. Costs a Focus Point.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 1
  - type: CFSpell
    spell: ShieldsOfTheSpirit
    rank: 0
    focus: true
  - type: CFTargeting
    filter: All
  - type: CFNeedsShield
  - type: CFDegreeEffects
    landed:
    - !type:CFRaiseSpiritShieldsEffect

- type: cfSpell
  id: ShieldsOfTheSpirit
  name: Shields of the Spirit
  rank: 1
  traits: [Concentrate, Sanctified, Spirit]
  actionCost: One
  range: 15-foot aura
  targets: allies in your aura
  summary: Raise your shield. Allies in your aura have +1 status bonus to AC, and an enemy that attacks one takes 1d4 spirit damage.
  heightened: Damage increases by 1d4 per 2 ranks.

- type: entity
  parent: CFSpellTarget
  id: CFForceFang
  name: Force Fang
  description: Your attack becomes pure force and deals 1d4+1 force damage to a creature in reach. It recharges Spellstrike. Costs a Focus Point.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 1
  - type: CFSpell
    spell: ForceFang
    rank: 0
    focus: true
    conflux: true
  - type: CFTargeting
    rangeFeet: 5
    touch: true
  - type: CFHeighten
    baseRank: 1
    interval: 2
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 4
      flat: 1
      damageType: Force
      heightenDice: 1
      heightenFlat: 1

- type: cfSpell
  id: ForceFang
  name: Force Fang
  rank: 1
  traits: [Force, Manipulate]
  actionCost: One
  range: reach
  targets: 1 creature
  summary: Your attack becomes pure force and deals 1d4+1 force damage. It recharges Spellstrike.
  heightened: Damage increases by 1d4+1 per 2 ranks.

# Psi cantrips with no spell list. A Psychic's conscious mind grants them.

- type: entity
  parent: CFSpellTarget
  id: CFImaginaryWeapon
  name: Imaginary Weapon
  description: A weapon of force. A melee spell attack for 2d6 force damage. Amped, it strikes two creatures.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: ImaginaryWeapon
    rank: 0
  - type: CFPsiCantrip
    ampExtraTargets: 1
    ampHeightenDice: 2
  - type: CFTargeting
    rangeFeet: 5
    touch: true
  - type: CFHeighten
    baseRank: 1
    interval: 1
  - type: CFCheck
    defense: ArmorClass
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 2
      die: 6
      damageType: Force
      heightenDice: 1
    criticalSuccess:
    - !type:CFForcedMovementEffect
      feet: 10

- type: entity
  parent: CFSpellArea
  id: CFTelekineticRend
  name: Telekinetic Rend
  description: Creatures in the area take 1d6 bludgeoning, basic Fortitude. Amped, they also take 1d6 slashing.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: TelekineticRend
    rank: 0
  - type: CFPsiCantrip
    ampEffects:
    - !type:CFDamageEffect
      dice: 1
      die: 6
      damageType: Slashing
      heightenDice: 1
  - type: CFTargeting
    rangeFeet: 60
  - type: CFAreaEffect
    shape: Burst
    sizeFeet: 10
  - type: CFHeighten
    baseRank: 1
    interval: 2
  - type: CFCheck
    defense: Fortitude
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 6
      damageType: Bludgeoning
      heightenDice: 1

- type: entity
  parent: CFSpellTarget
  id: CFThermalStasis
  name: Thermal Stasis
  description: A creature resists 2 fire and 2 cold for 6 seconds. Amped, for a minute.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 1
  - type: CFSpell
    spell: ThermalStasis
    rank: 0
  - type: CFPsiCantrip
    ampDurationSeconds: 60
  - type: CFTargeting
    rangeFeet: 60
    filter: All
  - type: CFHeighten
    baseRank: 1
    interval: 1
  - type: CFDegreeEffects
    landed:
    - !type:CFResistanceEffect
      damageType: Fire
      amount: 2
      heightenAmount: 2
      durationSeconds: 6
    - !type:CFResistanceEffect
      damageType: Cold
      amount: 2
      heightenAmount: 2
      durationSeconds: 6
  - type: EntityTargetAction
    canTargetSelf: true

- type: entity
  parent: CFSpellTarget
  id: CFGlimpseWeakness
  name: Glimpse Weakness
  description: The first ally to hit the target deals 1 + the spell's rank in precision damage. Amped, 1d4+1.
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 1
  - type: CFSpell
    spell: GlimpseWeakness
    rank: 0
  - type: CFPsiCantrip
  - type: CFTargeting
    rangeFeet: 60
  - type: CFDegreeEffects
    landed:
    - !type:CFGlimpseEffect

