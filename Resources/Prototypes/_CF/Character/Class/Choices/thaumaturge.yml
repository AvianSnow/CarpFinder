# CarpFinder: Thaumaturge implements. A character picks a first one, and at level 5 a second.

- type: cfClassChoice
  id: ImplementAmulet
  class: Thaumaturge
  slot: cf-class-choice-implement
  name: cf-class-choice-implementamulet
  description: cf-class-choice-implementamulet-desc
  grants:
    - !type:CFGrantItem
      item: CFImplementAmulet
    - !type:CFGrantReaction
      reaction:
        name: cf-reaction-amulets-abeyance
        trigger: ExploitedWouldDamage
        implement: Amulet
        rangeFeet: 15
        resistFlat: 2
        resistLevel: true

- type: cfClassChoice
  id: SecondImplementAmulet
  class: Thaumaturge
  slot: cf-class-choice-second-implement
  name: cf-class-choice-secondimplementamulet
  description: cf-class-choice-secondimplementamulet-desc
  features:
    - level: 5
      name: Second Implement
      grants:
        - !type:CFGrantItem
          item: CFImplementAmulet
        - !type:CFGrantReaction
          reaction:
            name: cf-reaction-amulets-abeyance
            trigger: ExploitedWouldDamage
            implement: Amulet
            rangeFeet: 15
            resistFlat: 2
            resistLevel: true

