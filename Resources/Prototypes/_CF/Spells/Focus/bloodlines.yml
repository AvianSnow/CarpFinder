# Sorcerer bloodline spells (Player Core 2): the initial focus spell of each bloodline. Casting one sets off the
# bloodline's blood magic (CFBloodMagicSystem). Tentacular Limbs and Undeath's Blessing are not built.

- type: entity
  parent: CFSpellArea
  id: CFAngelicHalo
  name: Angelic Halo
  description: "You and allies within 15 feet regain 2 more Hit Points from healing spells for a minute, 2 more per rank. Costs a Focus Point."
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 1
  - type: CFSpell
    spell: AngelicHalo
    rank: 0
    focus: true
  - type: CFAreaEffect
    shape: Emanation
    sizeFeet: 15
    includeSelf: true
    filter: Allies
  - type: CFHeighten
    baseRank: 1
    interval: 1
  - type: CFDegreeEffects
    landed:
    - !type:CFBonusEffect
      stat: SpellHealing
      value: 2
      heightenValue: 2
      durationSeconds: 60

- type: cfSpell
  id: AngelicHalo
  name: Angelic Halo
  rank: 1
  traits: [Aura, Concentrate]
  actionCost: One
  summary: "Allies in a 15-foot emanation gain a status bonus to Hit Points regained from heal equal to double its rank. It is given to those in the area when it is cast, and does not follow you."

- type: entity
  parent: CFSpellTarget
  id: CFGluttonsJaws
  name: Glutton's Jaws
  description: "A spell attack against a creature within 30 feet for 2d6 piercing damage. On a hit you gain 1d4 temporary Hit Points for 6 seconds. 2d6 and 1d4 more per rank. Costs a Focus Point."
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 2
  - type: CFSpell
    spell: GluttonsJaws
    rank: 0
    focus: true
  - type: CFTargeting
    rangeFeet: 30
  - type: CFCheck
    defense: ArmorClass
  - type: CFHeighten
    baseRank: 1
    interval: 1
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 2
      die: 6
      damageType: Piercing
      heightenDice: 2
    landed:
    - !type:CFTemporaryHpEffect
      dice: 1
      die: 4
      heightenDice: 1
      durationSeconds: 6
      toUser: true

- type: cfSpell
  id: GluttonsJaws
  name: Glutton's Jaws
  rank: 1
  traits: [Attack, Concentrate, Manipulate]
  actionCost: Two
  summary: "A spell attack for 2d6 piercing damage. On a hit you gain 1d4 temporary Hit Points."
  defense: AC
  heightened: "Damage increases by 2d6 and the temporary Hit Points by 1d4 per rank."

- type: entity
  parent: CFSpellTarget
  id: CFDiabolicEdict
  name: Diabolic Edict
  description: "An ally within 30 feet gets +1 status to attack rolls and skill checks for 6 seconds. Costs a Focus Point."
  components:
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 1
  - type: CFSpell
    spell: DiabolicEdict
    rank: 0
    focus: true
  - type: CFTargeting
    rangeFeet: 30
    filter: Allies
  - type: CFDegreeEffects
    landed:
    - !type:CFBonusEffect
      stat: AttackRoll
      value: 1
      durationSeconds: 6
    - !type:CFBonusEffect
      stat: SkillChecks
      value: 1
      durationSeconds: 6

- type: cfSpell
  id: DiabolicEdict
  name: Diabolic Edict
  rank: 1
  traits: [Concentrate]
  actionCost: One
  summary: "A willing creature gains a +1 status bonus to attack rolls and skill checks for a task. The penalty for refusing is TBA."

