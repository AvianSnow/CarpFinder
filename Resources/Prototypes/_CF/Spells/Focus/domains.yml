- type: cfSpell
  id: DazzlingFlash
  name: Dazzling Flash
  rank: 1
  traits: [Concentrate, Light, Manipulate, Visual]
  actionCost: Two
  range: 15-foot cone
  targets: creatures in the cone
  defense: Fortitude
  summary: "Creatures in the cone are dazzled, or blinded for a round and dazzled for longer."
  heightened: "At rank 3 the cone is 30 feet: TBA"

- type: cfSpell
  id: HealersBlessing
  name: Healer's Blessing
  rank: 1
  traits: [Concentrate]
  actionCost: One
  range: 30 feet
  targets: 1 willing living creature
  summary: "A healing spell restores 2 more Hit Points to the target for a minute."
  heightened: "2 more per rank"

- type: cfSpell
  id: WordOfTruth
  name: Word of Truth
  rank: 1
  traits: [Concentrate]
  actionCost: One
  range: self
  targets: self
  summary: "+2 status to Diplomacy. That listeners know you believe what you say is for play."

- type: cfSpell
  id: SwearOath
  name: Swear Oath
  rank: 1
  traits: [Concentrate]
  actionCost: One
  range: self
  targets: self
  summary: "+1 status to attack rolls and skill checks until your next turn."
  heightened: "+2 at rank 5: TBA"

- type: cfSpell
  id: CreativeSplash
  name: Creative Splash
  rank: 1
  traits: [Concentrate, Illusion, Manipulate, Visual]
  actionCost: Two
  range: 30 feet
  targets: 5-foot burst
  defense: Will
  summary: "A random colour: dazzled, enfeebled, frightened or clumsy on a failed save."

- type: cfSpell
  id: HurtlingStone
  name: Hurtling Stone
  rank: 1
  traits: [Attack, Earth, Manipulate]
  actionCost: One
  range: 60 feet
  targets: 1 creature
  defense: AC
  summary: "2d6 bludgeoning on a hit, double on a critical hit, and a short push."
  heightened: "1d6 more per rank"

- type: cfSpell
  id: SoothingWords
  name: Soothing Words
  rank: 1
  traits: [Concentrate, Emotion, Mental]
  actionCost: One
  range: 30 feet
  targets: 1 ally
  summary: "+1 status to Will saves, +2 against emotion. Counteracting an emotion effect on the target: TBA"

- type: cfSpell
  id: PushingGust
  name: Pushing Gust
