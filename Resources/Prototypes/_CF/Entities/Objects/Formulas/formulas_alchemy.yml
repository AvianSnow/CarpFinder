# Formulas for the potions brewed in a cauldron (Crafting/recipes_alchemy.yml). Priced by item level, from the
# Player Core table: level 1 is 1 gp, level 2 is 2 gp, level 4 is 5 gp.

- type: entity
  parent: CFBaseFormula
  id: CFFormulaElixirOfLifeMinor
  name: formula (minor elixir of life)
  components:
  - type: CFFormula
    recipes:
    - ElixirOfLifeMinor
  - type: CFItemPrice
    copper: 100

