# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Wizard
  name: cf-class-wizard
  description: cf-class-description-wizard
  hitPoints: 6
  keyAbility: Intelligence
  hitPointsAbility: Constitution
  classDC: cf-class-wizard
  proficiencies:
    perception:
      trained:
        - Perception
    savingThrows:
      trained:
        - Fortitude
        - Reflex
      expert:
        - Will
    skills:
      trained:
        - Arcana
    attacks:
      trained:
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
  additionalSkillTrainings: 2
  spellcasting:
    tradition: Arcane
    ability: Intelligence
    cantrips: 5
    slots:
      - 2
    laterSlots:
      - [ 3 ]
      - [ 3, 2 ]
      - [ 3, 3 ]
      - [ 3, 3, 2 ]
    prepared: true
  features:
    - level: 1
      name: "Arcane Bond"
      description: "Drawing on your bonded item once a day: TBA"
    - level: 1
      name: "Arcane School"
      description: "Choose yours with the Arcane School button."
    - level: 1
      name: "Arcane Thesis"
      description: "Your thesis: TBA"
    - level: 1
      name: "Wizard Spellcasting"
      description: "Level 1 cantrips and spell slots are on the spell sheet."
    - level: 5
      name: "Reflex Expertise"
      description: "Expert in Reflex saves."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Reflex
          rank: Expert
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
