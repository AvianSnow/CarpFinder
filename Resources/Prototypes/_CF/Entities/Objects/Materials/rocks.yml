- type: entity
  id: CFDirtBlock1
  parent: BaseItem
  name: dirt block
  description: A block of excellent black soil.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
  - type: Sprite
    noRot: true
    sprite: _CP14/Objects/Materials/dirt_block.rsi
    layers:
      - state: dirt
        map: ["base"]
  - type: FloorTile
    placeTileSound:
      collection: CFDigging
      params:
        variation: 0.03
        volume: 2
    outputs:
      - CFFloorDirt
  - type: Appearance
  - type: Stack
    stackType: CFDirt
    count: 1
    baseLayer: base
    layerStates:
    - dirt
    - dirt_2
    - dirt_3
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      CFDirt: 10

- type: entity
  id: CFDirtBlock10
  parent: CFDirtBlock1
  suffix: 10
  components:
  - type: Stack
    count: 10

