# Versatile vials: what an Alchemist's Quick Vial makes. A bomb of 1d6 and 1 splash, or 2d6 and 2 from level 4
# (CFQuickAlchemySystem sets the numbers from the maker's level). They cost nothing, are never sold, and go inert a
# few seconds after they are made. Acid is the plain one. A research field adds the others.

- type: entity
  parent: CFBaseBomb
  id: CFVersatileVialAcid
  name: versatile vial (acid)
  description: A vial of quick alchemy. Thrown, it deals 1d6 acid damage and splashes 1 acid damage over everyone within 5 feet. It goes inert within moments.
  components:
  - type: Sprite
    layers:
    - state: vial
    - state: fill-6
      color: "#7ad13a"
  - type: CFWeapon
    damageDice: 1
    damageDie: 6
    damageType: Acid
    category: Martial
    group: Bomb
  - type: CFTrait
    traits:
    - Thrown20
    - Splash
    - Bomb
    - Alchemical
    - Consumable
    - Infused
  - type: CFBomb
    splash: 1

