# CarpFinder: Oracle mysteries, Player Core 2. Granted spells that have no spell in the game yet are left out.
- type: cfClassChoice
  id: MysteryAncestors
  class: Oracle
  slot: cf-class-choice-mystery
  name: cf-class-choice-mysteryancestors
  description: cf-class-choice-mysteryancestors-desc
  trainedSkills:
    - Society
  grants:
    - !type:CFGrantSpell
      spell: Guidance
    - !type:CFGrantFocusSpell
      spell: AncestralTouch
    - !type:CFGrantFeat
      feat: CFWhispersofWeakness
    - !type:CFGrantCurse
      conditions: [ Clumsy ]

