# Ported from CP14 by the CF converter.

- type: entity
  parent: BaseItem
  id: CFSpoon
  name: spoon
  description: It is considered the first tool for eating, not counting the hands.
  categories: [ ForkFiltered ]
  components:
  - type: Tag
    tags:
    - Metal
  - type: Sprite
    sprite: _CP14/Objects/Consumable/Food/cutlery.rsi
    state: spoon
  - type: Item
    sprite: _CP14/Objects/Consumable/Food/cutlery.rsi
    heldPrefix: spoon
  - type: Utensil
    types:
    - Spoon
  - type: MeleeWeapon
    wideAnimationRotation: 180
    attackRate: 1.5
    damage:
      types:
        Blunt: 1
  - type: Shovel
    speedModifier: 0.1 # you can try
  - type: ReactionMixer
    mixMessage: "spoon-mixing-success"
    timeToMix: 0.5
    reactionTypes:
    - Stir
  - type: PhysicalComposition
    materialComposition:
      CFIron: 4
