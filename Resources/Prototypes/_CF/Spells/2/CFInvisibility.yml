- type: entity
  parent: CFSpellTarget
  id: CFInvisibility
  name: Invisibility
  description: The target is hidden until it attacks or the spell ends.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 2
  - type: CFSpell
    spell: Invisibility
    rank: 2
  - type: CFTargeting
    rangeFeet: 5
    touch: true
    filter: All
  - type: CFDegreeEffects
    landed:
    - !type:CFApplyConditionEffect
      condition: Invisible
  - type: EntityTargetAction
    canTargetSelf: true
