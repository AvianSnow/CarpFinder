# Ported from CP14 by the CF converter.

- type: entity
  abstract: true
  id: CFBaseFork
  parent:
  - BaseItem
  - CFBaseWeaponChemical
  - CFBaseWeaponDestructible
  - CFBaseWeaponSelfDamage
  - CFBaseWeaponSharp
  components:
  - type: Item
    size: Ginormous
  - type: ThrowingAngle
    angle: -90
  - type: MeleeWeapon
    attackRate: 1
    range: 2
    angle: 10
    wideAnimationRotation: -90
    damage:
      types:
        Piercing: 3
    animation: WeaponArcThrust
    wideAnimation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 3
  - type: Wieldable
  - type: Clothing
    slots:
    - neck
    equipDelay: 1
    unequipDelay: 1
  - type: CFEditTileTool
    sound:
      collection: CFDigging
    tileReplace:
      CFFloorDirt: CFFloorDirtSeedbed
      CFFloorDirtSeedbed: CFFloorDirt

- type: entity
  parent: CFBaseFork
  id: CFWeaponFork
  name: fork
  description: A simple fork for digging and planting seeds in the soil.
  components:
  - type: Sprite
    sprite: _CP14/Objects/Weapons/Melee/Fork/fork.rsi
    state: icon
