- type: entity
  id: CFString
  parent: BaseItem
  name: strings
  description: Thin thread. Material for mending clothes, or sewing new ones.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _CP14/Objects/Materials/string.rsi
    state: icon
  - type: PhysicalComposition
    materialComposition:
      CFCloth: 5

- type: entity
  id: CFWeb
  parent: BaseItem
  name: web
  description: A lump of nasty cobweb. If done correctly, this can be turned into threads.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _CP14/Objects/Materials/web.rsi
    state: icon
    layers:
    - state: icon
      map: ["random"]
  - type: Appearance
  - type: RandomSprite
    available:
    - random:
        icon: ""
        icon2: ""
        icon3: ""
        icon4: ""
  - type: PhysicalComposition
    materialComposition:
      CFCloth: 2

- type: entity
  id: CFCloth1
  parent: BaseItem
  categories: [ ForkFiltered ]
  name: cloth
  suffix: 1
  description: White cloth roll
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _CP14/Objects/Materials/cloth.rsi
    layers:
      - state: cloth_1
        map: ["base"]
  - type: Healing
    damageContainers:
      - CFBiological
    damage:
      types:
        Slash: -3
        Piercing: -3
    bloodlossModifier: -8
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
  - type: Appearance
  - type: Stack
    stackType: CFCloth
    count: 1
    baseLayer: base
    layerStates:
    - cloth_1
    - cloth_2
    - cloth_3
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      CFCloth: 10

- type: entity
  id: CFCloth10
  parent: CFCloth1
  suffix: 10
  components:
  - type: Stack
    count: 10

- type: entity
  id: CFGlassShard
  parent: ShardGlass
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    layers:
      - sprite: _CP14/Objects/Materials/glass.rsi
        state: shard1
        map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
          shard1: ""
          shard2: ""
  - type: PhysicalComposition
    materialComposition:
      CFGlass: 5
