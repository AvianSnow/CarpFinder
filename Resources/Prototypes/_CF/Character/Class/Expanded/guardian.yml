# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Guardian
  name: cf-class-guardian
  description: cf-class-description-guardian
  hitPoints: 12
  keyAbility: Strength
  hitPointsAbility: Constitution
  classDC: cf-class-guardian
  proficiencies:
    perception:
      trained:
        - Perception
    savingThrows:
      trained:
        - Reflex
      expert:
        - Fortitude
        - Will
    skills:
      trained:
        - Athletics
    attacks:
      trained:
        - MartialWeapons
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - MediumArmor
        - HeavyArmor
        - LightArmor
  additionalSkillTrainings: 3
  features:
    - level: 1
      name: "Guardian's Armor"
      description: "In medium or heavy armor, you resist physical damage by 1 + half your level."
      grants:
        - !type:CFGrantOption
          option: GuardianArmor
    - level: 1
      name: "Guardian's Techniques"
      description: "Ever Ready and Intercept Attack. A reaction that moves you is not built yet: TBA"
    - level: 1
      name: "Shield Block"
      description: "You can spend your reaction to block damage with a raised shield."
      grants:
        - !type:CFGrantOption
          option: ShieldBlock
    - level: 1
      name: "Taunt"
      description: "Make an enemy attack you or suffer for it. Nothing checks who an enemy targets yet: TBA"
    - level: 3
      name: "Tough To Kill"
      description: "Diehard, and staying up longer at 0 Hit Points: TBA"
    - level: 5
      name: "Unbreakable Expertise"
      description: "Expert with medium and heavy armor."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - MediumArmor
            - HeavyArmor
          rank: Expert
    - level: 5
      name: "Weapon Expertise"
      description: "Expert with simple weapons, martial weapons and unarmed attacks."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - SimpleWeapons
            - MartialWeapons
            - Unarmed
          rank: Expert
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
