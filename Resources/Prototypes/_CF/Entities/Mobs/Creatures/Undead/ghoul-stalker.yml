# Ghoul Stalker. Creature 1, Medium, Ghoul Undead Unholy. Monster Core p. 162. Recall Knowledge DC 15.
# Jaws, and a claw that Grabs. It speaks Common; Necril is not a language in the game.
# Not in yet: Consume Flesh, Ghoul Whispers and its curse, Swift Leap, and the burrow Speed.
# The sprite is the zombie's, tinted grey, until there is ghoul art.
- type: entity
  parent: [CFBaseCreature]
  id: CFMobGhoulStalker
  name: ghoul stalker
  description: A gaunt, grave-pale thing with long nails and a hungry look. It can talk, and it would rather eat.
  components:
    - type: GhostRole
      name: cf-ghost-ghoul-stalker-name
      description: cf-ghost-ghoul-stalker-desc
    - type: Sprite
      drawdepth: Mobs
      color: "#9FB0C8"
      layers:
        - map: ["enum.DamageStateVisualLayers.Base"]
          sprite: _CP14/Mobs/Species/Zombie/parts.rsi
          state: full
    - type: DamageStateVisuals
      states:
        Alive:
          Base: full
        Critical:
          Base: full
        Dead:
          Base: full
    - type: MovementSpeedModifier
      baseWalkSpeed: 2.5
      baseSprintSpeed: 4.5
    - type: CFSenses
      darkvision: true
    - type: NightVision
      enabled: true
      prioritized: true
      noiseAmount: 0
      lightingColor: "#9BB6FF30"
    - type: CFLanguages
      known: [ Common ]
    - type: CFGOAP
      tactics: Beast
    - type: CFVoidHealing
    - type: CFResistances
      entries:
      - damageType: Bleed
        amount: 9999
      - damageType: Poison
        amount: 9999
      - damageType: Void
        amount: 9999
    # Immunities: bleed, death effects, disease, paralyzed, poison, unconscious.
    - type: CFConditionImmunity
      conditions: [ Asleep, Paralyzed ]
      traits: [ Death, Disease, Poison ]
    - type: CFCombatant
      level: 1
      armorClass: 17
      speedFeet: 25
      maxHp: 16
      currentHp: 16
      printedFortitude: 4
      printedReflex: 9
      printedWill: 5
      printedPerception: 7
      printedAttack: 9
      printedDamage: 1
      trainedSkills:
        - Acrobatics
        - Athletics
        - Stealth
        - Survival
      printedSkills:
        Acrobatics: 7
        Athletics: 8
        Stealth: 7
        Survival: 5
    - type: CFAbilityScore
      abilityModifiers:
        Strength: 1
        Dexterity: 4
        Constitution: 1
        Intelligence: 1
        Wisdom: 2
        Charisma: 2
    # Each Strike with its own printed numbers. With no player in the body the AI picks (CFMonsterAttackSystem).
    - type: CFMonsterAttacks
      attacks:
      - name: jaws
        attack: 9
        dice: 1
        die: 8
        bonus: 1
        damageType: Piercing
        traits: [ Finesse ]
      - name: claw
        attack: 9
        dice: 1
        die: 6
        bonus: 1
        damageType: Slashing
        traits: [ Agile, Finesse ]
        followUp: Grab
    - type: CFCombatOptions
      naturalDice: 1
      naturalDie: 8
      naturalType: Piercing
      naturalAgile: false
      naturalFinesse: true
    - type: CFTrait
      traits:
        - Ghoul
        - Undead
        - Unholy
    - type: MobThresholds
      thresholds:
        0: Alive
        15: Critical
        16: Dead
