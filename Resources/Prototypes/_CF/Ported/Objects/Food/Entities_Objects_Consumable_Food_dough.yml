- type: entity
  id: CFFoodBreadBun
  parent: CFFoodDoughMedium
  name: bread bun
  description: it's like regular bread, only smaller and funnier.
  components:
  - type: CFItemPrice
    copper: 5
  - type: Sprite
    sprite: _CP14/Objects/Consumable/Food/dough.rsi
    state: bun_cooked
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 6 # 1/4 large dough
        reagents:
        - ReagentId: Nutriment
          Quantity: 5.2
        - ReagentId: Protein
          Quantity: 0.5
  - type: Butcherable
    butcherDelay: 1
    spawned:
      - id: CFFoodBreadBunBottom
        amount: 1
      - id: CFFoodBreadBunTop
        amount: 1
  - type: CFTemperatureTransformation
    autoTransformOnCooked: false
    entries:
    - temperatureRange: 400, 500
      transformTo: CFAsh1
  - type: Tag
    tags:
    - CFDough

- type: entity
  id: CFFoodBreadBunBottom
  parent: CFFoodDoughMedium
  name: botton bread bun
  description: It's like regular bread, only smaller and funnier. And cut in half.
  components:
  - type: CFItemPrice
    copper: 3
  - type: Sprite
    sprite: _CP14/Objects/Consumable/Food/dough.rsi
    layers:
    - state: bun_cooked_slice_bottom
    - map: ["foodSequenceLayers"]
  - type: FoodSequenceStartPoint
    key: CFSandwich
    maxLayers: 5
    startPosition: 0, 0
    offset: 0, 0.07
    minLayerOffset: -0.05, 0
    maxLayerOffset: 0.05, 0
    nameGeneration: cp14-food-sequence-sandwich-gen
    contentSeparator: ", "
  - type: Appearance
  - type: FoodMetamorphableByAdding
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 4 # 1/2 bun
        canReact: false
        reagents:
        - ReagentId: Nutriment
          Quantity: 2.6
        - ReagentId: Protein
          Quantity: 0.25
  - type: CFTemperatureTransformation
    autoTransformOnCooked: false
    entries:
    - temperatureRange: 400, 500
      transformTo: CFAsh1
  - type: Tag
    tags:
    - CFDough

