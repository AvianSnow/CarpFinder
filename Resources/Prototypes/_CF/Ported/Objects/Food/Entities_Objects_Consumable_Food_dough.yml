# Ported from CP14 by the CF converter.

- type: entity
  id: CFFoodDoughLarge
  parent: FoodInjectableBase
  name: large piece of dough
  description: The perfect ingredient for any flour product. The only thing left to do is to shape it.
  categories: [ ForkFiltered ]
  components:
  - type: CFItemPrice
    copper: 4
  - type: Item
    size: Normal
  - type: Temperature
  - type: FlavorProfile
    flavors:
      - bread #TODO smth disguisting. raw dough
  - type: Sprite
    sprite: _CP14/Objects/Consumable/Food/dough.rsi
    state: dough_large
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25
        reagents:
        - ReagentId: Nutriment
          Quantity: 20
        - ReagentId: UncookedAnimalProteins
          Quantity: 2
  - type: CFTemperatureTransformation
    entries:
    - temperatureRange: 400, 500
      transformTo: CFFoodBread
  - type: Tag
    tags:
    - CFDough

- type: entity
  id: CFFoodBread
  parent: CFFoodDoughLarge
  name: bread
  description: Crispy and so flavourful!
  components:
  - type: CFItemPrice
    copper: 10
  - type: Sprite
    sprite: _CP14/Objects/Consumable/Food/dough.rsi
    state: bread_cooked
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Nutriment
          Quantity: 20
        - ReagentId: Protein
          Quantity: 2
  - type: CFTemperatureTransformation
    autoTransformOnCooked: false
    entries:
    - temperatureRange: 400, 500
      transformTo: CFAsh1
  - type: Tag
    tags:
    - CFDough

- type: entity
  id: CFFoodBreadSlice
  parent: CFFoodDoughMedium
  name: bread slice
  components:
  - type: CFItemPrice
    copper: 3
  - type: Sprite
    sprite: _CP14/Objects/Consumable/Food/dough.rsi
    state: bread_slice
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 7 # 1/4 bread
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Protein
          Quantity: 0.5
  - type: CFTemperatureTransformation
    autoTransformOnCooked: false
    entries:
    - temperatureRange: 400, 500
      transformTo: null
  - type: Tag
    tags:
    - CFDough

- type: entity
  id: CFFoodDoughMedium
  parent: FoodInjectableBase
  name: medium piece of dough
  categories: [ ForkFiltered ]
  components:
  - type: CFItemPrice
    copper: 3
  - type: Item
    size: Tiny
  - type: Temperature
  - type: FlavorProfile
    flavors:
      - bread #TODO smth disguisting. raw dough
  - type: Sprite
    sprite: _CP14/Objects/Consumable/Food/dough.rsi
    state: dough_medium
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 7 # 1/4 large dough
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: UncookedAnimalProteins
          Quantity: 0.5
  - type: CFTemperatureTransformation
    entries:
    - temperatureRange: 400, 500
      transformTo: CFFoodBreadBun
  - type: Tag
