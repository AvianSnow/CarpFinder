# Gems from CP14's jewelry, as Player Core precious stones. Each grade has a rolled Price; these are its average.
# Gems sell for their full Price.

- type: entity
  abstract: true
  parent: BaseItem
  id: CFBaseGem
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: /Textures/_CP14/Objects/Economy/jewelry.rsi
  - type: Item
    size: Tiny
  - type: CFItem
    level: 4
  - type: CFBulk
    bulk: 0

- type: entity
  parent: CFBaseGem
  id: CFGemRuby
  name: ruby
  description: A beautiful stone that is worth a lot of money.
  components:
  - type: Sprite
    layers:
    - state: ruby1
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        ruby1: ""
        ruby2: ""
        ruby3: ""
  - type: CFItemPrice
    copper: 25000 # moderate: 1d4 x 100 gp
    fullResale: true

