- type: entity
  parent: CFSpellArea
  id: CFCalm
  name: Calm
  description: Creatures in a 10-foot burst that fail a Will save stop fighting.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 2
  - type: CFSpell
    spell: Calm
    rank: 2
  - type: CFTargeting
    rangeFeet: 120
  - type: CFAreaEffect
    shape: Burst
    sizeFeet: 10
  - type: CFCheck
    defense: Will
    basicSave: false
  - type: CFDegreeEffects
    landed:
    - !type:CFApplyConditionEffect
      condition: Calmed
