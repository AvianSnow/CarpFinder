# PF2e coins. Use a stack in hand to put it in your wallet (CFWallet), which is where money is spent from.

- type: entity
  abstract: true
  parent: BaseItem
  id: CFBaseCoin
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Tiny
  - type: Stack
    baseLayer: base
    layerStates:
    - coin1
    - coin2
    - coin3
    - coin4
    - coin5
    - coin6
    - coin7
    - coin8
    - coin9
    - coin10
  - type: Appearance
  - type: CFBulk
    bulk: 0
  - type: EmitSoundOnPickup
    sound:
      collection: Coin

- type: entity
  parent: CFBaseCoin
  id: CFCopperCoin
  name: copper coin
  description: The smallest coin.
  suffix: 10
  components:
  - type: Sprite
    sprite: /Textures/_CP14/Objects/Economy/cp_coin.rsi
    layers:
    - state: coin10
      map: ["base"]
  - type: Stack
    stackType: CFCopperCoin
    count: 10
  - type: CFCoin
    copper: 1

- type: entity
  parent: CFCopperCoin
  id: CFCopperCoin1
  suffix: 1
  components:
  - type: Sprite
    layers:
    - state: coin1
      map: ["base"]
  - type: Stack
    count: 1

- type: entity
  parent: CFBaseCoin
  id: CFSilverCoin
