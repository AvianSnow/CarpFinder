# CarpFinder: an Animist attunes to two apparitions. Each is offered in both slots, and a build can only have it once.

- type: cfClassChoice
  id: PrimaryCrafter
  class: Animist
  slot: cf-class-choice-apparition-primary
  group: Crafter
  name: cf-class-choice-primarycrafter
  description: cf-class-choice-primarycrafter-desc
  trainedSkills:
    - Lore
  grants:
    - !type:CFGrantApparition
      primary: true
      spells:
        - Sigil

