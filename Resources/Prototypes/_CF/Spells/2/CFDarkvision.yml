- type: entity
  parent: CFSpellTarget
  id: CFDarkvision
  name: Darkvision
  description: The target gains darkvision.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 2
  - type: CFSpell
    spell: Darkvision
    rank: 2
  - type: CFTargeting
    rangeFeet: 5
    touch: true
    filter: All
  - type: CFDegreeEffects
    landed:
    - !type:CFApplyConditionEffect
      condition: Darkvision
  - type: EntityTargetAction
    canTargetSelf: true
