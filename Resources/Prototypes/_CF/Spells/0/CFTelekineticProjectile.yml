- type: entity
  parent: CFSpellProjectile
  id: CFTelekineticProjectile
  name: Telekinetic Projectile
  description: You hurl an object. Spell attack, 1d6 plus your spellcasting modifier.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: TelekineticProjectile
    rank: 0
  - type: CFTargeting
    rangeFeet: 30
  - type: CFCheck
    defense: ArmorClass
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 6
      damageType: Bludgeoning
      addAbilityModifier: true
      heightenDice: 1
  - type: CFHeighten
    baseRank: 1
    interval: 2
