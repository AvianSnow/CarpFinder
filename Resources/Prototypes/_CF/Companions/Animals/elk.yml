# Young Elk. Ancestry Hit Points 8. At 1st level that is 16 Hit Points.
- type: cfPet
  id: CFPetElk
  name: Elk
  kind: Companion
  entity: CFCompanionElk
  size: "Medium or Large"
  strength: 3
  dexterity: 2
  constitution: 2
  intelligence: -4
  wisdom: 1
  charisma: 0
  hitPoints: 8
  description: "A young elk companion. It is built to be ridden."
  mount: true
  speeds:
    - name: Speed
      feet: 30
  senses:
    - "low-light vision"
  attacks:
    - name: "Antlers"
      die: 8
      damage: piercing
    - name: "Hoof"
      die: 6
      damage: bludgeoning
      agile: true
  skills:
    - name: Intimidation
      ability: Charisma
  support: "Until your next turn, a creature in its reach that you damage becomes frightened 1."
  advanced: "Antler Catapult"

- type: entity
  parent: [ MobReindeerBuck, CFCompanionBase ]
  id: CFCompanionElk
  name: elk companion
  description: "A young elk companion. It is built to be ridden."
  suffix: Companion
  components:
  - type: HTN
    rootTask:
      task: CFGOAPCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 15
    maxHp: 16
    currentHp: 16
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 3
      Dexterity: 2
      Constitution: 2
      Intelligence: -4
      Wisdom: 1
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 8
    naturalType: piercing
    naturalFinesse: false
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      16: Dead
