# Plague Zombie. Creature 1, Medium, Mindless Undead Unholy Zombie. Monster Core p. 356. Recall Knowledge DC 15.
# Fist with Grab and zombie rot (Afflictions/monsters.yml), slowed 1 for good, weakness to slashing and vitality.
# Not in yet: Zombie Bite. Zombie rot stops at stage 4: rising as a plague zombie at stage 5 is left out.
# The sprite is the zombie shambler's, tinted.
- type: entity
  parent: [CFBaseCreature]
  id: CFMobPlagueZombie
  name: plague zombie
  description: A bloated corpse, wet with rot that spreads to whatever it gets its hands on.
  components:
    - type: GhostRole
      name: cf-ghost-plague-zombie-name
      description: cf-ghost-plague-zombie-desc
    - type: Sprite
      drawdepth: Mobs
      color: "#A8C878"
      layers:
        - map: ["enum.DamageStateVisualLayers.Base"]
          sprite: _CP14/Mobs/Species/Zombie/parts.rsi
          state: full
    - type: DamageStateVisuals
      states:
        Alive:
          Base: full
        Critical:
          Base: full
        Dead:
          Base: full
    - type: MovementSpeedModifier
      baseWalkSpeed: 2.5
      baseSprintSpeed: 4.5
    - type: CFSenses
      darkvision: true
    - type: NightVision
      enabled: true
      prioritized: true
      noiseAmount: 0
      lightingColor: "#9BB6FF30"
    - type: CFLanguages
      known: [ Mindless ]
    - type: CFGOAP
      tactics: Mindless
    - type: CFInnateConditions
      conditions:
        Slowed: 1
    - type: CFVoidHealing
    - type: CFResistances
      entries:
      - damageType: Slashing
        amount: 10
        weakness: true
      - damageType: Vitality
        amount: 10
        weakness: true
      - damageType: Bleed
        amount: 9999
      - damageType: Mental
        amount: 9999
      - damageType: Poison
        amount: 9999
      - damageType: Void
        amount: 9999
    # Immunities: bleed, death effects, disease, mental, paralyzed, poison, unconscious.
    - type: CFConditionImmunity
      conditions: [ Asleep, Paralyzed, Calmed, Charmed, Frightened, Confused, Controlled, Fleeing ]
      traits: [ Mental, Death, Disease, Poison ]
    - type: CFCombatant
      level: 1
      armorClass: 13
      speedFeet: 25
      maxHp: 50
      currentHp: 50
      printedFortitude: 6
      printedReflex: 3
      printedWill: 4
      printedPerception: 3
      printedAttack: 9
      printedDamage: 4
      trainedSkills:
        - Athletics
      printedSkills:
        Athletics: 9
    - type: CFAbilityScore
      abilityModifiers:
        Strength: 4
        Dexterity: -2
        Constitution: 3
        Intelligence: -5
        Wisdom: 0
        Charisma: -2
    # Each Strike with its own printed numbers. With no player in the body the AI picks (CFMonsterAttackSystem).
    - type: CFMonsterAttacks
      attacks:
      - name: fist
        attack: 9
        dice: 1
        die: 8
        bonus: 4
        damageType: Bludgeoning
        followUp: Grab
        onHit:
        - !type:CFExposeAfflictionEffect
          affliction: ZombieRot
    - type: CFCombatOptions
      naturalDice: 1
      naturalDie: 8
      naturalType: Bludgeoning
      naturalAgile: false
      naturalFinesse: false
    - type: CFTrait
      traits:
        - Mindless
        - Undead
        - Unholy
        - Zombie
    - type: MobThresholds
      thresholds:
        0: Alive
        49: Critical
        50: Dead
