  - type: CFRadialSlot
    group: Spell
    spellRank: 0
    actions: 2
  - type: CFSpell
    spell: PushingGust
    rank: 0
    focus: true
  - type: CFTargeting
    rangeFeet: 500
  - type: CFCheck
    defense: Fortitude
    basicSave: false
  - type: CFDegreeEffects
