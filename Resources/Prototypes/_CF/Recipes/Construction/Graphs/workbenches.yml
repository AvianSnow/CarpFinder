- type: constructionGraph
  id: CFWorkbench
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: CFWorkbench
          steps:
            - material: CFWoodenPlanks
              amount: 3
              doAfter: 2
    - node: CFWorkbench
      entity: CFWorkbench
      edges:
      - to: start
        steps:
        - tool: Prying
          doAfter: 5
        completed:
        - !type:SpawnPrototype
          prototype: CFWoodenPlanks1
          amount: 3

