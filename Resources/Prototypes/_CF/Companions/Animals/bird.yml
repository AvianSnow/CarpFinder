# Young Bird. Ancestry Hit Points 4. At 1st level that is 11 Hit Points.
- type: cfPet
  id: CFPetBird
  name: Bird
  kind: Companion
  entity: CFCompanionBird
  size: "Small"
  strength: 2
  dexterity: 3
  constitution: 1
  intelligence: -4
  wisdom: 2
  charisma: 0
  hitPoints: 4
  description: "A young bird companion."
  speeds:
    - name: Speed
      feet: 10
    - name: fly
      feet: 60
  senses:
    - "low-light vision"
  attacks:
    - name: "Jaws"
      die: 6
      damage: piercing
      finesse: true
    - name: "Talon"
      die: 4
      damage: slashing
      agile: true
      finesse: true
  skills:
    - name: Stealth
      ability: Dexterity
  support: "Until your next turn, a damaging Strike against a creature it threatens also deals 1d4 persistent bleed and dazzles the target until the bleed ends."
  advanced: "Flyby Attack"

- type: entity
  parent: [ MobParrot, CFCompanionBase ]
  id: CFCompanionBird
  name: bird companion
  description: "A young bird companion."
  suffix: Companion
  components:
  - type: HTN
    rootTask:
      task: CFGOAPCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 16
    maxHp: 11
    currentHp: 11
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 2
      Dexterity: 3
      Constitution: 1
      Intelligence: -4
      Wisdom: 2
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 6
    naturalType: piercing
    naturalFinesse: true
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      11: Dead
