# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Commander
  name: cf-class-commander
  description: cf-class-description-commander
  hitPoints: 8
  keyAbility: Intelligence
  hitPointsAbility: Constitution
  classDC: cf-class-commander
  proficiencies:
    perception:
      expert:
        - Perception
    savingThrows:
      trained:
        - Fortitude
      expert:
        - Reflex
        - Will
    skills:
      trained:
        - Society
    attacks:
      trained:
        - MartialWeapons
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - MediumArmor
        - HeavyArmor
        - LightArmor
  additionalSkillTrainings: 2
  features:
    - level: 1
      name: "Commander's Banner"
      description: "A banner that inspires allies near it: TBA"
    - level: 1
      name: "Drilled Reactions"
      description: "Give an ally an extra reaction with a tactic. Tactics are not built yet: TBA"
    - level: 1
      name: "Shield Block"
      description: "You can spend your reaction to block damage with a raised shield."
      grants:
        - !type:CFGrantOption
          option: ShieldBlock
    - level: 1
      name: "Tactics"
      description: "Coordinated maneuvers for your allies, from a folio: TBA"
    - level: 3
      name: "Warfare Expertise"
      description: "Expert in Warfare Lore: TBA"
    - level: 5
      name: "Military Expertise"
      description: "Expert with simple weapons, martial weapons and unarmed attacks. Critical specialization: TBA"
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - SimpleWeapons
            - MartialWeapons
            - Unarmed
          rank: Expert
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
