# Ported from CP14 by the CF converter.

- type: entity
  id: CFBasePallets
  abstract: true
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: Sprite
    sprite: _CP14/Structures/Furniture/pallets.rsi
    snapCardinals: true
    drawdepth: FloorTiles
  - type: Transform
    anchored: true
  - type: Tag
    tags:
      - Catwalk

- type: entity
  id: CFWoodenPallet
  parent:
  - CFBasePallets
  - CFBaseFlammable
  name: wooden pallet
  description: Wooden goods stand.
  components:
  - type: Sprite
    state: wooden
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWood
  - type: Damageable
    damageModifierSet: CFWood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CFWoodenPlanks1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: CFWoodenPallet
    node: CFWoodenPallet

- type: entity
  id: CFWoodenPalletSell
  parent: CFWoodenPallet
  name: selling wooden pallet
  components:
  - type: Sprite
    layers:
    - state: wooden
    - state: sell

- type: entity
  id: CFWoodenPalletBuy
  parent: CFWoodenPallet
  name: buying wooden pallet
  components:
  - type: Sprite
    layers:
    - state: wooden
    - state: buy
