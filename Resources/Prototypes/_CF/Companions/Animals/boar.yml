  kind: Companion
  entity: CFCompanionBoar
  size: "Small"
  strength: 3
  dexterity: 1
  constitution: 2
  intelligence: -4
  wisdom: 2
  charisma: 0
  hitPoints: 8
  description: "A young boar companion."
  speeds:
    - name: Speed
      feet: 35
  senses:
    - "low-light vision"
    - "scent (imprecise, 30 feet)"
  attacks:
