      die: 4
      damageType: Electricity
      diceEveryLevels: 2

- type: entity
  parent: CFActKoboldBreathBase
  id: CFActKoboldBreathAcid
  components:
  - type: CFTrait
    traits: [Arcane, Acid]
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 4
      damageType: Acid
      diceEveryLevels: 2

- type: entity
  parent: CFActKoboldBreathBase
  id: CFActKoboldBreathSonic
  components:
  - type: CFTrait
    traits: [Arcane, Sonic]
  - type: CFDegreeEffects
    effects:
    - !type:CFDamageEffect
      dice: 1
      die: 4
      damageType: Sonic
