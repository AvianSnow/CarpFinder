- type: entity
  parent: CFSpellTarget
  id: CFLight
  name: Light
  description: The target sheds bright light.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: Light
    rank: 0
  - type: CFTargeting
    rangeFeet: 120
    filter: All
  - type: CFDegreeEffects
    landed:
    - !type:CFPopupEffect
      text: cf-spell-light
  - type: EntityTargetAction
    canTargetSelf: true
