# Young Snake. Ancestry Hit Points 6. At 1st level that is 13 Hit Points.
- type: cfPet
  id: CFPetSnake
  name: Snake
  kind: Companion
  entity: CFCompanionSnake
  size: "Small"
  strength: 3
  dexterity: 3
  constitution: 1
  intelligence: -4
  wisdom: 1
  charisma: 0
  hitPoints: 6
  description: "A young snake companion."
  speeds:
    - name: Speed
      feet: 20
    - name: climb
      feet: 20
    - name: swim
      feet: 20
  senses:
    - "low-light vision"
    - "scent (imprecise, 30 feet)"
  attacks:
    - name: "Jaws"
      die: 8
      damage: piercing
      finesse: true
  skills:
    - name: Stealth
      ability: Dexterity
  support: "Until your next turn, a creature it threatens cannot use reactions triggered by your actions unless its level is higher than yours."
  advanced: "Constrict"

- type: entity
  parent: [ MobSnake, CFCompanionBase ]
  id: CFCompanionSnake
  name: snake companion
  description: "A young snake companion."
  suffix: Companion
  components:
  - type: HTN
    rootTask:
      task: CFCompanionCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 16
    maxHp: 13
    currentHp: 13
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 3
      Dexterity: 3
      Constitution: 1
      Intelligence: -4
      Wisdom: 1
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 8
    naturalType: piercing
    naturalFinesse: true
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      13: Dead
