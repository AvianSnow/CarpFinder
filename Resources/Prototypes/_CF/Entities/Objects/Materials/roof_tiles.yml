# CrystallEdge's roof tiles: laid as a floor (the CFRoof* tiles) or on a stairs frame as a roof ramp. The sprites
# are CrystallEdge's, in Textures/_CE (Objects/tile.rsi and Tiles/roof_*.png).

- type: entity
  parent: CFFloorTileBase
  id: CFFloorTileRoofRed
  name: red roof tile
  components:
  - type: Sprite
    sprite: _CE/Objects/tile.rsi
    state: roof_red
  - type: Item
    sprite: _CE/Objects/tile.rsi
  - type: FloorTile
    outputs:
    - CFRoofRed
  - type: Stack
    stackType: CFFloorTileRoofRed
  - type: PhysicalComposition
    materialComposition:
      CFStone: 2

