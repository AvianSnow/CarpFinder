# Stone stairs

- type: entity
  id: CFZLevelStairsStoneBase
  abstract: true
  name: stone stairs
  components:
  - type: Sprite
    sprite: _CE/Structures/Architecture/Stairs/stone.rsi
  - type: Damageable
    damageModifierSet: CFRockStructural
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          CFStoneBlock1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
