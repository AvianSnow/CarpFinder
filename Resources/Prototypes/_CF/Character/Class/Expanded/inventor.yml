# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Inventor
  name: cf-class-inventor
  description: cf-class-description-inventor
  hitPoints: 8
  keyAbility: Intelligence
  hitPointsAbility: Constitution
  classDC: cf-class-inventor
  proficiencies:
    perception:
      trained:
        - Perception
    savingThrows:
      trained:
        - Reflex
      expert:
        - Fortitude
        - Will
    skills:
      trained:
        - Crafting
    attacks:
      trained:
        - MartialWeapons
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - MediumArmor
        - LightArmor
  additionalSkillTrainings: 3
  rarity: Uncommon
  features:
    - level: 1
      name: "Explode"
      description: "Explosions from your innovation: TBA"
    - level: 1
      name: "Innovation"
      description: "Choose an innovation in the builder. Building each one: TBA"
    - level: 1
      name: "Overdrive"
      description: "Push your devices for extra damage: TBA"
    - level: 1
      name: "Peerless Inventor"
      description: "The Inventor skill feat: TBA"
    - level: 1
      name: "Shield Block"
      description: "You can spend your reaction to block damage with a raised shield."
      grants:
        - !type:CFGrantOption
          option: ShieldBlock
    - level: 3
      name: "Expert Overdrive"
      description: "Expert in Crafting. Better Overdrive: TBA"
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Crafting
          rank: Expert
    - level: 3
      name: "Reconfigure"
      description: "Change your innovation in downtime: TBA"
    - level: 5
      name: "Inventor Weapon Expertise"
      description: "Expert with simple weapons, martial weapons and unarmed attacks. Critical specialization: TBA"
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - SimpleWeapons
            - MartialWeapons
            - Unarmed
          rank: Expert
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
