# Young Cat. Ancestry Hit Points 4. At 1st level that is 11 Hit Points.
- type: cfPet
  id: CFPetCat
  name: Cat
  kind: Companion
  entity: CFCompanionCat
  size: "Small"
  strength: 2
  dexterity: 3
  constitution: 1
  intelligence: -4
  wisdom: 2
  charisma: 0
  hitPoints: 4
  description: "A young cat companion. It deals 1d4 extra precision damage to off-guard creatures."
  speeds:
    - name: Speed
      feet: 35
  senses:
    - "low-light vision"
    - "scent (imprecise, 30 feet)"
  attacks:
    - name: "Jaws"
      die: 6
      damage: piercing
      finesse: true
    - name: "Claw"
      die: 4
      damage: slashing
      agile: true
      finesse: true
  skills:
    - name: Stealth
      ability: Dexterity
  support: "Until your next turn, a damaging Strike against a creature in its reach leaves that creature off-guard until the end of your next turn."
  advanced: "Cat Pounce"

- type: entity
  parent: [ MobCat, CFCompanionBase ]
  id: CFCompanionCat
  name: cat companion
  description: "A young cat companion. It deals 1d4 extra precision damage to off-guard creatures."
  suffix: Companion
  components:
  - type: HTN
    rootTask:
      task: CFCompanionCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 16
    maxHp: 11
    currentHp: 11
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 2
      Dexterity: 3
      Constitution: 1
      Intelligence: -4
      Wisdom: 2
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 6
    naturalType: piercing
    naturalFinesse: true
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      11: Dead
