# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Inventor
  name: cf-class-inventor
  description: cf-class-description-inventor
  hitPoints: 8
  keyAbility: Intelligence
  hitPointsAbility: Constitution
  classDC: cf-class-inventor
  proficiencies:
    perception:
      trained:
        - Perception
    savingThrows:
      trained:
        - Reflex
      expert:
        - Fortitude
        - Will
    skills:
      trained:
        - Crafting
    attacks:
      trained:
        - MartialWeapons
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - MediumArmor
        - LightArmor
  additionalSkillTrainings: 3
  rarity: Uncommon
  features:
    - level: 1
      name: "Explode"
      description: "Explode is on your action wheel. An unstable action: fire around your innovation, and your innovation may stop working until retuned."
      grants:
        - !type:CFGrantAction
          action: CFActExplode
    - level: 1
      name: "Innovation"
      description: "Choose an innovation and a modification in the builder. You start with it. Rebuilding one that is destroyed: TBA"
    - level: 1
      name: "Overdrive"
      description: "Overdrive is on your action wheel. A Crafting check: your Strikes deal half your Intelligence more for a minute, or all of it on a critical success. A critical failure burns you."
      grants:
        - !type:CFGrantAction
          action: CFActOverdrive
    - level: 1
      name: "Peerless Inventor"
      description: "The Inventor skill feat: TBA"
    - level: 1
      name: "Shield Block"
      description: "You can spend your reaction to block damage with a raised shield."
      grants:
        - !type:CFGrantOption
          option: ShieldBlock
    - level: 3
      name: "Expert Overdrive"
      description: "Expert in Crafting, and Overdrive adds 1 more damage."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Crafting
          rank: Expert
        - !type:CFGrantOption
          option: ExpertOverdrive
    - level: 3
      name: "Reconfigure"
      description: "Change your innovation in downtime: TBA"
    - level: 5
      name: "Inventor Weapon Expertise"
      description: "Expert with simple weapons, martial weapons and unarmed attacks. Critical specialization: TBA"
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - SimpleWeapons
            - MartialWeapons
            - Unarmed
          rank: Expert
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
