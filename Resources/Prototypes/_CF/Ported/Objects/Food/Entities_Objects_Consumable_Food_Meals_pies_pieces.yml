# Ported from CP14 by the CF converter.

- type: entity
  parent: FoodInjectableBase
  id: CFFoodPiePieceBase
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Tiny
  - type: Temperature
  - type: Sprite
    sprite: _CP14/Objects/Consumable/Food/Pies/pieces.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 7
        - ReagentId: Protein
          Quantity: 2

- type: entity
  id: CFFoodPiePieceTrash
  parent: CFFoodPiePieceBase
  name: a piece of disgusting pie
  description: On the outside, it looked appealing and delicious, but on the inside, it was simply awful.
  components:
  - type: CFItemPrice
    copper: 3
  - type: Sprite
    layers:
    - state: blank
    - state: trash

- type: entity
