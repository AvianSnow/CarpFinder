# Zombie Rot (disease), from the plague zombie. Saving Throw DC 18 Fortitude. Stage 1 carrier with no ill effect (1 day),
# stages 2 to 4 1d6 void damage (1 day each). Left out: stage 5, dead and rising as a plague zombie, and that the damage
# cannot be healed until the disease is cured. A day on the world clock is a whole round, as with putrid plague.
- type: cfAffliction
  id: ZombieRot
  dc: 18
  traits: [ Disease ]
  exposureCooldownSeconds: 60
  stages:
  - worldMinutes: 1440
  - worldMinutes: 1440
    effects:
    - !type:CFPopupEffect
      text: cf-affliction-zombie-rot
      userOnly: true
    - !type:CFDamageEffect
      dice: 1
      die: 6
      damageType: Void
      scaleByDegree: false
  - worldMinutes: 1440
    effects:
    - !type:CFPopupEffect
      text: cf-affliction-zombie-rot
      userOnly: true
    - !type:CFDamageEffect
      dice: 1
      die: 6
      damageType: Void
      scaleByDegree: false
  - worldMinutes: 1440
    effects:
    - !type:CFPopupEffect
      text: cf-affliction-zombie-rot
      userOnly: true
    - !type:CFDamageEffect
      dice: 1
      die: 6
      damageType: Void
