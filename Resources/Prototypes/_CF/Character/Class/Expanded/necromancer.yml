# CarpFinder: remaster class, levels 1-5.
- type: cfClass
  id: Necromancer
  name: cf-class-necromancer
  description: cf-class-description-necromancer
  hitPoints: 8
  keyAbility: Intelligence
  hitPointsAbility: Constitution
  classDC: cf-class-necromancer
  proficiencies:
    perception:
      trained:
        - Perception
    savingThrows:
      trained:
        - Reflex
        - Will
      expert:
        - Fortitude
    skills:
      trained:
        - Occultism
    attacks:
      trained:
        - SimpleWeapons
        - Unarmed
    defenses:
      trained:
        - Unarmored
        - LightArmor
  additionalSkillTrainings: 2
  spellcasting:
    tradition: Occult
    ability: Intelligence
    cantrips: 5
    slots:
      - 1
    laterSlots:
      - [ 2 ]
      - [ 2, 1 ]
      - [ 2, 2 ]
      - [ 2, 2, 1 ]
    prepared: true
  features:
    - level: 1
      name: "Fatal Method"
      description: "Choose a fatal method in the builder."
    - level: 1
      name: "Grave Spells"
      description: "You know Create Thrall and Thrall Charge, can Command a Thrall, and know the Necrotic Bomb grave spell. Your fascination adds another. Refocus with a thrall within 30 feet destroys it and gives back 2 Focus Points."
      grants:
        - !type:CFGrantThralls {}
        - !type:CFGrantSpell
          spell: CreateThrall
        - !type:CFGrantSpell
          spell: ThrallCharge
        - !type:CFGrantAction
          action: CFActCommandThrall
        - !type:CFGrantFocusSpell
          spell: NecroticBomb
    - level: 1
      name: "Grim Fascination"
      description: "Choose a grim fascination in the builder. It gives you a grave spell and improves your thralls."
    - level: 1
      name: "Mastery of Life and Death"
      description: "A spell of yours that deals void or vitality damage deals whichever hurts each enemy, so Heal and Harm never heal an enemy. Healing is unchanged."
      grants:
        - !type:CFGrantOption
          option: MasteryOfLifeAndDeath
    - level: 1
      name: "Necromancer Spellcasting"
      description: "Level 1 cantrips and spell slots are on the spell sheet."
    - level: 1
      name: "Undead Lore"
      description: "Trained in Undead Lore. Lore is one skill here, so the name is what differs, and it is not kept to undead."
      grants:
        - !type:CFGrantLore
          lore: Undead
    - level: 3
      name: "Inevitable Return"
      description: "Reaction, automatic. When an enemy within 30 feet dies, a thrall rises where it fell. Size is not checked."
      grants:
        - !type:CFGrantReaction
          reaction:
            name: cf-reaction-inevitable-return
            trigger: CreatureDied
            rangeFeet: 30
            createsThrall: true
    - level: 3
      name: "Mental Wards"
      description: "Expert in Will saves, and a success on a Will save against an undead creature's effect is a critical success. The rules keep that to mental and possession effects."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Will
          rank: Expert
        - !type:CFGrantSaveUpgrade
          save: Will
          trait: Undead
    - level: 3
      name: "Undead Lore Expertise"
      description: "Expert in Undead Lore."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Lore
          rank: Expert
    - level: 5
      name: "Reflex Expertise"
      description: "Expert in Reflex saves."
      grants:
        - !type:CFGrantProficiency
          proficiencies:
            - Reflex
          rank: Expert
  # Class key-attribute boost is applied from keyAbility in code (PF2e).
