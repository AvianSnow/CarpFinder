  id: CFHaste
  name: Haste
  description: The target is quickened and can hold 4 actions.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 3
  - type: CFSpell
    spell: Haste
    rank: 3
  - type: CFTargeting
    rangeFeet: 30
    filter: All
  - type: CFDegreeEffects
