# Young Kangaroo. Ancestry Hit Points 6. At 1st level that is 14 Hit Points.
- type: cfPet
  id: CFPetKangaroo
  name: Kangaroo
  kind: Companion
  entity: CFCompanionKangaroo
  size: "Small"
  strength: 3
  dexterity: 2
  constitution: 2
  intelligence: -4
  wisdom: 1
  charisma: 0
  hitPoints: 6
  description: "A young kangaroo companion. A horizontal Leap carries it up to 25 feet."
  speeds:
    - name: Speed
      feet: 30
  senses:
    - "low-light vision"
  attacks:
    - name: "Foot"
      die: 6
      damage: bludgeoning
      agile: true
  skills:
    - name: Survival
      ability: Wisdom
  support: "Until your next turn, it can count as occupying an empty square within 5 feet when checking whether the two of you flank."
  advanced: "Spring Kick"

- type: entity
  parent: [ MobKangaroo, CFCompanionBase ]
  id: CFCompanionKangaroo
  name: kangaroo companion
  description: "A young kangaroo companion. A horizontal Leap carries it up to 25 feet."
  suffix: Companion
  components:
  - type: HTN
    rootTask:
      task: CFGOAPCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 15
    maxHp: 14
    currentHp: 14
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 3
      Dexterity: 2
      Constitution: 2
      Intelligence: -4
      Wisdom: 1
      Charisma: 0
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 6
    naturalType: bludgeoning
    naturalFinesse: false
    naturalAgile: true
  - type: MobThresholds
    thresholds:
      0: Alive
      14: Dead
