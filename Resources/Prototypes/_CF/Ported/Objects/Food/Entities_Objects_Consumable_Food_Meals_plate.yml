# Ported from CP14 by the CF converter.

- type: entity
  id: CFPlateBase
  parent: BaseItem
  description: This is your plate for a delicious meal!
  categories: [ ForkFiltered ]
  abstract: true
  components:
  - type: Sprite
    noRot: true
    sprite: _CP14/Objects/Consumable/Food/Meals/plates.rsi
  - type: Item
    shape:
    - 0,0,1,0
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
  - type: Appearance
  - type: SolutionContainerVisuals
  - type: Edible
    transferAmount: 2.5
  - type: Spillable
    solution: food

- type: entity
  id: CFPlateWooden
  parent: CFPlateBase
  name: wooden plate
  components:
  - type: Sprite
    layers:
    - state: wooden
    - map: ["cp14_foodLayers"]
  - type: PhysicalComposition
    materialComposition:
      CFWoodenPlanks: 20
  - type: Edible
    trash: 
    - CFPlateWooden

- type: entity
  id: CFPlateIron
  parent: CFPlateBase
  name: iron plate
  components:
  - type: Sprite
    layers:
    - state: iron
    - map: ["cp14_foodLayers"]
  - type: PhysicalComposition
    materialComposition:
      CFIron: 10
  - type: Edible
    trash: 
    - CFPlateIron

- type: entity
  id: CFPlateGold
  parent: CFPlateBase
  name: gold plate
  components:
  - type: Sprite
    layers:
    - state: gold
    - map: ["cp14_foodLayers"]
  - type: PhysicalComposition
    materialComposition:
      CFGold: 10
  - type: Edible
    trash: 
    - CFPlateGold
