- type: entity
  parent: CFSpellTarget
  id: CFGuidance
  name: Guidance
  description: The target gains a +1 status bonus to attack rolls.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
  - type: CFRadialSlot
    group: Spell
    spellRank: 0
  - type: CFSpell
    spell: Guidance
    rank: 0
  - type: CFTargeting
    rangeFeet: 30
    filter: All
  - type: CFDegreeEffects
    landed:
    - !type:CFBonusEffect
      stat: AttackRoll
      type: Status
      value: 1
  - type: EntityTargetAction
    canTargetSelf: true
