# Young Shadow Hound. Ancestry Hit Points 4. At 1st level that is 11 Hit Points.
- type: cfPet
  id: CFPetShadowHound
  name: Shadow Hound
  kind: Companion
  entity: CFCompanionShadowHound
  size: "Small"
  strength: 2
  dexterity: 3
  constitution: 1
  intelligence: -4
  wisdom: 1
  charisma: 1
  hitPoints: 4
  description: "A young shadow hound companion."
  speeds:
    - name: Speed
      feet: 30
  senses:
    - "darkvision"
    - "scent (imprecise, 30 feet)"
  attacks:
    - name: "Jaws"
      die: 8
      damage: piercing
      finesse: true
  skills:
    - name: Intimidation
      ability: Charisma
  support: "Until your next turn, when you damage a creature in its reach, you and the hound are concealed to that creature until the end of your next turn."
  advanced: "Bay"

- type: entity
  parent: [ MobCorgi, CFCompanionBase ]
  id: CFCompanionShadowHound
  name: shadow hound companion
  description: "A young shadow hound companion."
  suffix: Companion
  components:
  - type: HTN
    rootTask:
      task: CFCompanionCompound
  - type: NpcFactionMember
    factions:
    - Passive
  - type: CFCombatant
    level: 1
    armorClass: 16
    maxHp: 11
    currentHp: 11
  - type: CFAbilityScore
    abilityModifiers:
      Strength: 2
      Dexterity: 3
      Constitution: 1
      Intelligence: -4
      Wisdom: 1
      Charisma: 1
  - type: CFCombatOptions
    naturalDice: 1
    naturalDie: 8
    naturalType: piercing
    naturalFinesse: true
    naturalAgile: false
  - type: MobThresholds
    thresholds:
      0: Alive
      11: Dead
