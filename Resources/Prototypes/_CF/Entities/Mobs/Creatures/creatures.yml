# Hunting spider, the common giant spider. Creature 1, Medium, Animal. Monster Core p. 320. Recall Knowledge DC 15.
# The body is the stock tarantula's. It leaves out stock's Spider component, which would spawn stock webs.
# Not in yet: hunting spider venom, the web Strike and Web Trap, web sense, Spring Upon Prey, Descend on a Web, and the climb Speed.
# It is an animal, so an encounter should set "tactics: Beast".
- type: entity
  parent: [CFBaseCreature, BaseSlicingRefinableButchering]
  id: CFMobHuntingSpider
  name: hunting spider
  description: A spider the size of a large dog that runs its prey down.
  components:
    - type: Sprite
      drawdepth: Mobs
      sprite: Mobs/Animals/Spiders/tarantulaspider.rsi
      layers:
        - map: ["enum.DamageStateVisualLayers.Base", "movement"]
          state: idle
    - type: SpriteMovement
      movementLayers:
        movement:
          state: moving
      noMovementLayers:
        movement:
          state: idle
    - type: DamageStateVisuals
      states:
        Alive:
          Base: idle
        Critical:
          Base: dead
        Dead:
          Base: dead
    - type: MovementSpeedModifier
      baseWalkSpeed: 2.5
      baseSprintSpeed: 4.5
    - type: NightVision
      enabled: true
      prioritized: true
      noiseAmount: 0
      lightingColor: "#9BB6FF30"
    - type: IgnoreSpiderWeb
    - type: CFCombatant
      level: 1
      armorClass: 17
      speedFeet: 25
      maxHp: 16
      currentHp: 16
      diesAtZeroHp: true
      printedFortitude: 6
      printedReflex: 9
      printedWill: 5
      printedPerception: 7
      printedAttack: 9
      printedDamage: 2
      trainedSkills:
        - Acrobatics
        - Athletics
        - Stealth
      printedSkills:
        Acrobatics: 7
        Athletics: 5
        Stealth: 7
    - type: CFAbilityScore
      abilityModifiers:
        Strength: 2
        Dexterity: 4
        Constitution: 1
        Intelligence: -5
        Wisdom: 2
        Charisma: -4
    - type: CFCombatOptions
      naturalDice: 1
      naturalDie: 6
      naturalType: Piercing
      naturalAgile: false
      naturalFinesse: true
    - type: CFTrait
      traits:
        - Animal
    - type: MobThresholds
      thresholds:
        0: Alive
        15: Critical
        16: Dead
    - type: ToolRefinable
      refineResult:
        - id: FoodMeatSpider
          amount: 2

